# How the app is packed for each system. The Mac's is signed with the certificate it is given
# (CSC_LINK) and checked by Apple; with none it is packed from electron-builder.unsigned.yml,
# as `pnpm package` does. Nobody signs the Windows one. See docs/reference/desktop.md for what that means for
# whoever opens it.
appId: computer.do.desktop
productName: Do Computer
# A name without a space in it, for whoever downloads it from a terminal.
artifactName: Do-Computer-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: assets
# Everything the app runs is already in dist/, as a few files. It has no node_modules to bring.
files:
  - dist/**
  - "!dist/driver/**"
  - package.json
# The driver that uses the screen for agents is programs for one system, which cannot be run
# from inside the app's one packed file. It goes beside it: Resources/driver/node_modules.
extraResources:
  # Named whole, because a folder called node_modules is otherwise left behind.
  - from: dist/driver/node_modules
    to: driver/node_modules
    filter: ["**/*"]
  # Whose work the driver, the app's fonts and some of its code are, and on what terms.
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
npmRebuild: false
# Nowhere, unless the packing is told where: a release is, by the Desktop workflow, and then
# knows where newer ones are published and keeps itself up to date from there. A copy packed
# without that stays as it is.
publish: null
mac:
  category: public.app-category.productivity
  # No identity is named: the certificate in CSC_LINK signs it, as a Developer ID. macOS then
  # knows the app by who signed it, and keeps what its owner allowed it (Accessibility, Screen
  # Recording) from one version to the next. An app signed by nobody in particular is another
  # app to macOS with every build, and is asked for both again.
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  # A Mac's icons leave room around themselves, which this one does and the others do not.
  icon: assets/icon-mac.png
  target:
    - target: dmg
      arch: [universal]
    # What a Mac that has the app fetches to become the next version: macOS takes a newer
    # app as a .zip, not as the .dmg its owner first opened.
    - target: zip
      arch: [universal]
  # The driver's programs for each kind of chip are the same files in both halves of the
  # app, which joining the halves takes for a mistake unless it is told to expect it.
  x64ArchFiles: "**/driver/node_modules/**"
  extendInfo:
    NSMicrophoneUsageDescription: Dictating a message to an agent uses the microphone.
    NSAppleEventsUsageDescription: A command an agent runs on this Mac asked another app to do something.
win:
  icon: assets/icon.png
  target: [nsis]
# What an AppImage starts itself with: the newer of the two there are. The older one needs a
# library (libfuse2) that Linux distributions no longer bring, and where it is missing the app
# can only be run unpacked, which is a copy that cannot replace itself with a newer one.
toolsets:
  appimage: "1.0.3"
linux:
  icon: assets/icon.png
  category: Utility
  executableName: do-computer
  target: [AppImage]
