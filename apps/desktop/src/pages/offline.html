<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <link rel="stylesheet" href="pages.css" />
    <title>Do Computer</title>
  </head>
  <body>
    <main class="centered">
      <img class="blob" src="../assets/mark.svg" alt="" />
      <h1 id="title">Cannot reach Do Computer</h1>
      <p class="quiet" id="words">
        <span id="server"></span> did not answer. Trying again every few seconds.
      </p>
      <div class="row">
        <button id="retry" class="primary" type="button">Try now</button>
        <button id="change" type="button">Change server…</button>
      </div>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
