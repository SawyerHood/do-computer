<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <link rel="stylesheet" href="pages.css" />
    <title>Do Computer</title>
  </head>
  <body>
    <main class="centered">
      <svg class="blob" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#242829" />
        <ellipse cx="32" cy="37" rx="20" ry="16" fill="#3b9d9d" />
        <circle cx="25" cy="35" r="2.6" fill="#1b2021" />
        <circle cx="39" cy="35" r="2.6" fill="#1b2021" />
        <path
          d="M27.5 42c2.6 2.4 6.4 2.4 9 0"
          fill="none"
          stroke="#1b2021"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
      <h1>Cannot reach Do Computer</h1>
      <p class="quiet"><span id="server"></span> did not answer. Trying again every few seconds.</p>
      <div class="row">
        <button id="retry" class="primary" type="button">Try now</button>
        <button id="change" type="button">Change server…</button>
      </div>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
