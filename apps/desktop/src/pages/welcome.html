<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <link rel="stylesheet" href="pages.css" />
    <title>Do Computer</title>
  </head>
  <body>
    <main>
      <img class="blob" src="../assets/mark.svg" alt="" />
      <div>
        <h1>Do Computer</h1>
        <p class="quiet">Your Doods, in a window of their own.</p>
      </div>
      <form id="form" class="contents">
        <label class="field">
          Server
          <input
            id="server"
            type="text"
            placeholder="https://your-do-computer.example"
            spellcheck="false"
            autocomplete="off"
          />
          <span class="quiet small">The address of the Do Computer you use.</span>
        </label>
        <label class="check" id="share-row">
          <input id="share" type="checkbox" checked />
          <span>Let my Doods work on this computer</span>
          <span class="quiet small">
            They can run commands and read and change files here, as you. Nothing is shared until
            you have signed in and said which Doods.
          </span>
        </label>
        <label class="check" id="login-row">
          <input id="login" type="checkbox" checked />
          <span>Open Do Computer when I sign in to this computer</span>
          <span class="quiet small"
            >It stays in the tray, so your Doods can reach this computer.</span
          >
        </label>
        <p id="leaving" class="quiet small" hidden></p>
        <p id="error" class="error" role="alert" hidden></p>
        <div class="spread row">
          <span class="grow"></span>
          <button id="go" class="primary" type="submit">Continue</button>
        </div>
      </form>
    </main>
    <script src="welcome.js"></script>
  </body>
</html>
