packages:
  - "apps/*"
  - "packages/*"

# pi 1.4.0 was published on 2026-10-21; let it through the release-age gate.
minimumReleaseAgeExclude:
  - "@earendil-works/*"

allowBuilds:
  esbuild: true
  electron: true
  workerd: true
  lightningcss: true
  sharp: false
  "@google/genai": false
  protobufjs: false
  "@mongodb-js/zstd": false
  node-liblzma: false
  cbor-extract: false
  # Only the Squirrel installer for Windows needs it, and the desktop app is packed with NSIS.
  electron-winstaller: false

catalog:
  typescript: npm:@typescript/typescript6@^6.0.2
  "@typescript/native": npm:typescript@^7.0.2
  vitest: ^5.0.3
  "@types/node": ^24
  "@earendil-works/pi-durable": 1.4.0
  "@earendil-works/pi-ai": 1.4.0
  "@earendil-works/chord": 1.4.0
