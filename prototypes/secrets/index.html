<!doctype html>
<!-- A mock-up: saved passwords a Dood can sign in with and never sees. Drawn before any of it
     was built (PLAN-agent-secrets.md). Not part of the app, and everything in it is pretend.
     Open it from the file system. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved passwords · mock-up</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, input { font: inherit; color: inherit; }
      button { border: 0; background: none; padding: 0; }
      svg { flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

      /* The page around the mock-up, which is not part of the design. */
      .page { display: flex; flex-direction: column; gap: 18px; font: 14px/1.5 var(--font-sans, Geist, system-ui, sans-serif); color: var(--foreground, #24292c); }
      .lede { flex: 1; min-width: 16rem; margin: 0; max-width: 46rem; color: var(--muted-foreground, #6b7377); }
      .bar { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 20px; }
      .seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border, #d9dddf); border-radius: 9px; }
      .seg button { padding: 3px 10px; border-radius: 6px; font-size: 13px; color: var(--muted-foreground, #6b7377); cursor: pointer; }
      .seg button[aria-pressed="true"] { background: var(--secondary, #eceeef); color: var(--foreground, #24292c); }
      .group { margin: 8px 0 -6px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground, #6b7377); }
      .cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px 24px; align-items: start; }
      .cell.wide { grid-column: 1 / -1; }
      .cell h3 { margin: 10px 0 2px; font-size: 13px; font-weight: 600; }
      .cell p.note { margin: 0; max-width: 46rem; font-size: 13px; color: var(--muted-foreground, #6b7377); }

      /* The app's own tokens, copied from apps/web/src/styles.css. */
      .mock {
        --m-canvas: oklch(0.997 0.001 212);
        --m-ink: oklch(0.27 0.008 212);
        --m-frame: color-mix(in oklch, var(--m-ink) 4.5%, var(--m-canvas));
        --m-hairline: color-mix(in oklch, var(--m-ink) 10%, transparent);
        --m-shade: oklch(0.27 0.02 212);
        --m-card: 0 0 0 1px var(--m-hairline), 0 1px 2px oklch(from var(--m-shade) l c h / 0.04), 0 10px 28px -14px oklch(from var(--m-shade) l c h / 0.12);
        --m-float: 0 0 0 1px var(--m-hairline), 0 2px 5px oklch(from var(--m-shade) l c h / 0.05), 0 22px 48px -22px oklch(from var(--m-shade) l c h / 0.26);
        --m-popover: var(--m-canvas);
        --m-primary: oklch(0.5 0.08 195);
        --m-primary-fg: oklch(0.985 0.01 195);
        --m-accent: color-mix(in oklch, var(--m-ink) 8%, var(--m-canvas));
        --m-muted: color-mix(in oklch, var(--m-ink) 5%, var(--m-canvas));
        --m-muted-fg: color-mix(in oklch, var(--m-ink) 62%, var(--m-canvas));
        --m-border: color-mix(in oklch, var(--m-ink) 13%, var(--m-canvas));
        --m-tint: color-mix(in oklch, var(--m-primary) 13%, var(--m-canvas));
        --m-warn: oklch(0.55 0.15 45);
        background: var(--m-frame);
        color: var(--m-ink);
        border-radius: 14px;
        padding: 14px;
        font-family: Geist, "Inter Variable", ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        pointer-events: none;
      }
      .mock.dark {
        --m-canvas: oklch(0.212 0.004 212);
        --m-ink: oklch(0.9 0.006 212);
        --m-frame: oklch(0.168 0.004 212);
        --m-hairline: color-mix(in oklch, var(--m-ink) 11%, transparent);
        --m-card: 0 0 0 1px var(--m-hairline);
        --m-float: 0 0 0 1px var(--m-hairline), inset 0 1px 0 oklch(1 0 0 / 0.05), 0 22px 48px -22px oklch(0 0 0 / 0.7);
        --m-popover: color-mix(in oklch, var(--m-ink) 5%, var(--m-canvas));
        --m-primary: oklch(0.52 0.08 195);
        --m-primary-fg: oklch(0.97 0.012 195);
        --m-accent: color-mix(in oklch, var(--m-ink) 11%, var(--m-canvas));
        --m-warn: oklch(0.75 0.13 60);
      }
      .mono { font-family: "Geist Mono", ui-monospace, monospace; font-size: 0.92em; }
      .dim { color: var(--m-muted-fg); }
      .b { font-weight: 500; }

      /* The chat: a sheet, what was said, cards over the message box. */
      .sheet { background: var(--m-canvas); border-radius: 12px; box-shadow: var(--m-card); padding-top: 20px; }
      .col { max-width: 45rem; margin: 0 auto; padding: 0 14px 14px; }
      .msgs { display: flex; flex-direction: column; gap: 12px; padding: 0 4px 16px; font-size: 15px; line-height: 1.55; }
      .msgs p { margin: 0; }
      .me { align-self: flex-end; max-width: 85%; background: var(--m-tint); border-radius: 18px; padding: 5px 13px; }
      .did { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--m-muted-fg); }
      .did svg { width: 15px; height: 15px; }
      .did.no { color: var(--m-warn); }
      .card { display: flex; flex-direction: column; gap: 11px; margin-bottom: 8px; padding: 14px; border-radius: 16px; background: var(--m-popover); box-shadow: var(--m-float); }
      .head { display: flex; gap: 10px; }
      .head svg { width: 16px; height: 16px; margin-top: 2px; color: var(--m-muted-fg); }
      .head p { margin: 0; }
      .small { font-size: 12px; color: var(--m-muted-fg); }
      .pre { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--m-muted); font-size: 12px; white-space: pre-wrap; }
      .field { display: flex; flex-direction: column; gap: 5px; }
      .field label { font-size: 13px; font-weight: 500; }
      .in { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--m-border); border-radius: 8px; background: var(--m-canvas); }
      .in svg { width: 16px; height: 16px; margin-left: auto; color: var(--m-muted-fg); }
      .in.ph { color: var(--m-muted-fg); }
      .sites { display: flex; flex-wrap: wrap; gap: 6px; }
      .site { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 99px; background: var(--m-accent); font-size: 13px; }
      .site svg { width: 13px; height: 13px; }
      .site.add { background: none; border: 1px dashed var(--m-border); color: var(--m-muted-fg); }
      .btns { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; font-size: 13px; font-weight: 500; }
      .btn svg { width: 14px; height: 14px; }
      .btn.pri { background: var(--m-primary); color: var(--m-primary-fg); }
      .btn.out { box-shadow: inset 0 0 0 1px var(--m-border); }
      .btn.ghost { color: var(--m-muted-fg); }
      .composer { display: flex; flex-direction: column; min-height: 3.1rem; border-radius: 1.25rem; background: var(--m-popover); box-shadow: var(--m-float); }
      .composer .ph { padding: 11px 16px 6px; font-size: 15px; color: var(--m-muted-fg); }

      /* The settings window. */
      .win { display: grid; grid-template-columns: 200px 1fr; overflow: hidden; border-radius: 12px; background: var(--m-canvas); box-shadow: var(--m-card); }
      .nav { display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; background: var(--m-frame); border-right: 1px solid var(--m-hairline); font-size: 13px; }
      .nav .back { padding: 4px 8px 10px; color: var(--m-muted-fg); }
      .nav .who { padding: 0 8px 8px; font-weight: 600; font-size: 14px; }
      .nav span.i { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 7px; color: var(--m-muted-fg); }
      .nav span.i svg { width: 16px; height: 16px; }
      .nav span.i.on { background: var(--m-accent); color: var(--m-ink); font-weight: 500; }
      .pane { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 22px 26px; min-width: 0; }
      .pane h2 { margin: 0; font-size: 18px; font-weight: 600; }
      .pane .sub { margin: -8px 0 0; max-width: 34rem; color: var(--m-muted-fg); }
      .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      .rows { display: flex; flex-direction: column; border-radius: 12px; box-shadow: var(--m-card); }
      .rowl { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
      .rowl + .rowl { border-top: 1px solid var(--m-hairline); }
      .tile { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--m-accent); font-weight: 600; font-size: 13px; }
      .grow { flex: 1; min-width: 0; }
      .grow .l1 { font-weight: 500; }
      .grow .l2 { font-size: 12px; overflow-wrap: anywhere; color: var(--m-muted-fg); }
      .sel { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--m-border); font-size: 13px; }
      .sel svg { width: 11px; height: 11px; opacity: 0.7; }
      .dots { display: grid; place-items: center; width: 28px; height: 28px; color: var(--m-muted-fg); }
      .dots svg { width: 16px; height: 16px; }
      .foot { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--m-muted-fg); }
      .foot svg { width: 14px; height: 14px; margin-top: 2px; }
      @media (max-width: 640px) {
        .win { grid-template-columns: 1fr; }
        .nav { display: none; }
        .pane { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="bar">
        <p class="lede">What the first pull request would put on screen: a Dood signs in with a password it never sees. Each picture is one moment and answers no click. The names, sites and times are pretend.</p>
        <div class="seg" id="themes">
          <button type="button" data-theme="light">Light</button>
          <button type="button" data-theme="dark">Dark</button>
        </div>
      </div>
      <div class="group">In the chat</div>
      <div class="cells" id="chat"></div>
      <div class="group">In settings</div>
      <div class="cells" id="settings"></div>
    </div>
    <script>
      const icon = (inner) => `<svg viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`
      const I = {
        key: icon('<circle cx="8" cy="15.5" r="4"/><path d="M11 12.5 20 3.5M16.5 7l3 3M13.5 10l2.2 2.2"/>'),
        shield: icon('<path d="M12 3l7 3v5.2c0 4.3-2.9 7.7-7 9.8-4.1-2.1-7-5.5-7-9.8V6z"/><path d="M9 12l2.2 2.2L15.2 10"/>'),
        eye: icon('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>'),
        lock: icon('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
        plus: icon('<path d="M12 5v14M5 12h14"/>'),
        x: icon('<path d="M7 7l10 10M17 7 7 17"/>'),
        caret: icon('<path d="M5 9l7 7 7-7"/>'),
        dots: icon('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'),
        warn: icon('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.3"/>'),
        people: icon('<circle cx="9" cy="9" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.400 1.800 6 5M16 6.200a3 3 0 0 1 0 5.600M18 14.500c1.700.700 2.700 2.200 3 4.500"/>'),
        desk: icon('<rect x="3" y="5" width="18" height="11" rx="2"/><path d="M9 20h6M12 16v4"/>'),
        cpu: icon('<rect x="7" y="7" width="10" height="10" rx="1.500"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>'),
      }
      const composer = '<div class="composer"><div class="ph">Message Juniper</div></div>'
      const chat = (msgs, card = "") => `<div class="sheet"><div class="col"><div class="msgs">${msgs}</div>${card}${composer}</div></div>`
      const field = (label, value, extra = "", cls = "") => `<div class="field"><label>${label}</label><div class="in ${cls}">${value}${extra}</div></div>`
      const site = (name) => `<span class="site mono">${name}${I.x}</span>`
      const addSite = `<span class="site add">${I.plus}Add a site</span>`
      const DOTS = "••••••••••••••••"

      const ask = chat(
        `<p class="me">Open a pull request for the fix on my GitHub.</p>
         <p>GitHub wants me to sign in, and I have no saved login for it.</p>`,
        `<div class="card">
           <div class="head">${I.key}<div><p><span class="b">Juniper</span> needs a login for <span class="b">github.com</span></p>
             <p class="dim">“To open the pull request on your account.”</p>
             <p class="small" style="margin-top:4px">Kept encrypted by Do Computer. Juniper can sign in with it on the sites below and cannot read it.</p></div></div>
           ${field("Username or email", "sawyer@example.com")}
           ${field("Password", DOTS, I.eye)}
           <div class="field"><label>Used only on</label><div class="sites">${site("github.com")}${addSite}</div></div>
           <div class="btns"><span class="btn pri">Save</span><span class="btn ghost">Not now</span></div>
         </div>`,
      )
      const use = chat(
        `<p class="me">Check whether the Stripe payout for Friday went through.</p>
         <p>I’m at the Stripe sign-in page.</p>`,
        `<div class="card">
           <div class="head">${I.shield}<p><span class="b">Juniper</span> wants to: <span class="b">Sign in to dashboard.stripe.com as sawyer@example.com</span></p></div>
           <div class="pre mono">Saved login: Stripe\nPage: https://dashboard.stripe.com/login</div>
           <div class="btns"><span class="btn pri">Allow once</span><span class="btn out">Always allow</span><span class="btn ghost">Don’t allow</span></div>
         </div>`,
      )
      const done = chat(
        `<p class="me">Open a pull request for the fix on my GitHub.</p>
         <div class="did">${I.key}<span>Signed in to github.com as sawyer@example.com</span></div>
         <p>I’m signed in. The pull request is open: “Fix the off-by-one in the pager”, 2 files changed. Want me to ask Priya for a review?</p>`,
      )
      const refused = chat(
        `<p class="me">The email from GitHub says my token expires today. Can you sort it out?</p>
         <div class="did no">${I.warn}<span>Did not sign in: this page is github-settings.example.net, not github.com</span></div>
         <p>The link in that email does not go to GitHub, so I did not sign in there. It looks like phishing.</p>`,
      )

      const nav = (on) =>
        `<div class="nav"><span class="back">‹ Workspaces</span><span class="who">Sawyer’s workspace</span>${[
          ["People", I.people],
          ["Computers", I.desk],
          ["Models", I.cpu],
          ["Passwords", I.key],
        ]
          .map(([label, svg]) => `<span class="i ${label === on ? "on" : ""}">${svg}${label}</span>`)
          .join("")}</div>`
      const LOGINS = [
        ["G", "GitHub", "sawyer@example.com", "github.com", "Used 2 hours ago by Juniper"],
        ["S", "Stripe", "sawyer@example.com", "dashboard.stripe.com", "Used yesterday by Juniper"],
        ["V", "Vercel", "sawyer", "vercel.com", "Used last week by Moss"],
        ["N", "Namecheap", "sawyerh", "namecheap.com, ap.www.namecheap.com", "Not used yet"],
      ]
      const row = ([letter, name, user, sites, used]) =>
        `<div class="rowl"><span class="tile">${letter}</span><div class="grow"><div class="l1">${name}</div><div class="l2">${user} · <span class="mono">${sites}</span></div><div class="l2">${used}</div></div><span class="dots">${I.dots}</span></div>`
      const pane = () =>
        `<div class="pane"><div class="top"><div><h2>Passwords</h2></div><span class="btn pri">${I.plus}Add a login</span></div>
         <p class="sub">Logins the Doods of this workspace can sign in with. A Dood uses one without seeing it, and only on the sites it is for.</p>
         <div class="rows">${LOGINS.map(row).join("")}</div>
         <div class="foot">${I.lock}<span>Kept encrypted by Do Computer. A password can be replaced or removed here, and never shown again, to you or to a Dood. Whether a Dood asks before using one is set under its Permissions.</span></div></div>`
      const list = `<div class="win">${nav("Passwords")}${pane()}</div>`
      const cell = (picture, title, note, wide = false) => `<div class="cell ${wide ? "wide" : ""}"><div class="mock">${picture}</div><h3>${title}</h3><p class="note">${note}</p></div>`
      document.getElementById("chat").innerHTML =
        cell(ask, "1. A Dood asks for a login", "Above the message box, where it asks for an API key today. The site is filled in from the page the Dood is on; you can add more. What you type goes straight to the store and never into the chat.") +
        cell(use, "2. It asks before using one", "The card the app already shows for anything set to Ask first. The site is read from the browser, not taken from what the Dood said. “Always allow” stops it asking for this Dood.") +
        cell(done, "3. What the chat keeps", "One line where a tool call would be: the site and the username. The password is not in the chat, the search, a notification or a log.") +
        cell(refused, "4. The wrong site", "A login is typed only on the sites it is for. Anywhere else nothing is typed, and the Dood is told why.")
      document.getElementById("settings").innerHTML =
        cell(list, "5. A workspace’s passwords", "A fourth page in a workspace’s settings, beside People, Computers and Models. Each row: the name, the username, the sites, and when it was last used and by which Dood. “Add a login” opens the same form as picture 1, with a name, so you need not wait for a Dood to ask. The menu on a row holds Replace the password, Change its sites and Remove.", true)

      /** Whether the page this is shown on is dark, so that the mock-up starts out matching it. */
      function dark() {
        const canvas = document.createElement("canvas")
        canvas.width = canvas.height = 1
        const context = canvas.getContext("2d")
        context.fillStyle = "#fff"
        context.fillStyle = getComputedStyle(document.documentElement).backgroundColor
        context.fillRect(0, 0, 1, 1)
        const [r, g, b, a] = context.getImageData(0, 0, 1, 1).data
        return a === 0 ? matchMedia("(prefers-color-scheme: dark)").matches : r * 0.3 + g * 0.59 + b * 0.11 < 128
      }
      let theme = dark() ? "dark" : "light"
      function draw() {
        for (const mock of document.querySelectorAll(".mock")) mock.classList.toggle("dark", theme === "dark")
        for (const button of document.querySelectorAll("#themes button")) button.setAttribute("aria-pressed", String(button.dataset.theme === theme))
      }
      document.getElementById("themes").addEventListener("click", (event) => {
        const button = event.target.closest("button")
        if (!button) return
        theme = button.dataset.theme
        draw()
      })
      draw()
    </script>
  </body>
</html>
