<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feeding and dressing up · mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The app's own tokens, copied from apps/web/src/styles.css. */
:root{
  --canvas:oklch(0.985 0.003 212);--ink:oklch(0.27 0.008 212);
  --background:var(--canvas);--foreground:var(--ink);
  --popover:var(--canvas);
  --primary:oklch(0.5 0.08 195);--primary-foreground:oklch(0.985 0.01 195);
  --secondary:color-mix(in oklch,var(--ink) 7%,var(--canvas));
  --muted:color-mix(in oklch,var(--ink) 6%,var(--canvas));
  --muted-foreground:color-mix(in oklch,var(--ink) 62%,var(--canvas));
  --accent:color-mix(in oklch,var(--ink) 8%,var(--canvas));
  --destructive:oklch(0.5 0.19 26);
  --border:color-mix(in oklch,var(--ink) 13%,var(--canvas));
  --input:color-mix(in oklch,var(--ink) 22%,var(--canvas));
  --rail:color-mix(in oklch,var(--ink) 3%,var(--canvas));
  --surface:color-mix(in oklch,var(--ink) 4%,var(--canvas));
  --teal-text:oklch(0.45 0.08 195);
  --here:oklch(0.62 0.15 150);
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
.dark{
  --canvas:oklch(0.19 0.004 212);--ink:oklch(0.9 0.006 212);
  --popover:color-mix(in oklch,var(--ink) 5%,var(--canvas));
  --primary:oklch(0.52 0.08 195);--primary-foreground:oklch(0.97 0.012 195);
  --secondary:color-mix(in oklch,var(--ink) 9%,var(--canvas));
  --muted:color-mix(in oklch,var(--ink) 8%,var(--canvas));
  --accent:color-mix(in oklch,var(--ink) 11%,var(--canvas));
  --destructive:oklch(0.7 0.17 24);
  --input:color-mix(in oklch,var(--ink) 20%,var(--canvas));
  --rail:color-mix(in oklch,black 22%,var(--canvas));
  --surface:color-mix(in oklch,var(--ink) 5%,var(--canvas));
  --teal-text:oklch(0.78 0.09 195);
  --here:oklch(0.74 0.16 150);
  color-scheme:dark;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:color-mix(in oklab,var(--foreground) 18%,transparent) transparent}
html,body{height:100%;margin:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.ic{flex:none;display:block}
.mut{color:var(--muted-foreground)}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app{display:flex;height:calc(100vh - 44px);position:relative}

/* Scene strip: not part of the design. */
#strip{height:44px;border-top:1px solid var(--border);background:var(--rail);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12.5px;overflow-x:auto;white-space:nowrap}
#strip b{font-weight:600;margin-right:6px}
#strip button{height:28px;padding:0 11px;border-radius:99px;color:var(--muted-foreground)}
#strip button:hover{background:var(--accent);color:var(--foreground)}
#strip button.on{background:var(--foreground);color:var(--background)}
#strip .sp{flex:1}

/* People */
.pf{--s:24px;width:var(--s);height:var(--s);border-radius:99px;background:var(--c);color:#fff;font-size:calc(var(--s)*.4);font-weight:600;letter-spacing:.01em;display:inline-grid;place-items:center;flex:none;position:relative;user-select:none}
.pf.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:32%;height:32%;min-width:7px;min-height:7px;border-radius:99px;background:var(--here);box-shadow:0 0 0 2px var(--bg,var(--background))}
.pf.away{opacity:.55}
.stack{display:inline-flex;align-items:center}
.stack .pf{box-shadow:0 0 0 2px var(--bg,var(--background))}
.stack .pf+.pf{margin-left:calc(var(--s)*-.14)}
.stack .pf.on::after{display:none}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0);opacity:0}}
.tile{--s:36px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.3);background:var(--c);color:#fff;font-weight:700;font-size:calc(var(--s)*.44);display:inline-grid;place-items:center;flex:none}

/* Creature */
.orb{position:relative;display:inline-block;flex:none}
.orb canvas{position:absolute;top:-12%;left:-12%;width:124%;height:124%;pointer-events:none}
.orb svg{position:absolute;inset:0;width:100%;height:100%}

/* Rail */
.rail{width:64px;flex:none;background:var(--rail);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;--bg:var(--rail)}
.rail .sp{flex:1}
.rb{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;color:var(--muted-foreground);position:relative}
.rb:hover,.rb.on{background:var(--accent);color:var(--foreground)}
.rb .n{position:absolute;top:2px;right:0;min-width:16px;height:16px;border-radius:99px;background:var(--here);color:#06210f;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--rail)}
.wsb{display:grid;place-items:center;border-radius:12px;padding:2px;position:relative}
.wsb:hover,.wsb.open{box-shadow:0 0 0 2px var(--input)}
.wsb .ch{position:absolute;right:-7px;bottom:-5px;width:16px;height:16px;border-radius:99px;background:var(--rail);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted-foreground)}
.rail hr{width:28px;border:0;border-top:1px solid var(--border);margin:8px 0}

/* Chat list */
.side{width:288px;flex:none;background:color-mix(in oklch,var(--rail) 60%,var(--background));border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;--bg:color-mix(in oklch,var(--rail) 60%,var(--background))}
.side-h{display:flex;align-items:center;padding:16px 12px 8px 16px}
.side-h h2{font-size:14px;font-weight:500;flex:1}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted-foreground)}
.ib:hover{background:var(--accent);color:var(--foreground)}
.search{margin:0 12px 8px;height:32px;border-radius:10px;border:1px solid var(--input);background:transparent;padding:0 10px;outline:none;width:calc(100% - 24px)}
.chats{flex:1;overflow:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
.crow{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-radius:10px;color:var(--muted-foreground);width:100%}
.crow:hover,.crow.sel{background:var(--accent);color:var(--foreground)}
.crow .t{font-size:14px;display:flex;align-items:center;gap:5px}
.crow .s{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:5px;margin-top:2px}
.brow{flex:none;display:flex;align-items:center;gap:11px;padding:7px 6px 7px 4px;border-radius:12px;width:100%}
.brow:hover{background:var(--accent)}
.brow .chev{color:var(--muted-foreground);transition:transform .15s}
.brow.open .chev{transform:rotate(90deg)}
.brow .t{font-size:14px;font-weight:500}
.brow .s{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px;margin-top:1px}
.brow .ib{opacity:0}.brow:hover .ib{opacity:1}
.nest{display:flex;flex-direction:column;gap:1px;margin:1px 0 8px 39px;padding-left:6px;border-left:1px solid var(--border)}
.nest>div{display:flex;flex-direction:column;gap:1px}
.crow.one{padding:0 8px 0 10px;height:30px;font-size:13.500px;gap:6px;border-radius:8px}
.crow .at{font-size:11.500px;color:var(--muted-foreground);flex:none;min-width:26px;display:inline-flex;align-items:center;justify-content:flex-end;gap:3px}
.more{font-size:12px;color:var(--muted-foreground);padding:6px 10px;border-radius:8px}
.more:hover{background:var(--accent);color:var(--foreground)}
.live{width:7px;height:7px;border-radius:99px;background:var(--teal-text);flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.side-f{border-top:1px solid var(--border);padding:12px 12px 14px}
.side-f h3{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);padding:0 4px 6px;display:flex;justify-content:space-between}
.prow{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:8px;width:100%}
.prow:hover{background:var(--accent)}
.prow .w{font-size:12px;color:var(--muted-foreground)}

/* Chat */
.main{flex:1;min-width:0;display:flex;min-height:0}
.chat{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.fade{position:absolute;inset:0 0 auto 0;height:80px;background:linear-gradient(var(--background),color-mix(in oklch,var(--background) 80%,transparent),transparent);pointer-events:none;z-index:2}
.tl,.tr{position:absolute;top:12px;z-index:3;display:flex;align-items:center;gap:6px}
.tl{left:12px}.tr{right:12px}
.pill{height:32px;padding:0 12px;border-radius:99px;background:var(--secondary);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;white-space:nowrap}
.pill:hover{background:var(--accent)}
.pill.ghost{background:color-mix(in oklch,var(--background) 85%,transparent);border:1px solid var(--border);backdrop-filter:blur(8px);font-weight:400;color:var(--muted-foreground)}
.pill.ic-only{width:32px;padding:0;justify-content:center}
.scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.msgs{max-width:768px;width:100%;margin:auto auto 0;padding:96px 16px 20px;display:flex;flex-direction:column;gap:20px}
.m{display:flex;flex-direction:column;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.m.h{align-items:flex-end}
.m .who{font-size:12px;color:var(--muted-foreground);margin:0 38px 4px 0;display:flex;gap:6px}
.m .who b{font-weight:500;color:var(--foreground)}
.m .line{display:flex;align-items:flex-end;gap:8px;max-width:80%}
.bub{border-radius:22px;padding:10px 14px;font-size:15px;line-height:1.55;white-space:pre-wrap;background:var(--secondary)}
.m.me .bub{background:var(--primary);color:var(--primary-foreground)}
.m.me .line{max-width:80%}
.prose{font-size:15px;line-height:1.65;max-width:100%}
.prose>*+*{margin-top:12px}
.prose ul{padding-left:20px;margin:12px 0 0}.prose li+li{margin-top:4px}
.prose code{font-family:var(--mono);font-size:.85em;background:color-mix(in oklch,var(--ink) 8%,transparent);padding:2px 5px;border-radius:5px}
.tool{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted-foreground);margin-bottom:8px}
.shine{background:linear-gradient(90deg,color-mix(in srgb,currentColor 55%,transparent),currentColor 50%,color-mix(in srgb,currentColor 55%,transparent));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2s linear infinite;font-size:14px;color:var(--muted-foreground)}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.q{align-self:flex-end;font-size:12px;color:var(--muted-foreground);margin-top:-12px;margin-right:38px}
.foot{max-width:768px;width:100%;margin:0 auto;padding:0 16px 16px}
.typing{height:24px;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted-foreground);padding-left:6px;--s:18px}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:9px;background:currentColor;animation:pulse 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.comp{border:1px solid var(--input);border-radius:24px;background:var(--background);padding:10px 10px 8px 16px;display:flex;flex-direction:column;gap:6px}
.comp:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 25%,transparent)}
.comp textarea{border:0;outline:0;background:transparent;resize:none;height:26px;font-size:15px;padding:2px 0}
.comp .r{display:flex;align-items:center;gap:6px}
.vis{height:26px;padding:0 9px;border-radius:99px;font-size:12px;color:var(--muted-foreground);display:inline-flex;align-items:center;gap:5px}
.vis:hover{background:var(--accent);color:var(--foreground)}
.send{width:32px;height:32px;border-radius:99px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center}

/* Sub-agents */
.amber{width:7px;height:7px;border-radius:9px;background:oklch(0.75 0.15 75);flex:none;margin:0 3px}
.chipr{display:flex;flex-wrap:wrap;gap:8px}
.schip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 9px 0 8px;border:1px solid var(--border);border-radius:10px;font-size:13.500px;font-weight:500}
.schip:hover{background:var(--surface)}
.schip .st{font-weight:400;color:var(--muted-foreground);font-size:12.500px}
.rep{border-left:2px solid var(--border);padding-left:12px;font-size:13.500px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px}
.rep b{color:var(--foreground);font-weight:500}
.rep a{color:var(--teal-text);font-weight:500}
.ask{border:1px solid var(--border);border-radius:16px;padding:14px;max-width:560px;display:flex;flex-direction:column;gap:9px;font-size:14px}
.ask .hd{display:flex;align-items:center;gap:8px;font-weight:500}
.ask pre{margin:0;font-family:var(--mono);font-size:12.500px;background:var(--surface);border-radius:8px;padding:8px 10px}
.ask .acts{display:flex;align-items:center;gap:8px}
.subs3{display:flex;gap:14px;margin-top:8px}
.hererow{display:flex;align-items:center;gap:6px;padding:0 8px 2px}
.hererow .w{font-size:12.500px;color:var(--muted-foreground);margin-left:4px}

/* Agent panel */
.panel{width:320px;flex:none;border-left:1px solid var(--border);background:color-mix(in oklch,var(--rail) 40%,var(--background));display:flex;flex-direction:column;min-height:0;position:relative;--bg:color-mix(in oklch,var(--rail) 40%,var(--background))}
.panel .x{position:absolute;top:10px;right:10px}
.panel .top{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px 18px;gap:3px}
.panel .top h2{font-size:18px;font-weight:500;margin-top:12px}
.panel .top p{font-size:14px;color:var(--muted-foreground)}
.panel .top .tag{font-size:12px;margin-top:3px}
.sec{border-top:1px solid var(--border);padding:14px 12px 12px}
.sec h3{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);padding:0 8px 8px;display:flex;justify-content:space-between;align-items:center}
.sec h3 button{text-transform:none;letter-spacing:0;font-size:12px;color:var(--teal-text)}
.run{display:flex;gap:10px;padding:8px 10px;border-radius:12px;align-items:flex-start}
.run:hover{background:var(--surface)}
.run .t{font-size:14px}
.run .s{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:5px;margin-top:3px;--s:15px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pages */
.page{flex:1;min-width:0;overflow:auto}
.col{max-width:720px;margin:0 auto;padding:56px 28px 80px}
.col.wide{max-width:1040px}
.ph{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.ph h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.ph p{color:var(--muted-foreground);margin-top:2px}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap;justify-content:center}
.btn:hover{background:var(--accent)}
.btn.pri{background:var(--primary);color:var(--primary-foreground);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.quiet{border-color:transparent;color:var(--muted-foreground)}
.btn.bad{color:var(--destructive)}
.h2{font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);margin:32px 0 10px;display:flex;align-items:center;gap:8px}
.h2 .sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{border:1px solid var(--border);border-radius:18px;padding:22px 18px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--background);--bg:var(--background)}
.card:hover{border-color:var(--input);background:var(--surface)}
.card h3{font-size:16px;font-weight:500;margin-top:10px}
.card .tag{font-size:13px;color:var(--muted-foreground);min-height:38px;margin-top:2px}
.card .now{border-top:1px solid var(--border);align-self:stretch;margin-top:12px;padding-top:12px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-foreground);text-align:left;min-height:38px;--s:22px}
.card.add{border-style:dashed;justify-content:center;color:var(--muted-foreground);gap:8px}
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:28px}
.box{border:1px solid var(--border);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;--s:32px}
.li+.li{border-top:1px solid var(--border)}
.li .n{font-weight:500}
.li .d{font-size:12.5px;color:var(--muted-foreground)}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--muted-foreground);font-weight:500}
.pick{height:30px;border-radius:8px;border:1px solid var(--border);padding:0 26px 0 10px;font-size:13px;background:transparent;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(-45deg,transparent 50%,currentColor 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.field{height:38px;border-radius:10px;border:1px solid var(--input);background:transparent;padding:0 12px;outline:none;width:100%}
.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 25%,transparent)}
.gh{font-family:var(--mono);font-size:12px}

/* Popovers and dialogs */
.veil{position:absolute;inset:0;z-index:20}
.veil.dim{background:rgb(0 0 0/.45);display:grid;place-items:center;backdrop-filter:blur(1px)}
.menu{position:absolute;z-index:21;background:var(--popover);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgb(0 0 0/.28);padding:6px;width:312px;--bg:var(--popover);animation:rise .15s ease-out}
.menu .lb{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);padding:8px 10px 4px}
.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;width:100%}
.mi:hover,.mi.cur{background:var(--accent)}
.mi .d{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px;--s:16px}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.dlg{width:500px;max-width:calc(100% - 32px);background:var(--popover);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 70px rgb(0 0 0/.4);padding:24px;--bg:var(--popover);animation:rise .18s ease-out}
.dlg h2{font-size:18px;font-weight:600}
.dlg .sub{color:var(--muted-foreground);margin:4px 0 18px}
.dlg label{display:block;font-size:13px;font-weight:500;margin:16px 0 6px}
.dlg .acts{display:flex;align-items:center;gap:8px;margin-top:22px}
.tok{border:1px solid var(--input);border-radius:12px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px}
.tok:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 25%,transparent)}
.tok input{border:0;outline:0;background:transparent;flex:1;min-width:140px;height:26px;padding:0 4px}
.chip{height:28px;border-radius:99px;background:var(--accent);padding:0 6px 0 4px;display:inline-flex;align-items:center;gap:6px;font-size:13px;--s:20px}
.chip button{color:var(--muted-foreground);display:grid;place-items:center}
.hint{font-size:12.5px;color:var(--muted-foreground);margin-top:8px}
.sw{display:flex;gap:8px}
.sw button{width:26px;height:26px;border-radius:8px;background:var(--c)}
.sw button.on{box-shadow:0 0 0 2px var(--popover),0 0 0 4px var(--foreground)}
.dlg label.ck,.ck{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:12px}
.ck input{accent-color:var(--primary);width:16px;height:16px}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;background:var(--foreground);color:var(--background);border-radius:99px;padding:8px 16px;font-size:13px;animation:rise .2s ease-out}

/* Welcome (the personal workspace) and joining */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:24px}
.join{width:460px;max-width:100%;border:1px solid var(--border);border-radius:24px;padding:36px 32px 28px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--background);--bg:var(--background)}
.join h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:14px}
.trio{display:flex;gap:22px;margin:26px 0 8px}
.trio div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- agent pages mock-up: added to the teams mock-up's styles ---------- */
.acol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.acol .msgs{padding-top:28px}
.ahead{height:52px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;--s:26px}
.ahead .who{display:flex;align-items:center;gap:8px;font-size:15px;margin-right:8px}
.ahead .who b{font-weight:600}
.tabs{display:flex;align-items:stretch;gap:2px;align-self:stretch}
.tab{padding:0 11px;display:inline-flex;align-items:center;gap:6px;color:var(--muted-foreground);font-weight:500;font-size:13.5px;position:relative}
.tab:hover,.tab.on{color:var(--foreground)}
.tab.on::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:2px;border-radius:2px;background:var(--primary)}
.tabs i{width:1px;height:18px;background:var(--border);margin:0 6px;align-self:center}
.brow{cursor:pointer}
.brow.hot{background:var(--accent)}.brow.hot .ib{opacity:1}
.pname{font-size:18px;font-weight:500;margin-top:10px;border-radius:9px;padding:2px 10px;display:inline-flex;align-items:center;gap:7px}
.pname:hover{background:var(--accent)}
.dlg.setm{width:920px;height:640px;max-height:calc(100% - 48px);padding:0;display:flex;overflow:hidden;position:relative}
.setm .x{position:absolute;top:12px;right:12px}
.snav{width:224px;flex:none;padding:16px 10px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--border);background:color-mix(in oklch,var(--rail) 50%,var(--popover));--bg:color-mix(in oklch,var(--rail) 50%,var(--popover))}
.sm-h{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.sm-h>span:last-child{display:flex;flex-direction:column;line-height:1.25;font-size:12.5px}
.sm-h b{font-size:14px;font-weight:600}
.sn{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:9px;color:var(--muted-foreground);font-size:13.5px}
.sn:hover,.sn.on{background:var(--accent);color:var(--foreground)}
.sn.bad{color:var(--destructive);margin-top:12px}
.setm .col{flex:1;min-width:0;margin:0;max-width:none;overflow:auto;padding:28px 36px 40px}
.dlg.setm .lab{margin:18px 0 6px;display:flex}
.sh{margin-bottom:22px}
.sh h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sh p{color:var(--muted-foreground);margin-top:3px}
.lab{font-size:13px;font-weight:500;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.area{border:1px solid var(--input);border-radius:10px;background:transparent;padding:10px 12px;width:100%;min-height:84px;resize:vertical;outline:none;line-height:1.5;display:block}
.tg{width:34px;height:20px;border-radius:99px;background:var(--input);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:#fff;transition:left .15s}
.tg.on{background:var(--primary)}
.tg.on::after{left:16px}
.mono{font-family:var(--mono);font-size:13px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:12px;flex:1}
.opt.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.mine{display:flex;flex-direction:column;gap:4px;border:1.5px dashed oklch(0.75 0.15 75);border-radius:26px;padding:3px;margin:-3px 0}
.banner{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:5;background:color-mix(in oklch,oklch(0.75 0.15 75) 16%,var(--background));border:1px solid oklch(0.75 0.15 75);border-radius:12px;padding:8px 14px;font-size:13px;max-width:440px;text-align:center}
.brow .ib{display:none}
.brow:hover .ib,.brow.hot .ib{display:grid}
.brow .s{white-space:nowrap;overflow:hidden}

/* On a phone */
.phones{flex:1;display:flex;gap:28px;justify-content:safe center;align-items:center;overflow:auto;padding:20px 28px;background:var(--rail)}
.phone-w{margin:0;width:300px;flex:none}
.phone-w figcaption{font-size:12.5px;color:var(--muted-foreground);margin-top:12px;height:74px;line-height:1.45}
.phone-w figcaption b{display:block;color:var(--foreground);font-weight:600;font-size:13.5px;margin-bottom:2px}
.phone{height:600px;border:1px solid var(--input);border-radius:34px;background:var(--background);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 50px rgb(0 0 0/.3)}
.m-top{height:50px;flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px 0 12px}
.m-top .who{display:flex;align-items:center;gap:7px;font-size:15px}
.m-top .who b,.m-top>b{font-weight:600}
.m-tabs{height:38px;flex:none;align-self:auto;border-bottom:1px solid var(--border);padding:0 6px}
.phone .msgs{padding:16px 12px 12px;gap:14px}
.phone .bub,.phone .prose{font-size:13.5px;line-height:1.5}
.phone .m .line{max-width:92%}
.phone .foot{padding:0 10px 12px}
.phone .comp textarea{font-size:14px}
.m-dim{position:absolute;inset:0;background:rgb(0 0 0/.5)}
.m-drawer{position:absolute;inset:0 44px 0 0;background:color-mix(in oklch,var(--rail) 60%,var(--background));--bg:color-mix(in oklch,var(--rail) 60%,var(--background));border-right:1px solid var(--border);display:flex;flex-direction:column}
.m-drawer .search{margin-top:6px}
.m-drawer .brow{cursor:default}
.m-wsrow{display:flex;border-top:1px solid var(--border);padding:8px 6px 14px}
.m-ws{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted-foreground);position:relative}
.m-ws i{position:absolute;top:-4px;left:calc(50% + 4px);min-width:15px;height:15px;border-radius:99px;background:var(--here);color:#06210f;font-size:9.5px;font-weight:700;font-style:normal;display:grid;place-items:center}
.m-pad{padding:6px 14px 10px}
.m-sec{overflow:auto;flex:1}
.m-sec .sh h1{font-size:18px}
.m-sec .li{padding:9px 12px}

/* The library keeps its own list where the agents column would be. */
.lib{flex:1;min-height:0;display:flex}
.ltree{width:264px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:color-mix(in oklch,var(--rail) 30%,var(--background))}
.ltree .sn{flex:none}
.side-h .ib+.ib{margin-left:2px}

/* One sidebar: the workspace at its top, where the rail used to be. */
.ws-h{display:flex;align-items:center;gap:4px;padding:10px 10px 6px}
.wsw{display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:5px 8px 5px 6px;border-radius:10px;font-size:14.5px}
.wsw:hover{background:var(--accent)}
.wsw b{font-weight:600}
.wnav{display:flex;flex-direction:column;gap:1px;padding:2px 8px 10px;border-bottom:1px solid var(--border)}
.wn{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:9px;color:var(--muted-foreground);font-size:13.5px;--s:16px}
.wn:hover,.wn.on{background:var(--accent);color:var(--foreground)}
.wn .at{font-size:11.5px;margin-left:6px}
.side-h h2.lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}
.side-f.me{display:flex;align-items:center;gap:6px;padding:8px 10px}
.ahead button.who{padding:4px 8px 4px 6px;border-radius:10px;margin:0 0 0 -6px}
.ahead button.who:hover,.ahead button.who.open{background:var(--accent)}
.crumb{max-width:240px;font-size:14px;margin-right:6px}
.ws-h .ib.faces{width:auto;padding:0 6px}
.ws-h{padding-bottom:2px}
.side-f.me .prow{padding:6px 8px;gap:10px}
.side-f.me .prow.open{background:var(--accent)}
.panel.files .side-h{padding:16px 48px 10px 16px}
.panel.files .sn{flex:none}
.side-h.lib-h{padding:8px 12px 8px 8px;gap:8px}
.side .sn{flex:none}
.ahead .acts{display:flex;align-items:center;gap:2px;margin-left:4px}
.ahead .ib.on{color:var(--foreground)}
/* ---------- main and side chats mock-up: added to the agent pages mock-up's styles ---------- */
#app{height:calc(100vh - 78px)}
#strip{height:78px;flex-wrap:wrap;align-content:center;row-gap:2px;overflow:hidden}
#strip .note{flex-basis:100%;font-size:12.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
#strip .note b{color:var(--foreground);font-weight:600;margin-right:4px}
#strip i{width:1px;height:16px;background:var(--border);margin:0 4px}
#strip .rec{font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--teal-text);margin-left:5px}
#strip button.on .rec{color:inherit;opacity:.7}

/* An agent in the sidebar, when a row is the agent and nothing folds: pick it and you are in its
   main chat. */
.arow{flex:none;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 11px;border-radius:14px;width:100%;cursor:pointer}
.arow:hover{background:var(--accent)}
.arow.sel{background:var(--accent)}
.arow.cur .t{color:var(--foreground)}
.arow .t{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.arow .s{font-size:12.5px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px;margin-top:1px;white-space:nowrap;overflow:hidden}
.arow .end{font-size:11.5px;font-weight:400;color:var(--muted-foreground);flex:none;display:inline-flex;align-items:center;gap:5px}
.arow .new{width:8px;height:8px;border-radius:99px;background:var(--primary);flex:none}
.chats.flat{gap:3px}

/* Under the open agent only (direction B): its side chats, with no arrow to fold them. */
.under{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 30px;padding-left:10px;border-left:1px solid var(--border)}
.under .lb,.sec .lb{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);padding:6px 10px 3px}
.addrow{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--muted-foreground);width:100%}
.addrow:hover{background:var(--accent);color:var(--foreground)}

/* The way to side chats from the agent's strip (direction A). */
.scb{height:30px;padding:0 10px 0 9px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--muted-foreground);white-space:nowrap;margin-left:8px}
.scb:hover,.scb.on{background:var(--accent);color:var(--foreground)}
.scb .n{font-size:11.5px;font-weight:600;min-width:18px;height:18px;border-radius:99px;background:var(--secondary);display:inline-grid;place-items:center;padding:0 5px}
.scb.on .n{background:color-mix(in oklch,var(--ink) 18%,var(--canvas))}
.menu .mi .end{font-size:11.5px;color:var(--muted-foreground);flex:none;display:inline-flex;align-items:center;gap:5px}
.menu .mi.new{color:var(--teal-text);font-weight:500}

/* A side chat, beside the main chat: in the place the agent's panel has, and as wide as it is
   dragged. */
.sidechat{width:440px;flex:none;border-left:1px solid var(--border);background:color-mix(in oklch,var(--rail) 40%,var(--background));--bg:color-mix(in oklch,var(--rail) 40%,var(--background));display:flex;flex-direction:column;min-height:0;position:relative}
.sidechat::before{content:"";position:absolute;left:-3px;top:calc(50% - 18px);width:5px;height:36px;border-radius:9px;background:var(--input);cursor:col-resize}
.sc-h{height:52px;flex:none;display:flex;align-items:center;gap:9px;padding:0 8px 0 14px;border-bottom:1px solid var(--border)}
.sc-h .k{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);line-height:1.2}
.sc-h .n{font-size:14px;font-weight:500;line-height:1.25}
.sidechat .msgs{padding:18px 14px 14px;gap:14px}
.sidechat .bub,.sidechat .prose{font-size:14px;line-height:1.55}
.sidechat .m .line{max-width:90%}
.sidechat .foot{padding:0 12px 14px}
.sidechat .comp{background:var(--background)}

/* A side chat in the middle: a line under the agent's strip says so, and leads back. */
.subbar{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--rail) 30%,var(--background));font-size:13.5px}
.back{white-space:nowrap;flex:none;height:28px;padding:0 10px 0 6px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;color:var(--muted-foreground);font-weight:500;font-size:13px}
.back:hover{background:var(--accent);color:var(--foreground)}
.subbar .k{color:var(--muted-foreground);white-space:nowrap}
.subbar b{font-weight:500}

/* The main chat is one long conversation: days, not titles, divide it. */
.dayd{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted-foreground);margin:2px 0}
.dayd::before,.dayd::after{content:"";flex:1;border-top:1px solid var(--border)}
.aside-ref{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;padding:7px 12px 7px 10px;font-size:13.5px;color:var(--muted-foreground)}
.aside-ref:hover{background:var(--surface)}
.aside-ref b{color:var(--foreground);font-weight:500}

/* Side chats in the agent's panel (direction C). */
.panel .crow.one{height:32px}
.sec h3 .ib{width:22px;height:22px;margin:-4px 0}

.note-card{position:absolute;z-index:6;left:50%;top:64px;transform:translateX(-50%);background:color-mix(in oklch,oklch(0.75 0.15 75) 16%,var(--background));border:1px solid oklch(0.75 0.15 75);border-radius:12px;padding:8px 14px;font-size:13px;max-width:470px;text-align:center}
.m-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--popover);--bg:var(--popover);border-top:1px solid var(--border);border-radius:22px 22px 0 0;padding:8px 8px 14px;display:flex;flex-direction:column;gap:1px}
.m-sheet::before{content:"";width:36px;height:4px;border-radius:9px;background:var(--input);align-self:center;margin:2px 0 8px}
.m-sheet .mi{font-size:13.5px}
.m-sheet .lb{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);padding:4px 10px}
.phone .arow{cursor:default;padding:7px 8px}
.phone .subbar{height:36px;font-size:13px}
/* ---------- Gamification mock-up: added to the two mock-ups' styles above ---------- */

/* Pixel pictures: treats, the box, hearts, sparkles. */
.px{image-rendering:pixelated;display:block;flex:none;user-select:none;-webkit-user-drag:none}
[hidden]{display:none!important}

/* Beside the creature: its treats at one bottom corner, its next box at the other. */
.pet{position:relative;display:inline-block}
.pile,.gift{position:absolute;bottom:-8px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.pile{left:-42px;cursor:grab;touch-action:none}
.gift{right:-42px}
.pile:hover,.gift:hover{background:var(--accent)}
.pile.none{cursor:default}
.pile.none .px{opacity:.22;filter:grayscale(1)}
.pile .n{position:absolute;right:0;top:0;min-width:17px;height:17px;border-radius:99px;background:var(--foreground);color:var(--background);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pile.bump{animation:bump .35s steps(4)}
@keyframes bump{40%{transform:scale(1.25)}}
.gbox{position:relative;display:block}
.gift .dim{opacity:.3;filter:grayscale(1)}
.gift .fill{position:absolute;left:0;right:0;bottom:0;overflow:hidden;transition:height .4s steps(5)}
.gift .fill .px{position:absolute;left:0;bottom:0}
.gift.ready{animation:hop .9s steps(4) infinite}
.gift .tw{position:absolute;right:0;top:0;animation:tw 1.1s steps(3) infinite}
@keyframes hop{50%{transform:translateY(-5px)}}
.pnrow{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:14px}
.pnrow .pname{margin-top:0}
.heart{position:absolute;left:calc(50% + var(--x) - 10px);top:8%;width:21px;pointer-events:none;animation:heart 1.1s steps(9) forwards}
@keyframes heart{from{transform:translateY(12px);opacity:0}20%{opacity:1}70%{opacity:1}to{transform:translateY(-44px);opacity:0}}
.held{position:fixed;z-index:60;width:42px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 3px 0 rgb(0 0 0/.25))}
.held.fly{width:28px;transition:left .7s cubic-bezier(.5,-.4,.3,1),top .7s cubic-bezier(.3,0,.3,1)}
.bit{position:fixed;z-index:61;width:4px;height:4px;pointer-events:none;animation:bit .55s ease-out forwards}
@keyframes bit{to{transform:translate(var(--dx),var(--dy));opacity:0}}

/* Rarity: one color each, carried in --rc. */
.rdot{width:8px;height:8px;background:var(--rc);display:inline-block;flex:none}
.rbar{position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--rc)}

/* A box, shut and then opened. */
.dlg.unl,.unl{text-align:center}
.dlg.unl{width:440px;position:relative;overflow:hidden;padding:26px 24px 20px}
.boxin{position:relative;display:flex;flex-direction:column;align-items:center}
.unl h2{font-size:18px;font-weight:600;margin-top:16px;position:relative}
.unl .sub{color:var(--muted-foreground);margin:3px 0 16px}
.unl .acts{display:flex;justify-content:center;gap:8px;margin-top:0}
.lootbox{display:flex;flex-direction:column;align-items:center;margin:26px 0 12px;animation:rock 1.6s steps(6) infinite}
.lootbox:hover{filter:brightness(1.12)}
.lootbox .lid{transform-origin:20% 100%}
.lootbox.shake{animation:shake .12s steps(2) infinite}
.lootbox.burst{animation:none;filter:drop-shadow(0 0 22px var(--rc))}
.lootbox.burst .lid{transition:transform .4s cubic-bezier(.2,.8,.3,1),opacity .4s;transform:translate(-30px,-70px) rotate(-28deg);opacity:0}
@keyframes rock{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}90%{transform:rotate(-3deg)}}
@keyframes shake{0%{transform:translate(-3px,1px) rotate(-3deg)}100%{transform:translate(3px,-1px) rotate(3deg)}}
.rays{position:absolute;left:50%;top:118px;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--rc) 30%,transparent) 0 12deg,transparent 12deg 30deg);-webkit-mask-image:radial-gradient(closest-side,#000 20%,transparent 78%);mask-image:radial-gradient(closest-side,#000 20%,transparent 78%);animation:turn 9s steps(60) infinite;pointer-events:none}
@keyframes turn{to{transform:rotate(360deg)}}
.rar{position:relative;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rc);border:1px solid var(--rc);padding:2px 9px;margin-bottom:14px;background:var(--popover)}
.unl .orb{position:relative}
.spark{position:absolute;width:15px;animation:tw 1.15s steps(3) infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.again{margin-top:14px;font-size:12.5px;color:var(--muted-foreground);text-decoration:underline;text-underline-offset:3px}
.again:hover{color:var(--foreground)}

/* The wardrobe: the creature on the left, what there is on the right. */
.dlg.ward{width:1040px;height:680px}
.ward .wstage{width:310px;flex:none;display:flex;flex-direction:column;align-items:center;padding:28px 20px 20px;border-right:1px solid var(--border);background:color-mix(in oklch,var(--rail) 50%,var(--popover));text-align:center}
.floor{position:relative;display:grid;place-items:center;padding:16px 24px 8px}
.floor::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--input) 1px,transparent 1px),linear-gradient(90deg,var(--input) 1px,transparent 1px);background-size:18px 18px;-webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent);mask-image:radial-gradient(closest-side,#000 25%,transparent);opacity:.7}
.ward .wstage h2{margin-top:14px}
.ward .wline{font-size:12.5px;display:inline-flex;align-items:center;gap:5px;min-height:20px}
.worn{display:flex;flex-direction:column;gap:6px;width:100%;margin:14px 0}
.wchip{display:flex;align-items:center;gap:8px;font-size:13px;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:10px;text-align:left}
.wchip .k{color:var(--muted-foreground);width:54px;flex:none;font-size:12px}
.wchip .ib{width:22px;height:22px;margin-right:-4px}
.ward .r,.lineup .r{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ward .col{display:flex;flex-direction:column;padding:26px 26px 14px;overflow:hidden}
.ward .sh{margin-bottom:12px}
.wbar{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--border);margin-bottom:14px;flex:none}
.wt{height:38px;flex:1;align-self:auto}
.wt .tab{padding:0 12px}
.wt .tab small{font-size:11px;font-weight:400;color:var(--muted-foreground);margin-left:1px}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted-foreground);height:38px;white-space:nowrap;cursor:pointer}
.sw input{accent-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;overflow:auto;padding:3px 3px 8px;align-content:start;flex:1;min-height:0}
.grid.three{grid-template-columns:repeat(3,1fr);overflow:visible;flex:none}
.wtile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 10px;border:1px solid var(--border);border-radius:12px;font-size:12px;line-height:1.25;background:var(--surface);overflow:hidden;text-align:center;min-height:112px}
.wtile>span:not(.orb){min-height:30px;display:grid;place-items:center}
button.wtile:hover{border-color:var(--input)}
.wtile.on{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in oklch,var(--primary) 35%,transparent)}
.wtile.try{border-style:dashed;border-color:var(--primary)}
.wtile.locked>span:not(.orb){color:var(--muted-foreground)}
.wtile em{position:absolute;top:6px;right:7px;color:var(--muted-foreground);font-style:normal}
.wtile.unk{justify-content:center;color:var(--muted-foreground);border-style:dashed}
.wtile.unk b{font-size:26px;font-weight:600;color:var(--rc);opacity:.8;height:64px;display:grid;place-items:center}
.legend{display:flex;gap:16px;justify-content:center;font-size:11.5px;color:var(--muted-foreground);padding-top:10px;flex:none}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* On a phone. */
.dotted{position:relative;display:inline-flex}
.dotted i{position:absolute;right:-3px;top:-2px;width:9px;height:9px;border-radius:9px;background:oklch(0.78 0.15 75);box-shadow:0 0 0 2px var(--background)}
.phone-w figcaption{height:92px}
.m-care{display:flex;flex-direction:column;align-items:center;padding:6px 44px 12px;text-align:center;gap:8px;flex:none}
.m-care p{font-size:12.5px}
.m-ward{border-top:1px solid var(--border);padding:12px 12px 0;flex:1;min-height:0;overflow:hidden}
.m-wt{height:32px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex}
.m-wt .tab{padding:0 9px;font-size:12.5px}
.m-ward .wtile{min-height:0;padding:8px 2px 9px;font-size:11px}
.m-ward .wtile>span:not(.orb){min-height:0}
.m-unl{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 18px 40px;position:relative;overflow:hidden}
.m-unl .rays{top:100px}

/* The same things on bodies grown from random seeds. */
.lineup{flex:1;overflow:auto;padding:32px 40px;display:flex;flex-direction:column;align-items:center}
.lineup .sh{text-align:center;max-width:620px;margin-bottom:16px}
.lus{display:grid;grid-template-columns:repeat(6,minmax(0,168px));gap:12px;margin:0 0 20px}
.lu{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--border);border-radius:16px;padding:16px 8px 10px;background:var(--surface);text-align:center}
.lu .mut{font-size:12px;min-height:32px;line-height:1.3}
.lineup .hint{min-height:20px;margin-top:14px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================================================================
   AGENT ORB CORE
   Everything the mascot needs and nothing from the demo page: the seed
   genome, the shaders, the shared Stage, the Orb and the Runner.
   Hand it THREE (r128 core is enough):  var AgentOrb = AgentOrbCore(THREE)

   AgentOrb.makeGenome(seed)            pure: every trait the seed decides, as plain data
   AgentOrb.describeGenome(g, mascot)   pure: the same traits as [label, value] rows for people
   AgentOrb.createOrb(canvas, opts)     new Orb(canvas, opts), added to the Runner, loop started
       opts: seed, color ('#rrggbb'), size (css px; measured from the canvas if omitted),
             style ('retro' mascot | 'glass'), dark, reduced, notice (follow the pointer),
             pixelRatio, slow (draw at the lower frame rate)
   orb.setSeed(seed)   orb.setColor(hex)   orb.setStyle('retro' | 'glass')   orb.setTheme(dark)
   orb.setState(state, variant)         state: one of AgentOrb.STATES, or 'egg' for the waiting egg;
                                        variant: one of AgentOrb.VARIANTS, used by 'working'
   orb.getState()                       'egg', 'hatching' or the state name
   orb.feed('token', 0..1)              one streamed token of the answer
   orb.feed('key')                      one keystroke of the user
   orb.pet(x, amount)                   a hand on it: x from -1 (its left edge) to 1, amount 0..1 of a pat
   orb.setPointer(clientX, clientY)     point its attention there (null lets go);
                                        orb.attend(x, y, strength) is the raw, DOM-free form
   orb.hatch({ onDone })                play the hatch; orb.skipHatch() jumps to its end
   orb.paused = true                    stop updating and drawing this one;
                                        Runner.stop() / Runner.start() pause and resume all of them
   orb.reduced = true                   reduced motion
   orb.resize(size)                     new css size (or re-measure the canvas)
   orb.dispose()                        remove it and free its materials
   orb.onAuto = fn(state)               called when it changes state by itself (done -> idle, hatch -> idle)

   Where the core touches the page (all guarded, nothing at load time):
     Stage.get      lets THREE.WebGLRenderer create its own canvas, unless Stage.provide(key, renderer)
                    was called first with a renderer of yours ('px' for the mascot, 'aa' for glass)
     Stage.draw     copies the orb's square into orb.canvas through a 2D context; skipped when the orb
                    has no canvas. Stage.drawAt(orb, renderer, x, y) draws into a viewport of any
                    renderer instead, with no DOM at all
     Orb.resize     reads canvas.clientWidth and devicePixelRatio, sets canvas.width / height and
                    style.imageRendering
     Runner         requestAnimationFrame; document.hidden and visibilitychange; getBoundingClientRect,
                    scroll and resize to know what is on screen and where the pointer is
   ================================================================ */
function AgentOrbCore(THREE) {
'use strict';

/* ================================================================
   Small helpers
   ================================================================ */
var TAU = Math.PI * 2;
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function smooth(a, b, x) { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }
function decay(dt, tau) { return Math.exp(-dt / tau); }

// Seeded PRNG: string hash (xmur3) feeding mulberry32. Identity never touches Math.random.
function hashStr(str) {
  var h = 1779033703 ^ str.length;
  for (var i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function seeded(str) {
  var a = hashStr(str);
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hexToHsl(hex) {
  var n = parseInt(hex.slice(1), 16);
  var r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0;
  if (mx !== mn) {
    var d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;

  }

}
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 1); l = clamp(l, 0, 1);
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  var r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [r + m, g + m, b + m];
}

/* ================================================================
   The app's avatar palette, states, poses and expressions
   ================================================================ */
var PALETTE = { clay: '#b8674a', moss: '#5f8a4e', tide: '#3f7f9c', plum: '#7d5a9a', honey: '#c9952c', slate: '#5b6672', rose: '#c0607a', ink: '#2f3a52' };
var STATES = ['idle', 'listening', 'thinking', 'working', 'speaking', 'waiting', 'done', 'error', 'asleep'];
var VARIANTS = ['command', 'file', 'search', 'memory'];

// Resting pose of every state. Everything the orb shows is a weighted blend of these plus
// per-state gestures, so any state can cross-fade into any other.
var POSE = {
  idle:      { hz: 0.22, breath: 0.024, scale: 1.00, lift: 0.00,  squash: 0.00,  wob: 1.00, flow: 1.0,  spin: 1.0, core: 0.55, coreSize: 1.00, halo: 0.42, rim: 0.60, glint: 0.90, sat: 1.00, bright: 1.00, mote: 1.0, lean: 0.40 },
  listening: { hz: 0.15, breath: 0.007, scale: 1.10, lift: -0.015, squash: 0.035, wob: 0.18, flow: 0.3,  spin: 0.25, core: 0.78, coreSize: 0.80, halo: 0.62, rim: 1.10, glint: 1.20, sat: 1.05, bright: 1.07, mote: 0.25, lean: 1.00 },
  thinking:  { hz: 0.30, breath: 0.012, scale: 0.965, lift: 0.035, squash: 0.025, wob: 0.80, flow: 2.3,  spin: 2.8, core: 1.00, coreSize: 0.62, halo: 0.46, rim: 0.50, glint: 0.50, sat: 1.00, bright: 0.96, mote: 1.9, lean: 0.55 },
  working:   { hz: 0.50, breath: 0.010, scale: 1.00, lift: 0.00,  squash: -0.02, wob: 0.55, flow: 1.6,  spin: 1.7, core: 0.66, coreSize: 0.90, halo: 0.50, rim: 0.62, glint: 0.80, sat: 1.05, bright: 1.02, mote: 2.3, lean: 0.55 },
  speaking:  { hz: 0.34, breath: 0.010, scale: 1.03, lift: 0.01,  squash: 0.00,  wob: 1.10, flow: 1.4,  spin: 1.2, core: 0.74, coreSize: 1.10, halo: 0.56, rim: 0.72, glint: 0.92, sat: 1.08, bright: 1.05, mote: 1.3, lean: 0.60 },
  waiting:   { hz: 0.20, breath: 0.012, scale: 1.04, lift: 0.075, squash: 0.03,  wob: 0.35, flow: 0.6,  spin: 0.5, core: 0.68, coreSize: 1.00, halo: 0.52, rim: 0.85, glint: 1.05, sat: 1.05, bright: 1.04, mote: 0.6, lean: 0.85 },
  done:      { hz: 0.25, breath: 0.020, scale: 1.03, lift: 0.02,  squash: 0.00,  wob: 0.70, flow: 0.9,  spin: 1.0, core: 0.90, coreSize: 1.20, halo: 0.72, rim: 0.80, glint: 1.10, sat: 1.10, bright: 1.10, mote: 1.2, lean: 0.30 },
  error:     { hz: 0.42, breath: 0.010, scale: 0.95, lift: -0.06, squash: -0.07, wob: 1.30, flow: 0.7,  spin: 0.4, core: 0.32, coreSize: 0.80, halo: 0.22, rim: 0.35, glint: 0.42, sat: 0.50, bright: 0.84, mote: 0.5, lean: 0.25 },
  asleep:    { hz: 0.085, breath: 0.030, scale: 0.95, lift: -0.09, squash: -0.065, wob: 0.20, flow: 0.12, spin: 0.1, core: 0.16, coreSize: 0.90, halo: 0.08, rim: 0.25, glint: 0.06, sat: 0.55, bright: 0.74, mote: 0.12, lean: 0.00 }
};
var POSE_KEYS = Object.keys(POSE.idle);

// The face each state wears. up: upper lid (1 = this orb's resting height, more = wide), low: lower lid raise,
// close: lids shut, smile: +1 bends the lids into happy arcs, -1 into sleeping ones, tilt: + focused (inner
// ends down), - worried (inner ends up), pupil: size, asym: one eye wider than the other, blink: blink rate.
// mw / mo / mc are the mouth: width, opening, curve (+ smile, - frown).
var EXPR = {
  idle:      { up: 1.00, low: 0.00, close: 0, smile: 0.00,  tilt: 0.00,  pupil: 1.00, asym: 0.00, blink: 1.0,  mw: 1.00, mo: 0.00, mc: 0.30 },
  listening: { up: 1.26, low: 0.00, close: 0, smile: 0.00,  tilt: -0.05, pupil: 1.12, asym: 0.00, blink: 0.45, mw: 0.62, mo: 0.16, mc: 0.05 },
  thinking:  { up: 0.60, low: 0.26, close: 0, smile: 0.00,  tilt: 0.08,  pupil: 0.92, asym: 0.22, blink: 0.7,  mw: 0.55, mo: 0.00, mc: -0.12 },
  working:   { up: 0.86, low: 0.14, close: 0, smile: 0.00,  tilt: 0.13,  pupil: 0.96, asym: 0.00, blink: 0.6,  mw: 0.80, mo: 0.00, mc: 0.00 },
  speaking:  { up: 1.08, low: 0.05, close: 0, smile: 0.20,  tilt: -0.03, pupil: 1.04, asym: 0.00, blink: 1.0,  mw: 0.90, mo: 0.10, mc: 0.25 },
  waiting:   { up: 1.14, low: 0.00, close: 0, smile: 0.00,  tilt: -0.16, pupil: 1.10, asym: 0.34, blink: 0.9,  mw: 0.50, mo: 0.30, mc: 0.00 },
  done:      { up: 0.62, low: 0.90, close: 0, smile: 1.00,  tilt: 0.00,  pupil: 1.00, asym: 0.00, blink: 0.0,  mw: 1.30, mo: 0.30, mc: 0.90 },
  error:     { up: 0.95, low: 0.12, close: 0, smile: -0.20, tilt: -0.46, pupil: 0.70, asym: 0.12, blink: 1.9,  mw: 0.85, mo: 0.00, mc: -0.60 },
  asleep:    { up: 0.30, low: 0.00, close: 1, smile: -1.00, tilt: 0.00,  pupil: 1.00, asym: 0.00, blink: 0.0,  mw: 0.42, mo: 0.24, mc: 0.00 }
};
var EXPR_KEYS = Object.keys(EXPR.idle);

/* ================================================================
   Genome: everything the seed decides
   ================================================================ */
function makeGenome(seed) {
  var r = seeded('orb/' + seed);
  var pool = [];
  for (var i = 0; i < 160; i++) pool.push(r());
  var at = 0;
  function n() { return pool[at++]; }
  function nr(a, b) { return a + (b - a) * n(); }
  function sign() { return n() < 0.5 ? -1 : 1; }
  // Each trait pulls a fixed number of values, so traits stay independent of one another.
  var g = { seed: seed };

  var k = n();
  g.kind = k < 0.40 ? 'liquid' : k < 0.70 ? 'faceted' : 'wispy';
  var s = [n(), n(), n(), n(), n(), n()];
  if (g.kind === 'liquid') {
    g.freq = lerp(0.6, 1.25, s[0]); g.amp = lerp(0.05, 0.11, s[1]);
    g.freq2 = g.freq * lerp(2.0, 3.0, s[2]); g.amp2 = lerp(0.0, 0.012, s[3]);
    g.flowSpd = lerp(0.10, 0.22, s[4]); g.wisp = 0; g.feather = 0; g.facet = 0; g.detail = 0;
  } else if (g.kind === 'faceted') {
    g.freq = lerp(0.7, 1.4, s[0]); g.amp = lerp(0.07, 0.14, s[1]);
    g.freq2 = 3; g.amp2 = 0;
    g.flowSpd = lerp(0.05, 0.12, s[4]); g.wisp = 0; g.feather = 0; g.facet = 1;
    g.detail = s[5] < 0.3 ? 1 : s[5] < 0.75 ? 2 : 3;
  } else {
    g.freq = lerp(1.0, 1.6, s[0]); g.amp = lerp(0.07, 0.12, s[1]);
    g.freq2 = g.freq * lerp(2.0, 2.6, s[2]); g.amp2 = lerp(0.02, 0.04, s[3]);
    g.flowSpd = lerp(0.20, 0.36, s[4]); g.wisp = 1; g.feather = lerp(0.7, 1.0, s[5]); g.facet = 0; g.detail = 0;
  }
  g.yawSpd = nr(0.10, 0.26) * sign();
  g.tilt0 = nr(-0.35, 0.35);

  // inner structure (glass) or skin markings (mascot)
  var pats = ['swirl', 'bands', 'spiral', 'cells'];
  var p1 = Math.floor(n() * 4) % 4, p2 = (p1 + 1 + Math.floor(n() * 3)) % 4;
  var mix2 = n() < 0.55 ? nr(0.15, 0.4) : (n(), 0);
  g.pattern = pats[p1]; g.pattern2 = mix2 > 0 ? pats[p2] : null;
  g.pat = [0, 0, 0, 0]; g.pat[p1] = 1 - mix2; g.pat[p2] += mix2;
  g.patScale = nr(1.2, 2.5);
  g.bands = 2 + Math.floor(n() * 6);
  g.arms = 2 + Math.floor(n() * 4);
  g.twist = nr(0.5, 2.0);
  g.contrast = nr(0.7, 1.0);
  g.axisX = nr(-0.7, 0.7); g.axisZ = nr(-0.7, 0.7);
  g.spinSpd = nr(0.10, 0.26) * sign();

  // core
  g.coreSize = nr(0.30, 0.55);
  g.coreGain = nr(0.75, 1.2);

  // colour drift around the base hue
  g.hueB = nr(14, 40) * sign();
  g.hueC = -Math.sign(g.hueB) * nr(25, 70);
  g.satK = nr(0.92, 1.18);
  g.lightK = nr(-0.04, 0.05);

  // finish
  g.glintPow = nr(16, 60);
  g.glintGain = nr(0.75, 1.2);
  g.rim = nr(0.6, 1.15);

  // company: motes, satellites, rings
  var hasM = n() < 0.7; var mc = 4 + Math.floor(n() * 14);
  g.motes = hasM ? mc : 0;
  g.moteSpd = nr(0.6, 1.3);
  var hasS = n() < 0.40; var sc = n();
  g.sats = hasS ? (sc < 0.55 ? 1 : sc < 0.85 ? 2 : 3) : 0;
  g.satTilt = [nr(-0.5, 0.5), nr(-0.6, 0.6)];
  g.satSpd = nr(0.7, 1.3);
  var hasR = n() < 0.36; var rc = n();
  g.rings = hasR ? (rc < 0.72 ? 1 : 2) : 0;
  g.ring = [
    { r: nr(1.34, 1.52), w: nr(0.035, 0.09), tx: nr(0.18, 0.42) * sign(), tz: nr(-0.5, 0.5), spd: nr(0.25, 0.6) * sign() },
    { r: nr(1.56, 1.70), w: nr(0.02, 0.05), tx: nr(0.2, 0.5) * sign(), tz: nr(-0.7, 0.7), spd: nr(0.2, 0.5) * sign() }
  ];
  g.seedVec = [n(), n(), n(), n()];

  // temperament
  g.tempo = nr(0.86, 1.18);
  g.breathHz = nr(0.85, 1.2);
  g.restless = nr(0.8, 1.35);
  g.bounce = nr(0.32, 0.55);
  g.side = sign();
  g.phase = nr(0, 100);
  g.ph = [nr(0, TAU), nr(0, TAU), nr(0, TAU), nr(0, TAU)];
  g.flowDir = (function () {
    var a = nr(0, TAU), z = nr(-0.6, 0.6), q = Math.sqrt(1 - z * z);
    return g.kind === 'wispy' ? [0.15 * Math.cos(a), -1, 0.15 * Math.sin(a)] : [q * Math.cos(a), z, q * Math.sin(a)];
  })();

  // eyes
  var er = n(), ea = n(), ez = n();
  g.eyeShape = er < 0.36 ? 'round' : er < 0.70 ? 'tall' : 'wide';
  g.eyeAspect = g.eyeShape === 'round' ? lerp(0.95, 1.12, ea) : g.eyeShape === 'tall' ? lerp(1.30, 1.62, ea) : lerp(0.70, 0.86, ea);
  g.eyeSize = g.eyeShape === 'round' ? lerp(0.170, 0.225, ez) : g.eyeShape === 'tall' ? lerp(0.145, 0.190, ez) : lerp(0.190, 0.245, ez);
  g.eyeGap = nr(0.07, 0.20);
  g.eyeY = nr(-0.02, 0.16);
  g.eyeN = nr(2.0, 3.4);
  g.eyeLid = nr(0.70, 1.05);
  if (g.eyeShape === 'wide') g.eyeLid = Math.max(g.eyeLid, 0.84);
  g.eyeTilt = nr(-0.14, 0.14);
  var ps = n(), pz = n();
  g.pupil = ps < 0.40 ? 'full' : ps < 0.75 ? 'dot' : 'iris';
  g.pupilSize = g.pupil === 'dot' ? lerp(0.50, 0.66, pz) : lerp(0.80, 0.93, pz);
  g.eyeHi2 = n() < 0.45;
  g.blinkEvery = nr(2.4, 5.6);
  g.blinkDouble = nr(0.05, 0.30);
  g.blinkSpeed = nr(0.85, 1.25);

  // mascot build
  var sh = n();
  g.shape = sh < 0.26 ? 'round' : sh < 0.46 ? 'drop' : sh < 0.66 ? 'mochi' : sh < 0.84 ? 'bean' : 'egg';
  g.shapeAmt = nr(0.6, 1.0);
  var pb = n();
  g.poly = pb < 0.30 ? 2 : pb < 0.75 ? 3 : 4;
  g.flat = n() < 0.55;
  var dz = n();
  g.dither = dz < 0.40 ? 'bayer' : dz < 0.62 ? 'checker' : dz < 0.78 ? 'lines' : 'none';
  g.tones = n() < 0.5 ? 3 : 4;
  var tp = n();
  g.top = tp < 0.22 ? 'none' : tp < 0.40 ? 'antenna' : tp < 0.54 ? 'floater' : tp < 0.72 ? 'ears' : tp < 0.86 ? 'horn' : 'tuft';
  if (g.shape === 'drop' && (g.top === 'ears' || g.top === 'horn' || g.top === 'tuft')) g.top = tp < 0.8 ? 'none' : 'floater';
  g.topSize = nr(0.75, 1.2);
  g.topLean = nr(-0.3, 0.3);
  g.tail = n() < 0.30;
  g.tailSide = sign();
  g.marks = n() < 0.72;
  g.markLight = n() < 0.5;
  g.mouthW = nr(0.8, 1.25);

  // the egg it hatches from
  g.eggTeeth = 5 + Math.floor(n() * 3);
  g.eggCrackY = nr(0.0, 0.2);
  g.eggDyed = n() < 0.3;
  return g;
}

function describeGenome(g, retro) {
  var marks = g.pattern === 'bands' ? 'stripes ×' + g.bands : g.pattern === 'spiral' ? 'whorl, ' + g.arms + ' arms' : g.pattern === 'cells' ? 'spots' : 'patches';
  var inside = g.pattern === 'bands' ? 'bands ×' + g.bands : g.pattern === 'spiral' ? 'spiral, ' + g.arms + ' arms' : g.pattern;
  if (g.pattern2) inside += ' + ' + g.pattern2;
  var surface = g.kind === 'faceted' ? 'faceted, ' + [0, 80, 180, 320][g.detail] + ' faces' : g.kind;
  var temper = g.tempo > 1.08 ? 'quick' : g.tempo < 0.94 ? 'slow' : 'even';
  temper += g.bounce < 0.4 ? ', bouncy' : g.bounce > 0.48 ? ', composed' : '';
  var rows = [
    ['eyes', g.eyeShape + (g.eyeGap < 0.11 ? ', close-set' : g.eyeGap > 0.16 ? ', wide-set' : '')],
    ['pupils', g.pupil === 'full' ? 'big' : g.pupil === 'dot' ? 'small' : 'ringed'],
    ['lids', g.eyeLid < 0.76 ? 'heavy' : g.eyeLid > 0.95 ? 'wide open' : 'relaxed'],
    ['blink', 'about every ' + g.blinkEvery.toFixed(1) + ' s']
  ];
  if (retro) {
    rows.push(['body', g.shape + ', ' + [0, 80, 180, 320, 500][g.poly] + ' faces']);
    rows.push(['shading', (g.flat ? 'flat' : 'gouraud') + ', ' + g.tones + ' tones' + (g.dither === 'none' ? '' : ', ' + g.dither + ' dither')]);
    rows.push(['on top', g.top === 'none' ? (g.shape === 'drop' ? 'tip' : 'nothing') : g.top]);
    rows.push(['tail', g.tail ? 'yes' : 'no']);
    rows.push(['markings', g.marks ? marks : 'none']);
  } else {
    rows.push(['surface', surface]);
    rows.push(['inside', inside]);
    rows.push(['core', g.coreSize > 0.46 ? 'wide' : g.coreSize < 0.37 ? 'tight' : 'medium']);
  }
  if (retro) rows.push(['egg', (g.eggDyed ? 'tinted' : 'pale') + ' shell, ' + (g.marks ? marks : 'speckles')]);
  rows.push(['hue drift', (g.hueB > 0 ? '+' : '−') + Math.abs(Math.round(g.hueB)) + '°']);
  rows.push(['rings', String(g.rings)]);
  rows.push(['satellites', String(g.sats)]);
  rows.push(['motes', String(g.motes)]);
  rows.push(['temper', temper]);
  return rows;
}

/* ================================================================
   Shaders
   ================================================================ */
var NOISE = [
  'vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}',
  'vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}',
  'vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}',
  'vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}',
  'float snoise(vec3 v){',
  '  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);',
  '  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);',
  '  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);',
  '  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;',
  '  i=mod289(i);',
  '  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));',
  '  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;',
  '  vec4 j=p-49.0*floor(p*ns.z*ns.z);',
  '  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);',
  '  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);',
  '  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);',
  '  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));',
  '  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
  '  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);',
  '  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
  '  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;',
  '  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;',
  '  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
  '}'
].join('\n');

// Ordered dither thresholds in 0..1: 4x4 Bayer, a two-level checker, or scanlines.
var DITHER = [
  'uniform float uDk;',
  'float B2(vec2 a){ a = floor(a); return fract(a.x/2.0 + a.y*a.y*0.75); }',
  'float bayer4(vec2 p){ return B2(0.5*p)*0.25 + B2(p) + 0.03; }',
  'float dth(vec2 p){',
  '  if (uDk < 0.5) return B2(0.5*p)*0.25 + B2(p) + 0.03;',
  '  if (uDk < 1.5) { vec2 a = floor(p); return mod(a.x + a.y, 2.0)*0.5 + 0.25; }',
  '  return mod(floor(p.y), 2.0)*0.5 + 0.25;',
  '}'
].join('\n');

// Marking / interior pattern, shared by the body and the egg.
var PATTERN = [
  'uniform vec4 uPat; uniform vec4 uPatP; uniform vec2 uPatQ; uniform float uPatT;',
  'float pattern(vec3 q){',
  '  float t = uPatT; float v = 0.0;',
  '  if (uPat.x > 0.001) {',
  '    vec3 w = q*uPatP.x;',
  '    w += 0.6*sin(w.yzx*1.9 + t*0.9);',
  '    w += 0.4*sin(w.zxy*3.1 - t*0.7);',
  '    v += uPat.x * smoothstep(0.1, 0.9, 0.5 + 0.5*sin(3.4*(w.x + w.y*0.8 + w.z*0.5)));',
  '  }',
  '  if (uPat.y > 0.001) {',
  '    float lat = q.y + 0.10*sin(q.x*3.1 + t*0.6)*sin(q.z*2.7 - t*0.4);',
  '    float b = 0.5 + 0.5*sin(lat*uPatP.y*3.14159 + 0.7*uPatP.z*sin(q.x*2.0 + q.z*2.0 + t*0.3));',
  '    v += uPat.y * smoothstep(0.12, 0.88, b);',
  '  }',
  '  if (uPat.z > 0.001) {',
  '    float ang = atan(q.z, q.x); float rad = length(q.xz);',
  '    v += uPat.z * (0.5 + 0.5*sin(ang*uPatQ.x + rad*uPatP.z*4.5 - t*1.3 + q.y*2.2)*smoothstep(0.08, 0.6, rad));',
  '  }',
  '  if (uPat.w > 0.001) {',
  '    vec3 w = q*uPatP.x*1.7 + 0.5*sin(q.zxy*2.1 + t*0.5);',
  '    v += uPat.w * smoothstep(-0.25, 0.55, sin(w.x)*sin(w.y)*sin(w.z)*1.6);',
  '  }',
  '  return v;',
  '}'
].join('\n');

var BODY_VERT = [
  'attribute float aPart;',
  'uniform vec3 uFlow; uniform vec3 uFlow2; uniform vec4 uSurf; uniform float uWisp; uniform float uFace;',
  'uniform vec3 uVoice; uniform vec3 uFront;',
  'uniform vec4 uShape; uniform vec4 uBump[3]; uniform vec3 uBumpK;',
  'uniform vec4 uTop; uniform vec3 uTopDir; uniform vec3 uBend; uniform float uSnap;',
  'varying vec3 vN; varying vec3 vV; varying vec3 vObj; varying vec3 vN0; varying float vPart;',
  NOISE,
  'float disp(vec3 p){',
  '  float d = snoise(p*uSurf.x + uFlow) * uSurf.y;',
  '  if (uSurf.w > 0.0005) d += snoise(p*uSurf.z + uFlow2) * uSurf.w;',
  '  d *= mix(1.0, 0.35 + 1.1*smoothstep(-0.7, 1.0, p.y), uWisp);',
  '  if (uVoice.x > 0.0005) {',
  '    float a = acos(clamp(dot(p, uFront), -1.0, 1.0));',
  '    d += uVoice.x * sin(a*uVoice.z - uVoice.y) * smoothstep(2.4, 0.2, a);',
  '  }',
  // the face stays calmer than the rest so the eyes keep their shape
  '  d *= 1.0 - uFace*smoothstep(0.3, 0.9, p.z);',
  '  d += uBump[0].w * pow(max(dot(p, uBump[0].xyz), 0.0), uBumpK.x);',
  '  d += uBump[1].w * pow(max(dot(p, uBump[1].xyz), 0.0), uBumpK.y);',
  '  d += uBump[2].w * pow(max(dot(p, uBump[2].xyz), 0.0), uBumpK.z);',
  '  return d;',
  '}',
  'vec3 shape(vec3 p){',
  '  vec3 q = p*(1.0 + disp(p));',
  '  q.xz *= uShape.x*(1.0 - uShape.z*q.y);',
  '  q.y *= uShape.y;',
  '  float fb = -uShape.w;',
  '  q.y = fb + log(1.0 + exp((q.y - fb)*9.0))/9.0;',
  '  return q;',
  '}',
  'void main(){',
  '  vPart = aPart;',
  '  vec3 p = normalize(position);',
  '  vec3 pos; vec3 n;',
  '  if (aPart < 0.5) {',
  '    vec3 up = abs(p.y) > 0.92 ? vec3(1.0,0.0,0.0) : vec3(0.0,1.0,0.0);',
  '    vec3 t1 = normalize(cross(up, p)); vec3 t2 = cross(p, t1);',
  '    vec3 pa = normalize(p + t1*0.06); vec3 pb = normalize(p + t2*0.06);',
  '    pos = shape(p); vec3 qa = shape(pa); vec3 qb = shape(pb);',
  '    n = normalize(cross(qa - pos, qb - pos));',
  '    if (dot(n, p) < 0.0) n = -n;',
  '    vObj = p;',
  '  } else {',
  // antenna stalk (1) and its ball (2), anchored on the body and bent by a lagging spring
  '    vec3 base = shape(uTopDir);',
  '    vec3 up = normalize(uTopDir + vec3(0.0, 0.7, 0.0));',
  '    if (aPart < 1.5) {',
  '      float t = position.y;',
  '      pos = base*0.96 + up*uTop.x*t + uBend*t*t + vec3(position.x, 0.0, position.z)*uTop.y*(1.0 - 0.35*t);',
  '      n = normalize(vec3(position.x, 0.25, position.z));',
  '    } else {',
  '      pos = base*0.96 + up*uTop.x + uBend + p*uTop.z;',
  '      n = p;',
  '    }',
  '    pos *= uTop.w;',
  '    vObj = vec3(0.0, 0.0, -1.0);',
  '  }',
  '  vN = normalize(normalMatrix * n);',
  '  vN0 = normalize(normalMatrix * p);',
  '  vec4 mv = modelViewMatrix * vec4(pos, 1.0);',
  '  vV = mv.xyz;',
  '  vec4 clip = projectionMatrix * mv;',
  // PS1-style vertex snap to the low-resolution pixel grid
  '  if (uSnap > 0.5) clip.xy = floor(clip.xy/clip.w*uSnap + 0.5)/uSnap*clip.w;',
  '  gl_Position = clip;',
  '}'
].join('\n');

var BODY_FRAG = [
  'uniform vec3 uCenterV; uniform float uS;',
  'uniform vec3 uDeep; uniform vec3 uShade; uniform vec3 uBase; uniform vec3 uLight; uniform vec3 uSpec; uniform vec3 uColB; uniform vec3 uColC; uniform vec3 uHot; uniform vec3 uRimCol;',
  'uniform mat3 uInner;',
  'uniform vec3 uCorePos; uniform vec3 uCore;',
  'uniform vec3 uGaze; uniform vec2 uGlint; uniform float uRim; uniform float uFacet; uniform float uFeather; uniform float uDetail; uniform float uWisp;',
  'uniform vec4 uGrade; uniform vec4 uAcc; uniform vec4 uAccP; uniform vec3 uRings[4];',
  'uniform float uRetro; uniform vec2 uTone; uniform float uLamp; uniform float uFade;',
  'uniform vec4 uEye; uniform vec4 uEyeS; uniform vec4 uLidL; uniform vec4 uLidR; uniform vec4 uPup; uniform vec4 uEyeK;',
  'uniform vec3 uEyeW; uniform vec3 uEyeD; uniform vec3 uEyeI; uniform vec3 uEyeLn;',
  'uniform vec4 uMouth; uniform vec3 uMouthK;',
  'varying vec3 vN; varying vec3 vV; varying vec3 vObj; varying vec3 vN0; varying float vPart;',
  DITHER,
  PATTERN,
  'void main(){',
  '  vec3 N = normalize(vN);',
  '  if (uFacet > 0.001) {',
  '    vec3 fn = normalize(cross(dFdx(vV), dFdy(vV)));',
  '    N = normalize(mix(N, fn, uFacet));',
  '  }',
  '  vec3 rd = normalize(vV);',
  '  float ndv = clamp(dot(N, -rd), 0.0, 1.0);',
  '  vec3 c = (vV - uCenterV) / uS;',
  '  vec3 L = normalize(vec3(-0.45, 0.65, 0.62));',
  '  vec3 fo = normalize(vObj);',
  '  float fwo = fwidth(fo.y);',
  '  float isBody = step(vPart, 0.5);',
  '  float face = smoothstep(0.4, 0.85, fo.z) * isBody;',
  '  float bay = dth(gl_FragCoord.xy);',
  '  if (uFade < 0.999 && bayer4(gl_FragCoord.xy) > uFade) discard;',
  // light shared by both looks: the reading band, rings passing through, the core
  '  float sy = clamp(c.y, -0.999, 0.999);',
  '  float lon = clamp(c.x / sqrt(1.0 - sy*sy), -1.0, 1.0);',
  '  float bx = (lon - uAccP.y) / mix(0.34, 0.2, uDetail);',
  '  float band = exp(-bx*bx) * uAcc.y;',
  '  float rl = length(c.xy);',
  '  float ring = 0.0;',
  '  for (int i = 0; i < 4; i++) { vec3 R = uRings[i]; float x = (rl - R.x)/R.z; ring += R.y*exp(-x*x); }',
  '  ring *= smoothstep(1.05, 0.9, rl);',
  '  vec3 kv = uCorePos - c; vec3 perp = kv - dot(kv, rd)*rd; float d2 = dot(perp, perp);',
  '  float cs = uCore.y*uCore.y;',
  '  float coreG = exp(-d2/cs);',
  '  vec3 col;',
  '  if (uRetro > 0.5) {',
  // mascot: a few flat tones picked by the light, dithered where they meet
  '    float nl = dot(N, L) + (coreG*uCore.x*0.30 + band*0.6 + ring*0.5)*isBody + uGrade.z*2.2;',
  '    float x = nl + (bay - 0.5)*uTone.y;',
  '    float ti = uTone.x > 3.5 ? step(-0.25, x) + step(0.22, x) + step(0.84, x) : step(-0.05, x)*2.0 + step(0.84, x);',
  '    col = ti < 0.5 ? uDeep : ti < 1.5 ? uShade : ti < 2.5 ? uBase : uLight;',
  '    if (vPart < 0.5) {',
  '      if (uPatP.w > 0.001) col = mix(col, uColB*(0.70 + 0.16*ti), step(uPatQ.y, pattern(fo)) * (1.0 - face));',
  '      if (1.0 - ndv > 0.80 - 0.12*uRim && N.y - N.x*0.5 > 0.15) col = mix(col, uRimCol, 0.45);',
  '    } else if (vPart < 1.5) {',
  '      col = uDeep;',
  '    } else {',
  '      col = (ti < 1.5 ? uColC*0.72 : ti < 2.5 ? uColC : mix(uColC, vec3(1.0), 0.5)) + uHot*uLamp;',
  '    }',
  '    if (uGlint.x > 0.3 && dot(N, uGaze) > uGlint.y) col = uSpec;',
  '  } else {',
  // glass: interior pattern seen through the surface with a little parallax
  '    float dif = smoothstep(-0.4, 1.0, dot(N, L));',
  '    dif = mix(dif, 0.5 + 0.3*dif, uWisp);',
  '    vec3 rr = refract(rd, N, 0.72);',
  '    float v = pattern(uInner * (c + rr*0.30));',
  '    if (uDetail > 0.3) v = mix(v, pattern(uInner * (c + rr*0.85) * 1.25 + 2.7), 0.38);',
  '    float pc = uPatP.w * mix(0.5, 1.0, uDetail) * (1.0 - 0.35*face);',
  '    float shade = clamp(dif + (v - 0.5)*0.30*pc, 0.0, 1.0);',
  '    col = mix(uDeep, uBase, smoothstep(0.04, 0.7, shade));',
  '    col = mix(col, uLight, smoothstep(0.72, 1.0, shade)*0.85);',
  '    col = mix(col, uColB*(0.45 + 0.7*dif), smoothstep(0.35, 0.9, v)*pc*0.6);',
  '    col = mix(col, uColC, smoothstep(0.72, 0.98, v)*pc*0.4);',
  '    col = mix(col, uDeep, smoothstep(0.35, 0.0, v)*pc*0.35);',
  '    col *= mix(0.74, 1.0, smoothstep(0.0, 0.62, ndv));',
  '    col += uLight * (band*0.55 + ring*0.42);',
  '    col += uHot * coreG * uCore.x * 0.5;',
  '    col += vec3(1.0) * exp(-d2/(cs*0.12)) * uCore.x * 0.22;',
  '  }',
  // the face: two eyes (and, on the mascot, a small mouth) painted on the skin in object space
  '  float eyeM = 0.0;',
  '  if (vPart < 0.5 && fo.z > 0.1) {',
  '    float hard = uRetro;',
  '    float fwq = fwo / uEye.w;',
  '    float es = fo.x < 0.0 ? -1.0 : 1.0;',
  '    vec2 q = vec2((fo.x - es*uEye.x)/uEye.z, (fo.y - uEye.y)/uEye.w);',
  '    float en = uEyeS.x;',
  '    float er = pow(pow(abs(q.x), en) + pow(abs(q.y), en), 1.0/en);',
  '    float aa = mix(clamp(fwq*0.8, 0.012, 0.5), 0.0001, hard);',
  '    if (er < 1.7) {',
  '      vec4 lid = es < 0.0 ? uLidL : uLidR;',
  '      float x2 = q.x*q.x;',
  '      float yu = lid.x + lid.z*x2 + lid.w*q.x*es;',
  '      float yl = lid.y + lid.z*x2*0.7 - lid.w*q.x*es*0.3;',
  '      float ym = 0.5*(yu + yl);',
  '      yu = max(yu, ym); yl = min(yl, ym);',
  '      float d = max(er - 1.0, max(q.y - yu, yl - q.y));',
  '      float open = smoothstep(aa, -aa, d);',
  '      float dif0 = smoothstep(-0.4, 1.0, dot(normalize(vN0), L));',
  '      float lsh = smoothstep(0.5, 0.0, yu - q.y);',
  '      vec3 ec = uEyeW * mix((0.80 + 0.24*dif0)*(1.0 - 0.30*lsh), 1.0 - 0.15*step(0.42, lsh), hard);',
  '      vec2 pq = (q - uPup.xy) * vec2(1.0, uPup.z);',
  '      float pr = length(pq) / uEyeS.y;',
  '      float pa = aa / uEyeS.y;',
  '      if (uEyeS.z > 0.001) ec = mix(ec, uEyeI * mix(0.75 + 0.35*dif0, 1.0, hard), smoothstep(1.0 + pa, 1.0 - pa, pr));',
  '      float pin = uEyeS.z > 0.001 ? uEyeS.z : 1.0;',
  '      ec = mix(ec, uEyeD, smoothstep(pin + pa, pin - pa, pr));',
  // highlight; while a command runs it squares off into a blinking cursor
  '      float sq = max(uPup.w, hard*0.7);',
  '      float hmin = hard*0.8*fwq/uEyeS.y;',
  '      vec2 hq = (pq/uEyeS.y - vec2(-0.30, 0.36)) / max(vec2(mix(0.27, 0.17, uPup.w), mix(0.27, 0.33, uPup.w)), vec2(hmin));',
  '      float hn = mix(2.0, 7.0, sq);',
  '      float hr = pow(pow(abs(hq.x), hn) + pow(abs(hq.y), hn), 1.0/hn);',
  '      float hl = smoothstep(1.0 + pa*2.5, 1.0 - pa*2.5, hr) * mix(1.0, uEyeK.w, uPup.w);',
  '      hl += smoothstep(0.15 + pa, 0.15 - pa, length(pq/uEyeS.y - vec2(0.30, -0.32))) * uEyeK.z * 0.7;',
  '      ec = mix(ec, vec3(1.0), clamp(hl, 0.0, 1.0) * uEyeS.w);',
  '      col = mix(col, ec, open);',
  // the lid line is always there, so a closed eye is still a clear mark
  '      float shut = 1.0 - smoothstep(0.0, 0.5, yu - yl);',
  '      float th = max(uEyeK.x * (1.0 + 0.6*smoothstep(-0.3, 0.3, q.y - ym)) * (1.0 + 0.5*shut), hard*mix(0.55, 0.95, shut)*fwq);',
  '      float line = smoothstep(th + aa, max(th - aa, 0.0), abs(d)) * max(uEyeK.y, shut) * mix(1.0, step(abs(q.x), 0.86), shut*hard);',
  '      col = mix(col, uEyeLn, line);',
  '      eyeM = max(open, line);',
  '    }',
  '    if (uMouthK.x > 0.001) {',

/* The creature already leaves room above its head for ears and antennae; a hat asks for more, and
   something wide asks for room at the sides. */
function room(orb) {
  var b = orb._base, w = orb._wear;
  if (!b) return;
  var top = Math.max(-b.rest / (0.34 * b.fill), w ? w.top - 1 : 0);
  orb.fill = Math.min(b.fill, 0.95 / (1 + top * 0.8), w && w.wide ? 0.94 / w.wide : 9);
  orb.rest = -top * 0.34 * orb.fill;
}
// What grows on its head, as the creature itself made it: kept so that a hat's changes can be undone.
function keep(orb) {
  var u = orb.uB, b = u.uBump.value;
  orb._base = { fill: orb.fill, rest: orb.rest, top: u.uTop.value.w, bumps: [b[0].clone(), b[1].clone()] };
}
function restore(orb) {
  var u = orb.uB, b = orb._base;
  u.uTop.value.w = b.top; u.uBump.value[0].copy(b.bumps[0]); u.uBump.value[1].copy(b.bumps[1]);
}
function hook(orb) {
  if (orb._base) return;
  keep(orb);
  var update = orb.update, lod = orb._lod;
  orb.update = function (dt) {
    update.call(this, dt);
    var w = this._wear;
    if (w) for (var i = 0; i < w.ticks.length; i++) w.ticks[i](dt, this.t);
  };
  // its size or its seed changed: what it wore was fitted to the old body
  orb._lod = function () { lod.call(this); keep(this); var was = this._outfit; if (was) { this._wearing = null; dress(this, was); } };
}
function strip(orb) {
  var w = orb._wear;
  if (!w) return;
  orb.body.remove(w.root);
  w.trash.forEach(function (x) { x.dispose(); });
  orb._wear = null; orb._wearing = ""; orb._outfit = null;
  restore(orb); room(orb);
}
function dress(orb, outfit) {
  outfit = outfit || {};
  var sig = SLOTS.map(function (s) { return ITEMS[outfit[s]] ? outfit[s] : ""; }).join("/");
  if (orb._wearing === sig) return;
  hook(orb);
  strip(orb);
  var m = new Maker(orb);
  SLOTS.forEach(function (s) { var it = ITEMS[outfit[s]]; if (it) it.make(m); });
  m.settle();
  orb.body.add(m.root);
  orb._wear = m; orb._wearing = sig; orb._outfit = outfit;
  room(orb);
}

/* How far the deepest corner of anything it wears is inside its body, in body radii; nothing is
   when this is zero or less. */
function audit(orb) { return orb._wear ? orb._wear.sunk(orb._wear.root) : -9; }

return { ITEMS: ITEMS, ORDER: ORDER, SLOTS: SLOTS, RARITIES: RARITIES, dress: dress, strip: strip, audit: audit, core: null };
