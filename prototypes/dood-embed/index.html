<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Dood in a post · mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #000;
  color: #e7e9ea;
  font: 15px/1.35 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
#app { min-height: 100%; padding-bottom: 120px; }

/* The post, as X draws one that is open by itself. Pretend, and only as much of it as is needed. */
.x-col { width: min(600px, 100%); margin: 0 auto; border-inline: 1px solid #2f3336; min-height: 100vh; }
.x-head { display: flex; align-items: center; gap: 28px; height: 53px; padding: 0 16px; font-size: 20px; font-weight: 700; }
.x-head span:first-child { font-weight: 400; font-size: 20px; }
.x-post { padding: 12px 16px 0; border-bottom: 1px solid #2f3336; }
.x-who { display: flex; align-items: center; gap: 10px; }
.x-face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none; background: #16202a; }
.x-face canvas { display: block; width: 100%; height: 100%; }
.x-name { font-weight: 700; }
.x-at, .x-meta, .x-from { color: #71767b; }
.x-text { margin: 12px 0; font-size: 17px; line-height: 1.4; white-space: pre-line; }
.x-text a, .x-link { color: #1d9bf0; }
.x-from { font-size: 13px; margin: 4px 0 0; }
.x-meta { padding: 14px 0; border-bottom: 1px solid #2f3336; }
.x-meta b { color: #e7e9ea; font-weight: 700; }
.x-acts { display: flex; gap: 20px; padding: 12px 0; color: #71767b; font-size: 13px; }
.x-reply { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #2f3336; }
.x-reply p { margin: 2px 0 0; }
.x-wide { position: relative; aspect-ratio: 1.91; border-radius: 16px; overflow: hidden; border: 1px solid #2f3336; cursor: pointer; }
.x-tag { position: absolute; left: 12px; bottom: 12px; padding: 1px 6px; border-radius: 4px; background: rgb(0 0 0 / 0.77); font-size: 13px; }

/* The card: the page of ours that X shows in the post. Everything inside it is ours. */
.card { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; border: 1px solid #2f3336; background: #0b1c26; user-select: none; touch-action: manipulation; }
.card.fill { aspect-ratio: auto; height: 100%; border: 0; border-radius: 0; }
.card canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.card .egg { position: absolute; top: 0; left: 0; pointer-events: none; will-change: transform; visibility: hidden; }
.card .egg canvas { display: block; width: 100%; height: 100%; }
.card .mark { position: absolute; top: 12px; left: 14px; font-size: 12px; font-weight: 600; color: rgb(255 255 255 / 0.6); letter-spacing: 0.01em; }
.card .skip { position: absolute; top: 8px; right: 10px; padding: 4px 12px; border-radius: 99px; font-size: 12px; color: rgb(255 255 255 / 0.6); }
.card .skip:hover { background: rgb(255 255 255 / 0.1); color: #fff; }
.card .say { position: absolute; inset-inline: 0; bottom: 9%; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; text-shadow: 0 2px 0 rgb(0 0 0 / 0.35); pointer-events: none; transition: opacity 0.4s; }
.card .say small { display: block; margin-top: 4px; font-size: 13px; font-weight: 500; opacity: 0.75; }
.card .say[data-on="false"] { opacity: 0; }

.card .panel { position: absolute; inset-inline: 12px; bottom: 12px; padding: 14px; border-radius: 14px; background: #fff; color: #171717; box-shadow: 0 10px 30px rgb(0 0 0 / 0.35); transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s; }
.card .panel[data-on="false"] { transform: translateY(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.panel p { margin: 0; }
.panel .line { font-size: 16px; font-weight: 600; }
.panel .sub { margin-top: 2px; font-size: 13px; color: #6b6b6b; }
.panel .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.panel input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 10px; background: #fff; color: #171717; font-size: 16px; outline: none; }
.panel input:focus { border-color: #171717; }
.panel .dots { display: flex; gap: 7px; margin-top: 12px; }
.panel .dot { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgb(255 255 255 / 0.45); }
.panel .dot[aria-pressed="true"] { outline: 2px solid #171717; outline-offset: 2px; }
.btn { height: 40px; padding: 0 16px; border-radius: 99px; font-weight: 600; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.dark { background: #171717; color: #fff; }
.btn.dark:hover { background: #000; }
.btn.light { background: #efefef; color: #171717; }
.btn.light:hover { background: #e4e4e4; }
.btn.grow { flex: 1; }
.btn[disabled] { opacity: 0.4; cursor: default; }
.panel .count { margin-left: auto; font-size: 12px; color: #6b6b6b; font-variant-numeric: tabular-nums; }

/* What X shows before the card is played: our picture, and its own play button. */
.card .poster { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / 0.18); cursor: pointer; }
.card .poster[hidden] { display: none; }
.poster .play { width: 68px; height: 68px; border-radius: 50%; background: #1d9bf0; border: 4px solid #fff; display: grid; place-items: center; }
.poster .play::after { content: ""; margin-left: 5px; border: 13px solid transparent; border-left: 20px solid #fff; border-right: 0; }
.poster h2 { position: absolute; inset-inline: 0; bottom: 8%; margin: 0; text-align: center; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; text-shadow: 0 3px 0 rgb(0 0 0 / 0.3); }
.poster h2 small { display: block; font-size: 14px; font-weight: 500; letter-spacing: 0; opacity: 0.8; margin-top: 4px; }

/* Writing the post. */
.x-dim { position: fixed; inset: 0; background: rgb(91 112 131 / 0.4); display: grid; place-items: start center; padding-top: 5vh; overflow: auto; }
.x-compose { width: min(600px, calc(100% - 24px)); background: #000; border-radius: 16px; padding: 12px 16px 12px; margin-bottom: 140px; }
.x-compose .x-text { font-size: 20px; }
.x-compose .bar { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #2f3336; margin-top: 12px; padding-top: 12px; color: #71767b; font-size: 13px; }
.x-go { height: 36px; padding: 0 18px; border-radius: 99px; background: #eff3f4; color: #0f1419; font-weight: 700; }
.x-compose .card { width: min(340px, 100%); }

/* A browser window, for the page a button in the card opens. */
.win { width: min(980px, calc(100% - 32px)); margin: 28px auto 0; border-radius: 12px; overflow: hidden; border: 1px solid #2f3336; background: #0b1c26; }
.win .bar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: #202327; }
.win .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a3f45; }
.win .bar span { flex: 1; margin-left: 10px; height: 26px; border-radius: 8px; background: #2f3336; padding: 0 12px; font-size: 13px; line-height: 26px; color: #c4c9cc; }
.win .body { height: min(600px, 68vh); }
.win .panel { inset-inline: auto; left: 50%; width: min(440px, calc(100% - 24px)); translate: -50% 0; bottom: 24px; padding: 18px; }
.win .panel .btn { height: 44px; }

/* A phone. */
.phone { width: 390px; max-width: calc(100% - 24px); height: 780px; margin: 24px auto 0; border-radius: 44px; border: 10px solid #1c1f23; background: #000; overflow: hidden; position: relative; }
.phone .x-col { border: 0; min-height: 0; }
.phone .sheet { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
.phone .sheet[data-on="true"] { transform: none; }
.phone .sheet .bar { display: flex; align-items: center; gap: 12px; padding: 48px 16px 10px; font-size: 13px; color: #c4c9cc; background: #16181c; }
.phone .sheet .bar b { color: #1d9bf0; font-weight: 600; font-size: 15px; }
.phone .sheet .body { flex: 1; min-height: 0; }

/* The two lines along the bottom. Not part of the design. */
#strip { position: fixed; inset-inline: 0; bottom: 0; background: #111417; border-top: 1px solid #2f3336; padding: 10px 14px; font-size: 13px; z-index: 10; }
#strip nav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#strip nav b { margin-right: 6px; color: #71767b; font-weight: 600; }
#strip button { padding: 5px 11px; border-radius: 99px; background: #202327; color: #c4c9cc; }
#strip button[aria-current="true"] { background: #e7e9ea; color: #0f1419; font-weight: 600; }
#strip p { margin: 8px 0 0; color: #9aa1a6; max-width: 110ch; }

.card.wide { aspect-ratio: 1.91; cursor: pointer; }
.card.wide .poster h2 { top: auto; bottom: 10px; left: 12px; right: auto; font-size: 13px; font-weight: 500; letter-spacing: 0; padding: 1px 6px; border-radius: 4px; background: rgb(0 0 0 / 0.77); text-shadow: none; }
.card.wide .poster h2 small { display: none; }
.x-compose .card { margin-top: 4px; }

/* Three things out of a present, each on the Dood it would be worn by. */
.panel .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.panel .tile { display: flex; flex-direction: column; align-items: center; padding: 6px 4px 8px; border-radius: 12px; background: #f3f3f3; color: #171717; }
.panel .tile:hover { background: #ebebeb; }
.panel .tile[aria-pressed="true"] { outline: 2px solid #171717; outline-offset: -2px; background: #fff; }
.panel .tile canvas { width: 72px; height: 72px; }
.panel .tile b { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.2; }
.panel .tile i { font-size: 11px; font-style: normal; font-weight: 600; text-transform: capitalize; }

/* How near its owner's next present is. */
.panel .meter { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: #6b6b6b; }
.panel .pips { display: flex; gap: 4px; }
.panel .pips i { width: 14px; height: 14px; border-radius: 4px; background: #e2e2e2; transition: background 0.3s; }
.panel .pips i[data-on="true"] { background: #c9952c; }
.panel .meter[data-full="true"] { color: #171717; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="strip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================================================================
   AGENT ORB CORE
   Everything the mascot needs and nothing from the demo page: the seed
   genome, the shaders, the shared Stage, the Orb and the Runner.
   Hand it THREE (r128 core is enough):  var AgentOrb = AgentOrbCore(THREE)

   AgentOrb.makeGenome(seed)            pure: every trait the seed decides, as plain data
   AgentOrb.describeGenome(g, mascot)   pure: the same traits as [label, value] rows for people
   AgentOrb.createOrb(canvas, opts)     new Orb(canvas, opts), added to the Runner, loop started
       opts: seed, color ('#rrggbb'), size (css px; measured from the canvas if omitted),
             style ('retro' mascot | 'glass'), dark, reduced, notice (follow the pointer),
             pixelRatio, slow (draw at the lower frame rate)
   orb.setSeed(seed)   orb.setColor(hex)   orb.setStyle('retro' | 'glass')   orb.setTheme(dark)
   orb.setState(state, variant)         state: one of AgentOrb.STATES, or 'egg' for the waiting egg;
                                        variant: one of AgentOrb.VARIANTS, used by 'working'
   orb.getState()                       'egg', 'hatching' or the state name
   orb.feed('token', 0..1)              one streamed token of the answer
   orb.feed('key')                      one keystroke of the user
   orb.pet(x, amount)                   a hand on it: x from -1 (its left edge) to 1, amount 0..1 of a pat
   orb.setPointer(clientX, clientY)     point its attention there (null lets go);
                                        orb.attend(x, y, strength) is the raw, DOM-free form
   orb.offer(true | false)              a treat is held out to it: it opens its mouth for it, until told otherwise
   orb.bite()                           it takes a bite of what it was offered
   orb.cheer()                          a pleased little hop, whatever it is doing
   orb.hatch({ onDone, onOut })         play the hatch; orb.skipHatch() jumps to its end. onOut is the moment
                                        the shell breaks
   orb.crack(0..1)                      how cracked the waiting egg is: it keeps its cracks while it waits,
                                        and the hatch goes on from them
   orb.shadow = 0..1                    how much of its shadow is drawn: 0 for one that is in the air
   orb.turn = radians                   how far its egg is turned about its long axis: one that falls spins
   orb.stance()                         where it stands in its picture: { ground, egg }, see orb-core.d.ts
   orb.paused = true                    stop updating and drawing this one;
                                        Runner.stop() / Runner.start() pause and resume all of them
   orb.reduced = true                   reduced motion
   orb.resize(size)                     new css size (or re-measure the canvas)
   orb.dispose()                        remove it; its materials are freed a little later (Stage.retire)
   orb.onAuto = fn(state)               called when it changes state by itself (done -> idle, hatch -> idle)
   orb.hidden = true                    draw its scene without it: for something else shown on its stage
   orb.worn                             null, or what it has on (see wardrobe.js): { tick(dt, t), fit(), dispose() },
                                        called after each update, after its size or seed changes, and when it goes

   Where the core touches the page (all guarded, nothing at load time):
     Stage.get      lets THREE.WebGLRenderer create its own canvas, unless Stage.provide(key, renderer)
                    was called first with a renderer of yours ('px' for the mascot, 'aa' for glass)
     Stage.draw     copies the orb's square into orb.canvas through a 2D context; skipped when the orb
                    has no canvas. Stage.drawAt(orb, renderer, x, y) draws into a viewport of any
                    renderer instead, with no DOM at all
     Orb.resize     reads canvas.clientWidth and devicePixelRatio, sets canvas.width / height and
                    style.imageRendering
     Runner         requestAnimationFrame; document.hidden and visibilitychange; getBoundingClientRect,
                    scroll and resize to know what is on screen and where the pointer is
   ================================================================ */
function AgentOrbCore(THREE) {
'use strict';

/* ================================================================
   Small helpers
   ================================================================ */
var TAU = Math.PI * 2;
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function smooth(a, b, x) { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); }
function decay(dt, tau) { return Math.exp(-dt / tau); }

// Seeded PRNG: string hash (xmur3) feeding mulberry32. Identity never touches Math.random.
function hashStr(str) {
  var h = 1779033703 ^ str.length;
  for (var i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function seeded(str) {
  var a = hashStr(str);
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hexToHsl(hex) {
  var n = parseInt(hex.slice(1), 16);
  var r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0;
  if (mx !== mn) {
    var d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 1); l = clamp(l, 0, 1);
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  var r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [r + m, g + m, b + m];
}

/* ================================================================
   The app's avatar palette, states, poses and expressions
   ================================================================ */
var PALETTE = { clay: '#b8674a', moss: '#5f8a4e', tide: '#3f7f9c', plum: '#7d5a9a', honey: '#c9952c', slate: '#5b6672', rose: '#c0607a', ink: '#2f3a52' };
var STATES = ['idle', 'listening', 'thinking', 'working', 'speaking', 'waiting', 'done', 'error', 'asleep'];
var VARIANTS = ['command', 'file', 'search', 'memory'];

// Resting pose of every state. Everything the orb shows is a weighted blend of these plus
// per-state gestures, so any state can cross-fade into any other.
var POSE = {
  idle:      { hz: 0.22, breath: 0.024, scale: 1.00, lift: 0.00,  squash: 0.00,  wob: 1.00, flow: 1.0,  spin: 1.0, core: 0.55, coreSize: 1.00, halo: 0.42, rim: 0.60, glint: 0.90, sat: 1.00, bright: 1.00, mote: 1.0, lean: 0.40 },
  listening: { hz: 0.15, breath: 0.007, scale: 1.10, lift: -0.015, squash: 0.035, wob: 0.18, flow: 0.3,  spin: 0.25, core: 0.78, coreSize: 0.80, halo: 0.62, rim: 1.10, glint: 1.20, sat: 1.05, bright: 1.07, mote: 0.25, lean: 1.00 },
  thinking:  { hz: 0.30, breath: 0.012, scale: 0.965, lift: 0.035, squash: 0.025, wob: 0.80, flow: 2.3,  spin: 2.8, core: 1.00, coreSize: 0.62, halo: 0.46, rim: 0.50, glint: 0.50, sat: 1.00, bright: 0.96, mote: 1.9, lean: 0.55 },
  working:   { hz: 0.50, breath: 0.010, scale: 1.00, lift: 0.00,  squash: -0.02, wob: 0.55, flow: 1.6,  spin: 1.7, core: 0.66, coreSize: 0.90, halo: 0.50, rim: 0.62, glint: 0.80, sat: 1.05, bright: 1.02, mote: 2.3, lean: 0.55 },
  speaking:  { hz: 0.34, breath: 0.010, scale: 1.03, lift: 0.01,  squash: 0.00,  wob: 1.10, flow: 1.4,  spin: 1.2, core: 0.74, coreSize: 1.10, halo: 0.56, rim: 0.72, glint: 0.92, sat: 1.08, bright: 1.05, mote: 1.3, lean: 0.60 },
  waiting:   { hz: 0.20, breath: 0.012, scale: 1.04, lift: 0.075, squash: 0.03,  wob: 0.35, flow: 0.6,  spin: 0.5, core: 0.68, coreSize: 1.00, halo: 0.52, rim: 0.85, glint: 1.05, sat: 1.05, bright: 1.04, mote: 0.6, lean: 0.85 },
  done:      { hz: 0.25, breath: 0.020, scale: 1.03, lift: 0.02,  squash: 0.00,  wob: 0.70, flow: 0.9,  spin: 1.0, core: 0.90, coreSize: 1.20, halo: 0.72, rim: 0.80, glint: 1.10, sat: 1.10, bright: 1.10, mote: 1.2, lean: 0.30 },
  error:     { hz: 0.42, breath: 0.010, scale: 0.95, lift: -0.06, squash: -0.07, wob: 1.30, flow: 0.7,  spin: 0.4, core: 0.32, coreSize: 0.80, halo: 0.22, rim: 0.35, glint: 0.42, sat: 0.50, bright: 0.84, mote: 0.5, lean: 0.25 },
  asleep:    { hz: 0.085, breath: 0.030, scale: 0.95, lift: -0.09, squash: -0.065, wob: 0.20, flow: 0.12, spin: 0.1, core: 0.16, coreSize: 0.90, halo: 0.08, rim: 0.25, glint: 0.06, sat: 0.55, bright: 0.74, mote: 0.12, lean: 0.00 }
};
var POSE_KEYS = Object.keys(POSE.idle);

// The face each state wears. up: upper lid (1 = this orb's resting height, more = wide), low: lower lid raise,
// close: lids shut, smile: +1 bends the lids into happy arcs, -1 into sleeping ones, tilt: + focused (inner
// ends down), - worried (inner ends up), pupil: size, asym: one eye wider than the other, blink: blink rate.
// mw / mo / mc are the mouth: width, opening, curve (+ smile, - frown).
var EXPR = {
  idle:      { up: 1.00, low: 0.00, close: 0, smile: 0.00,  tilt: 0.00,  pupil: 1.00, asym: 0.00, blink: 1.0,  mw: 1.00, mo: 0.00, mc: 0.30 },
  listening: { up: 1.26, low: 0.00, close: 0, smile: 0.00,  tilt: -0.05, pupil: 1.12, asym: 0.00, blink: 0.45, mw: 0.62, mo: 0.16, mc: 0.05 },
  thinking:  { up: 0.60, low: 0.26, close: 0, smile: 0.00,  tilt: 0.08,  pupil: 0.92, asym: 0.22, blink: 0.7,  mw: 0.55, mo: 0.00, mc: -0.12 },
  working:   { up: 0.86, low: 0.14, close: 0, smile: 0.00,  tilt: 0.13,  pupil: 0.96, asym: 0.00, blink: 0.6,  mw: 0.80, mo: 0.00, mc: 0.00 },
  speaking:  { up: 1.08, low: 0.05, close: 0, smile: 0.20,  tilt: -0.03, pupil: 1.04, asym: 0.00, blink: 1.0,  mw: 0.90, mo: 0.10, mc: 0.25 },
  waiting:   { up: 1.14, low: 0.00, close: 0, smile: 0.00,  tilt: -0.16, pupil: 1.10, asym: 0.34, blink: 0.9,  mw: 0.50, mo: 0.30, mc: 0.00 },
  done:      { up: 0.62, low: 0.90, close: 0, smile: 1.00,  tilt: 0.00,  pupil: 1.00, asym: 0.00, blink: 0.0,  mw: 1.30, mo: 0.30, mc: 0.90 },

/* ================================================================
   Genome: everything the seed decides
   ================================================================ */
function makeGenome(seed) {
  var r = seeded('orb/' + seed);
  var pool = [];
  for (var i = 0; i < 160; i++) pool.push(r());
  var at = 0;
  function n() { return pool[at++]; }
  function nr(a, b) { return a + (b - a) * n(); }
  function sign() { return n() < 0.5 ? -1 : 1; }
  // Each trait pulls a fixed number of values, so traits stay independent of one another.
  var g = { seed: seed };

  var k = n();
  g.kind = k < 0.40 ? 'liquid' : k < 0.70 ? 'faceted' : 'wispy';
  var s = [n(), n(), n(), n(), n(), n()];
  if (g.kind === 'liquid') {
    g.freq = lerp(0.6, 1.25, s[0]); g.amp = lerp(0.05, 0.11, s[1]);
    g.freq2 = g.freq * lerp(2.0, 3.0, s[2]); g.amp2 = lerp(0.0, 0.012, s[3]);
    g.flowSpd = lerp(0.10, 0.22, s[4]); g.wisp = 0; g.feather = 0; g.facet = 0; g.detail = 0;
  } else if (g.kind === 'faceted') {
    g.freq = lerp(0.7, 1.4, s[0]); g.amp = lerp(0.07, 0.14, s[1]);
    g.freq2 = 3; g.amp2 = 0;
    g.flowSpd = lerp(0.05, 0.12, s[4]); g.wisp = 0; g.feather = 0; g.facet = 1;
    g.detail = s[5] < 0.3 ? 1 : s[5] < 0.75 ? 2 : 3;
  } else {
    g.freq = lerp(1.0, 1.6, s[0]); g.amp = lerp(0.07, 0.12, s[1]);
    g.freq2 = g.freq * lerp(2.0, 2.6, s[2]); g.amp2 = lerp(0.02, 0.04, s[3]);
    g.flowSpd = lerp(0.20, 0.36, s[4]); g.wisp = 1; g.feather = lerp(0.7, 1.0, s[5]); g.facet = 0; g.detail = 0;
  }
  g.yawSpd = nr(0.10, 0.26) * sign();
  g.tilt0 = nr(-0.35, 0.35);

  // inner structure (glass) or skin markings (mascot)
  var pats = ['swirl', 'bands', 'spiral', 'cells'];
  var p1 = Math.floor(n() * 4) % 4, p2 = (p1 + 1 + Math.floor(n() * 3)) % 4;
  var mix2 = n() < 0.55 ? nr(0.15, 0.4) : (n(), 0);
  g.pattern = pats[p1]; g.pattern2 = mix2 > 0 ? pats[p2] : null;
  g.pat = [0, 0, 0, 0]; g.pat[p1] = 1 - mix2; g.pat[p2] += mix2;
  g.patScale = nr(1.2, 2.5);
  g.bands = 2 + Math.floor(n() * 6);
  g.arms = 2 + Math.floor(n() * 4);
  g.twist = nr(0.5, 2.0);
  g.contrast = nr(0.7, 1.0);
  g.axisX = nr(-0.7, 0.7); g.axisZ = nr(-0.7, 0.7);
  g.spinSpd = nr(0.10, 0.26) * sign();

  // core
  g.coreSize = nr(0.30, 0.55);
  g.coreGain = nr(0.75, 1.2);

  // colour drift around the base hue
  g.hueB = nr(14, 40) * sign();
  g.hueC = -Math.sign(g.hueB) * nr(25, 70);
  g.satK = nr(0.92, 1.18);
  g.lightK = nr(-0.04, 0.05);

  // finish
  g.glintPow = nr(16, 60);
  g.glintGain = nr(0.75, 1.2);
  g.rim = nr(0.6, 1.15);

  // company: motes, satellites, rings
  var hasM = n() < 0.7; var mc = 4 + Math.floor(n() * 14);
  g.motes = hasM ? mc : 0;
  g.moteSpd = nr(0.6, 1.3);
  var hasS = n() < 0.40; var sc = n();
  g.sats = hasS ? (sc < 0.55 ? 1 : sc < 0.85 ? 2 : 3) : 0;
  g.satTilt = [nr(-0.5, 0.5), nr(-0.6, 0.6)];
  g.satSpd = nr(0.7, 1.3);
  var hasR = n() < 0.36; var rc = n();
  g.rings = hasR ? (rc < 0.72 ? 1 : 2) : 0;
  g.ring = [
    { r: nr(1.34, 1.52), w: nr(0.035, 0.09), tx: nr(0.18, 0.42) * sign(), tz: nr(-0.5, 0.5), spd: nr(0.25, 0.6) * sign() },
    { r: nr(1.56, 1.70), w: nr(0.02, 0.05), tx: nr(0.2, 0.5) * sign(), tz: nr(-0.7, 0.7), spd: nr(0.2, 0.5) * sign() }
  ];
  g.seedVec = [n(), n(), n(), n()];

  // temperament
  g.tempo = nr(0.86, 1.18);
  g.breathHz = nr(0.85, 1.2);
  g.restless = nr(0.8, 1.35);
  g.bounce = nr(0.32, 0.55);
  g.side = sign();
  g.phase = nr(0, 100);
  g.ph = [nr(0, TAU), nr(0, TAU), nr(0, TAU), nr(0, TAU)];
  g.flowDir = (function () {
    var a = nr(0, TAU), z = nr(-0.6, 0.6), q = Math.sqrt(1 - z * z);
    return g.kind === 'wispy' ? [0.15 * Math.cos(a), -1, 0.15 * Math.sin(a)] : [q * Math.cos(a), z, q * Math.sin(a)];
  })();

  // eyes
  var er = n(), ea = n(), ez = n();
  g.eyeShape = er < 0.36 ? 'round' : er < 0.70 ? 'tall' : 'wide';
  g.eyeAspect = g.eyeShape === 'round' ? lerp(0.95, 1.12, ea) : g.eyeShape === 'tall' ? lerp(1.30, 1.62, ea) : lerp(0.70, 0.86, ea);
  g.eyeSize = g.eyeShape === 'round' ? lerp(0.170, 0.225, ez) : g.eyeShape === 'tall' ? lerp(0.145, 0.190, ez) : lerp(0.190, 0.245, ez);
  g.eyeGap = nr(0.07, 0.20);
  g.eyeY = nr(-0.02, 0.16);
  g.eyeN = nr(2.0, 3.4);
  g.eyeLid = nr(0.70, 1.05);
  if (g.eyeShape === 'wide') g.eyeLid = Math.max(g.eyeLid, 0.84);
  g.eyeTilt = nr(-0.14, 0.14);
  var ps = n(), pz = n();
  g.pupil = ps < 0.40 ? 'full' : ps < 0.75 ? 'dot' : 'iris';
  g.pupilSize = g.pupil === 'dot' ? lerp(0.50, 0.66, pz) : lerp(0.80, 0.93, pz);
  g.eyeHi2 = n() < 0.45;
  g.blinkEvery = nr(2.4, 5.6);
  g.blinkDouble = nr(0.05, 0.30);
  g.blinkSpeed = nr(0.85, 1.25);

  // mascot build
  var sh = n();
  g.shape = sh < 0.26 ? 'round' : sh < 0.46 ? 'drop' : sh < 0.66 ? 'mochi' : sh < 0.84 ? 'bean' : 'egg';
  g.shapeAmt = nr(0.6, 1.0);
  var pb = n();
  g.poly = pb < 0.30 ? 2 : pb < 0.75 ? 3 : 4;
  g.flat = n() < 0.55;
  var dz = n();
  g.dither = dz < 0.40 ? 'bayer' : dz < 0.62 ? 'checker' : dz < 0.78 ? 'lines' : 'none';
  g.tones = n() < 0.5 ? 3 : 4;
  var tp = n();
  g.top = tp < 0.22 ? 'none' : tp < 0.40 ? 'antenna' : tp < 0.54 ? 'floater' : tp < 0.72 ? 'ears' : tp < 0.86 ? 'horn' : 'tuft';
  if (g.shape === 'drop' && (g.top === 'ears' || g.top === 'horn' || g.top === 'tuft')) g.top = tp < 0.8 ? 'none' : 'floater';
  g.topSize = nr(0.75, 1.2);
  g.topLean = nr(-0.3, 0.3);
  g.tail = n() < 0.30;
  g.tailSide = sign();
  g.marks = n() < 0.72;
  g.markLight = n() < 0.5;
  g.mouthW = nr(0.8, 1.25);

  // the egg it hatches from
  g.eggTeeth = 5 + Math.floor(n() * 3);
  g.eggCrackY = nr(0.0, 0.2);
  g.eggDyed = n() < 0.3;
  return g;
}

function describeGenome(g, retro) {
  var marks = g.pattern === 'bands' ? 'stripes ×' + g.bands : g.pattern === 'spiral' ? 'whorl, ' + g.arms + ' arms' : g.pattern === 'cells' ? 'spots' : 'patches';
  var inside = g.pattern === 'bands' ? 'bands ×' + g.bands : g.pattern === 'spiral' ? 'spiral, ' + g.arms + ' arms' : g.pattern;
  if (g.pattern2) inside += ' + ' + g.pattern2;
  var surface = g.kind === 'faceted' ? 'faceted, ' + [0, 80, 180, 320][g.detail] + ' faces' : g.kind;
  var temper = g.tempo > 1.08 ? 'quick' : g.tempo < 0.94 ? 'slow' : 'even';
  temper += g.bounce < 0.4 ? ', bouncy' : g.bounce > 0.48 ? ', composed' : '';
  var rows = [
    ['eyes', g.eyeShape + (g.eyeGap < 0.11 ? ', close-set' : g.eyeGap > 0.16 ? ', wide-set' : '')],
    ['pupils', g.pupil === 'full' ? 'big' : g.pupil === 'dot' ? 'small' : 'ringed'],
    ['lids', g.eyeLid < 0.76 ? 'heavy' : g.eyeLid > 0.95 ? 'wide open' : 'relaxed'],
    ['blink', 'about every ' + g.blinkEvery.toFixed(1) + ' s']
  ];
  if (retro) {
    rows.push(['body', g.shape + ', ' + [0, 80, 180, 320, 500][g.poly] + ' faces']);
    rows.push(['shading', (g.flat ? 'flat' : 'gouraud') + ', ' + g.tones + ' tones' + (g.dither === 'none' ? '' : ', ' + g.dither + ' dither')]);
    rows.push(['on top', g.top === 'none' ? (g.shape === 'drop' ? 'tip' : 'nothing') : g.top]);
    rows.push(['tail', g.tail ? 'yes' : 'no']);
    rows.push(['markings', g.marks ? marks : 'none']);
  } else {
    rows.push(['surface', surface]);
    rows.push(['inside', inside]);
    rows.push(['core', g.coreSize > 0.46 ? 'wide' : g.coreSize < 0.37 ? 'tight' : 'medium']);
  }
  if (retro) rows.push(['egg', (g.eggDyed ? 'tinted' : 'pale') + ' shell, ' + (g.marks ? marks : 'speckles')]);
  rows.push(['hue drift', (g.hueB > 0 ? '+' : '−') + Math.abs(Math.round(g.hueB)) + '°']);
  rows.push(['rings', String(g.rings)]);
  rows.push(['satellites', String(g.sats)]);
  rows.push(['motes', String(g.motes)]);
  rows.push(['temper', temper]);
  return rows;
}

// Simplex noise at v: its slope in xyz and its value in w.

  'vec4 snoise(vec3 v){',
  '  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);',
  '  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);',
  '  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);',
  '  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;',
  '  i=mod289(i);',
  '  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));',
  '  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;',
  '  vec4 j=p-49.0*floor(p*ns.z*ns.z);',
  '  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);',
  '  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);',
  '  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);',
  '  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));',
  '  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
  '  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);',

  '  return 42.0*vec4(-8.0*(t.x*x0+t.y*x1+t.z*x2+t.w*x3) + m4.x*p0+m4.y*p1+m4.z*p2+m4.w*p3, dot(m4,px));',

// Ordered dither thresholds in 0..1: 4x4 Bayer, a two-level checker, or scanlines.
var DITHER = [
  'uniform float uDk;',
  'float B2(vec2 a){ a = floor(a); return fract(a.x/2.0 + a.y*a.y*0.75); }',
  'float bayer4(vec2 p){ return B2(0.5*p)*0.25 + B2(p) + 0.03; }',

  '  if (uDk < 0.5) return B2(0.5*p)*0.25 + B2(p) + 0.03;',

  '  vec3 pos; vec3 n;',

  'uniform vec3 uGaze; uniform vec2 uGlint; uniform float uRim; uniform float uFacet; uniform float uFeather; uniform float uDetail; uniform float uWisp;',
  'uniform vec4 uGrade; uniform vec4 uAcc; uniform vec4 uAccP; uniform vec3 uRings[4];',
  'uniform float uRetro; uniform vec2 uTone; uniform float uLamp; uniform float uFade;',
  'uniform vec4 uEye; uniform vec4 uEyeS; uniform vec4 uLidL; uniform vec4 uLidR; uniform vec4 uPup; uniform vec4 uEyeK;',
  'uniform vec3 uEyeW; uniform vec3 uEyeD; uniform vec3 uEyeI; uniform vec3 uEyeLn;',
  'uniform vec4 uMouth; uniform vec3 uMouthK;',
  'varying vec3 vN; varying vec3 vV; varying vec3 vObj; varying vec3 vN0; varying float vPart;',
  DITHER,
  PATTERN,
  'void main(){',
  '  vec3 N = normalize(vN);',
  '  if (uFacet > 0.001) {',
  '    vec3 fn = normalize(cross(dFdx(vV), dFdy(vV)));',
  '    N = normalize(mix(N, fn, uFacet));',
  '  }',
  '  vec3 rd = normalize(vV);',
  '  float ndv = clamp(dot(N, -rd), 0.0, 1.0);',
  '  vec3 c = (vV - uCenterV) / uS;',
  '  vec3 L = normalize(vec3(-0.45, 0.65, 0.62));',
  '  vec3 fo = normalize(vObj);',
  '  float fwo = fwidth(fo.y);',
  '  float isBody = step(vPart, 0.5);',
  '  float face = smoothstep(0.4, 0.85, fo.z) * isBody;',
  '  float bay = dth(gl_FragCoord.xy);',
  '  if (uFade < 0.999 && bayer4(gl_FragCoord.xy) > uFade) discard;',
  // light shared by both looks: the reading band, rings passing through, the core
  '  float sy = clamp(c.y, -0.999, 0.999);',
  '  float lon = clamp(c.x / sqrt(1.0 - sy*sy), -1.0, 1.0);',
  '  float bx = (lon - uAccP.y) / mix(0.34, 0.2, uDetail);',
  '  float band = exp(-bx*bx) * uAcc.y;',
  '  float rl = length(c.xy);',
  '  float ring = 0.0;',
  '  for (int i = 0; i < 4; i++) { vec3 R = uRings[i]; float x = (rl - R.x)/R.z; ring += R.y*exp(-x*x); }',
  '  ring *= smoothstep(1.05, 0.9, rl);',
  '  vec3 kv = uCorePos - c; vec3 perp = kv - dot(kv, rd)*rd; float d2 = dot(perp, perp);',
  '  float cs = uCore.y*uCore.y;',
  '  float coreG = exp(-d2/cs);',
  '  vec3 col;',
  '  if (uRetro > 0.5) {',
  // mascot: a few flat tones picked by the light, dithered where they meet
  '    float nl = dot(N, L) + (coreG*uCore.x*0.30 + band*0.6 + ring*0.5)*isBody + uGrade.z*2.2;',
  '    float x = nl + (bay - 0.5)*uTone.y;',
  '    float ti = uTone.x > 3.5 ? step(-0.25, x) + step(0.22, x) + step(0.84, x) : step(-0.05, x)*2.0 + step(0.84, x);',
  '    col = ti < 0.5 ? uDeep : ti < 1.5 ? uShade : ti < 2.5 ? uBase : uLight;',
  '    if (vPart < 0.5) {',
  '      if (uPatP.w > 0.001) col = mix(col, uColB*(0.70 + 0.16*ti), step(uPatQ.y, pattern(fo)) * (1.0 - face));',
  '      if (1.0 - ndv > 0.80 - 0.12*uRim && N.y - N.x*0.5 > 0.15) col = mix(col, uRimCol, 0.45);',
  '    } else if (vPart < 1.5) {',
  '      col = uDeep;',
  '    } else {',
  '      col = (ti < 1.5 ? uColC*0.72 : ti < 2.5 ? uColC : mix(uColC, vec3(1.0), 0.5)) + uHot*uLamp;',
  '    }',
  '    if (uGlint.x > 0.3 && dot(N, uGaze) > uGlint.y) col = uSpec;',
  '  } else {',
  // glass: interior pattern seen through the surface with a little parallax
  '    float dif = smoothstep(-0.4, 1.0, dot(N, L));',
  '    dif = mix(dif, 0.5 + 0.3*dif, uWisp);',
  '    vec3 rr = refract(rd, N, 0.72);',
  '    float v = pattern(uInner * (c + rr*0.30));',
  '    if (uDetail > 0.3) v = mix(v, pattern(uInner * (c + rr*0.85) * 1.25 + 2.7), 0.38);',
  '    float pc = uPatP.w * mix(0.5, 1.0, uDetail) * (1.0 - 0.35*face);',
  '    float shade = clamp(dif + (v - 0.5)*0.30*pc, 0.0, 1.0);',
  '    col = mix(uDeep, uBase, smoothstep(0.04, 0.7, shade));',
  '    col = mix(col, uLight, smoothstep(0.72, 1.0, shade)*0.85);',
  '    col = mix(col, uColB*(0.45 + 0.7*dif), smoothstep(0.35, 0.9, v)*pc*0.6);',
  '    col = mix(col, uColC, smoothstep(0.72, 0.98, v)*pc*0.4);',
  '    col = mix(col, uDeep, smoothstep(0.35, 0.0, v)*pc*0.35);',
  '    col *= mix(0.74, 1.0, smoothstep(0.0, 0.62, ndv));',
  '    col += uLight * (band*0.55 + ring*0.42);',
  '    col += uHot * coreG * uCore.x * 0.5;',
  '    col += vec3(1.0) * exp(-d2/(cs*0.12)) * uCore.x * 0.22;',
  '  }',
  // the face: two eyes (and, on the mascot, a small mouth) painted on the skin in object space
  '  float eyeM = 0.0;',
  '  if (vPart < 0.5 && fo.z > 0.1) {',
  '    float hard = uRetro;',
  '    float fwq = fwo / uEye.w;',
  '    float es = fo.x < 0.0 ? -1.0 : 1.0;',
  '    vec2 q = vec2((fo.x - es*uEye.x)/uEye.z, (fo.y - uEye.y)/uEye.w);',
  '    float en = uEyeS.x;',
  '    float er = pow(pow(abs(q.x), en) + pow(abs(q.y), en), 1.0/en);',
  '    float aa = mix(clamp(fwq*0.8, 0.012, 0.5), 0.0001, hard);',
  '    if (er < 1.7) {',
  '      vec4 lid = es < 0.0 ? uLidL : uLidR;',
  '      float x2 = q.x*q.x;',
  '      float yu = lid.x + lid.z*x2 + lid.w*q.x*es;',
  '      float yl = lid.y + lid.z*x2*0.7 - lid.w*q.x*es*0.3;',
  '      float ym = 0.5*(yu + yl);',
  '      yu = max(yu, ym); yl = min(yl, ym);',
  '      float d = max(er - 1.0, max(q.y - yu, yl - q.y));',
  '      float open = smoothstep(aa, -aa, d);',
  '      float dif0 = smoothstep(-0.4, 1.0, dot(normalize(vN0), L));',
  '      float lsh = smoothstep(0.5, 0.0, yu - q.y);',
  '      vec3 ec = uEyeW * mix((0.80 + 0.24*dif0)*(1.0 - 0.30*lsh), 1.0 - 0.15*step(0.42, lsh), hard);',
  '      vec2 pq = (q - uPup.xy) * vec2(1.0, uPup.z);',
  '      float pr = length(pq) / uEyeS.y;',
  '      float pa = aa / uEyeS.y;',
  '      if (uEyeS.z > 0.001) ec = mix(ec, uEyeI * mix(0.75 + 0.35*dif0, 1.0, hard), smoothstep(1.0 + pa, 1.0 - pa, pr));',
  '      float pin = uEyeS.z > 0.001 ? uEyeS.z : 1.0;',
  '      ec = mix(ec, uEyeD, smoothstep(pin + pa, pin - pa, pr));',
  // highlight; while a command runs it squares off into a blinking cursor
  '      float sq = max(uPup.w, hard*0.7);',
  '      float hmin = hard*0.8*fwq/uEyeS.y;',
  '      vec2 hq = (pq/uEyeS.y - vec2(-0.30, 0.36)) / max(vec2(mix(0.27, 0.17, uPup.w), mix(0.27, 0.33, uPup.w)), vec2(hmin));',
  '      float hn = mix(2.0, 7.0, sq);',
  '      float hr = pow(pow(abs(hq.x), hn) + pow(abs(hq.y), hn), 1.0/hn);',
  '      float hl = smoothstep(1.0 + pa*2.5, 1.0 - pa*2.5, hr) * mix(1.0, uEyeK.w, uPup.w);',
  '      hl += smoothstep(0.15 + pa, 0.15 - pa, length(pq/uEyeS.y - vec2(0.30, -0.32))) * uEyeK.z * 0.7;',
  '      ec = mix(ec, vec3(1.0), clamp(hl, 0.0, 1.0) * uEyeS.w);',
  '      col = mix(col, ec, open);',
  // the lid line is always there, so a closed eye is still a clear mark
  '      float shut = 1.0 - smoothstep(0.0, 0.5, yu - yl);',
  '      float th = max(uEyeK.x * (1.0 + 0.6*smoothstep(-0.3, 0.3, q.y - ym)) * (1.0 + 0.5*shut), hard*mix(0.55, 0.95, shut)*fwq);',
  '      float line = smoothstep(th + aa, max(th - aa, 0.0), abs(d)) * max(uEyeK.y, shut) * mix(1.0, step(abs(q.x), 0.86), shut*hard);',
  '      col = mix(col, uEyeLn, line);',
  '      eyeM = max(open, line);',
  '    }',
  '    if (uMouthK.x > 0.001) {',
  '      vec2 mq = vec2((fo.x - uMouthK.y)/uMouth.y, (fo.y - uMouth.x)/uMouth.y);',
  '      float mx2 = min(mq.x*mq.x, 1.0);',
  '      float mh = max(uMouthK.z + uMouth.z*(1.0 - mx2), hard*0.55*fwo/uMouth.y);',
  '      float md = max(abs(mq.x) - 1.0, abs(mq.y + uMouth.w*(1.0 - mx2)*0.55) - mh);',
  '      float ma = mix(clamp(fwo/uMouth.y*0.8, 0.02, 0.6), 0.0001, hard);',
  '      float mm = smoothstep(ma, -ma, md) * uMouthK.x;',
  '      col = mix(col, uEyeLn, mm);',
  '      eyeM = max(eyeM, mm);',
  '    }',
  '  }',
  '  float alpha = 1.0;',
  '  if (uRetro < 0.5) {',
  '    float fres = pow(1.0 - ndv, 2.6);',
  '    col += uRimCol * fres * uRim * (1.0 - 0.6*uWisp);',
  '    float gd = max(dot(N, uGaze), 0.0);',
  '    float keep = 1.0 - 0.75*eyeM;',
  '    col += (uLight*0.5 + 0.5) * pow(gd, uGlint.y)*0.32 * uGlint.x * (1.0 - 0.5*uWisp) * keep;',
  '    col += vec3(1.0) * pow(gd, uGlint.y*6.0)*0.55 * uGlint.x * (1.0 - 0.6*uWisp) * keep;',
  '    alpha = mix(1.0, smoothstep(0.0, 0.7, ndv), uFeather);',
  '  }',
  '  float lum = dot(col, vec3(0.299, 0.587, 0.114));',
  '  vec3 grey = lum * (uGrade.w > 0.0 ? mix(vec3(1.0), vec3(1.12, 0.96, 0.87), uGrade.w) : mix(vec3(1.0), vec3(0.95, 1.0, 1.07), -uGrade.w));',
  '  col = mix(grey, col, uGrade.x) * uGrade.y;',
  '  if (uRetro > 0.5) {',
  // 15-bit colour, like the hardware
  '    col = floor(clamp(col, 0.0, 1.0)*31.0 + bay)/31.0;',
  '  } else {',
  '    col += uHot*uGrade.z;',
  '    col = col / (1.0 + max(col - 0.82, 0.0)*0.9);',
  '  }',
  '  gl_FragColor = vec4(col*alpha, alpha);',
  '}'
].join('\n');

// The egg: the same low-poly mesh pulled into an egg shape. When it breaks, every triangle becomes a shard
// that flies off around its own centre, the cap first and the cup a beat later.
var CRACK = [
  'uniform vec4 uCrk;',
  'float crackY(vec3 d){ float a = atan(d.x, d.z); return uCrk.x + uCrk.y*(abs(fract(a*uCrk.z/6.2831853 + 0.25) - 0.5)*2.0 - 0.5); }'
].join('\n');
var EGG_VERT = [
  'attribute float aPart; attribute vec3 aTri;',
  'uniform vec3 uEggS; uniform float uBurst; uniform float uSnap;',
  'varying vec3 vN; varying vec3 vV; varying vec3 vObj;',
  CRACK,
  'vec3 eggShape(vec3 p){ vec3 q = p; q.xz *= uEggS.x*(1.0 - uEggS.z*q.y); q.y *= uEggS.y; return q; }',
  'void main(){',
  '  vec3 p = normalize(position);',
  '  vec3 q = eggShape(p);',
  '  vec3 n = normalize(vec3(p.x/uEggS.x, p.y/uEggS.y + uEggS.z*0.6, p.z/uEggS.x));',
  '  if (uBurst > 0.0) {',
  '    vec3 c = normalize(aTri);',
  '    vec3 qc = eggShape(c);',
  '    float top = step(crackY(c), c.y);',
  '    float h = fract(sin(dot(c, vec3(12.9898, 78.233, 37.719)))*43758.5453);',
  '    float go = max(uBurst*(0.75 + 0.5*h) - (1.0 - top)*0.22, 0.0);',
  '    vec3 dir = normalize(c + vec3(0.0, mix(-0.1, 0.9, top), 0.0));',
  '    vec3 off = dir*(1.5*go)*mix(0.55, 1.0, top) + vec3(0.0, -2.0*go*go, 0.0);',
  '    vec3 k = normalize(vec3(c.z, 0.35, -c.x));',
  '    float ang = go*(5.0 + 9.0*h);',
  '    vec3 v = q - qc;',
  '    v = v*cos(ang) + cross(k, v)*sin(ang) + k*dot(k, v)*(1.0 - cos(ang));',
  '    q = qc + v*(1.0 - smoothstep(0.5, 1.0, go)) + off;',
  '  }',
  '  if (aPart > 0.5) q = vec3(0.0);',
  '  vObj = p;',
  '  vN = normalize(normalMatrix * n);',
  '  vec4 mv = modelViewMatrix * vec4(q, 1.0);',
  '  vV = mv.xyz;',
  '  vec4 clip = projectionMatrix * mv;',
  '  if (uSnap > 0.5) clip.xy = floor(clip.xy/clip.w*uSnap + 0.5)/uSnap*clip.w;',
  '  gl_Position = clip;',
  '}'
].join('\n');
var EGG_FRAG = [
  'uniform vec3 uShA; uniform vec3 uShB; uniform vec3 uShC; uniform vec3 uShM; uniform vec3 uCrkCol;',
  'uniform float uBurst; uniform vec2 uTone; uniform float uFacet; uniform vec4 uGrade; uniform float uFade; uniform vec2 uEggM;',
  'varying vec3 vN; varying vec3 vV; varying vec3 vObj;',
  DITHER,
  PATTERN,
  CRACK,
  'void main(){',
  '  vec3 N = normalize(vN);',
  '  vec3 fn = normalize(cross(dFdx(vV), dFdy(vV)));',
  '  N = uBurst > 0.0 ? fn : normalize(mix(N, fn, uFacet));',
  '  vec3 L = normalize(vec3(-0.45, 0.65, 0.62));',
  '  vec3 fo = normalize(vObj);',
  '  float fw = fwidth(fo.y);',
  '  float bay = dth(gl_FragCoord.xy);',
  '  if (uFade < 0.999 && bayer4(gl_FragCoord.xy) > uFade) discard;',
  '  float x = dot(N, L) + uGrade.z*2.0 + (bay - 0.5)*uTone.y;',
  '  float ti = step(-0.1, x) + step(0.8, x);',
  '  vec3 col = ti < 0.5 ? uShA : ti < 1.5 ? uShB : uShC;',
  '  col = mix(col, uShM*(0.8 + 0.12*ti), uEggM.x * step(uEggM.y, pattern(fo)));',
  // the crack: a zigzag round the shell that opens from the front
  '  float a = atan(fo.x, fo.z);',
  '  if (uBurst <= 0.0 && abs(fo.y - crackY(fo)) < max(0.035, 0.8*fw) && abs(a) < uCrk.w*3.2) col = uCrkCol;',
  '  col = floor(clamp(col*uGrade.y, 0.0, 1.0)*31.0 + bay)/31.0;',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

var HALO_VERT = 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
var HALO_FRAG = [
  'uniform vec2 uC; uniform vec2 uSc; uniform float uRoll;',
  'uniform vec3 uHaloCol; uniform vec3 uRingCol; uniform float uHalo; uniform float uDark; uniform float uRetro;',
  'uniform vec3 uRings[4]; uniform vec3 uLobe; uniform vec3 uGround; uniform float uRs;',
  'varying vec2 vP;',
  DITHER,
  'void main(){',
  '  vec2 d = vP - uC; float cr = cos(uRoll); float sr = sin(uRoll);',
  '  d = vec2(cr*d.x + sr*d.y, -sr*d.x + cr*d.y) / uSc;',
  '  float r = length(d);',
  '  float o = max(r - 0.7, 0.0);',
  '  float g = exp(-o*o*7.0)*0.82 + exp(-o*2.6)*0.18;',
  '  g *= 1.0 + uLobe.z * dot(d/(r + 0.0001), uLobe.xy);',
  '  float a = g * uHalo;',
  '  vec2 gp = (vP - vec2(uC.x, uGround.z)) / vec2(uSc.x*0.62*uGround.y, mix(0.04, 0.055, uRetro));',
  '  vec3 poolCol = mix(vec3(0.03, 0.06, 0.06), uHaloCol*0.55, uDark);',
  '  if (uRetro > 0.5) {',
  // mascot: no soft glow, just crisp pixel rings that break into dither as they fade, and a flat blob shadow
  '    float bay = dth(gl_FragCoord.xy);',
  '    float rc = length(vP - uC) / uRs;',
  '    float rg = 0.0;',
  '    for (int i = 0; i < 4; i++) { vec3 R = uRings[i]; rg = max(rg, step(abs(rc - R.x), R.z*0.42) * step(bay*0.9, R.y*1.8)); }',
  '    rg *= step(0.98, r) * step(length(vP), 0.97);',
  '    float al = rg;',
  '    vec3 col = uRingCol;',
  '    float pool = step(pow(abs(gp.x), 3.0) + pow(abs(gp.y), 3.0), 1.0) * min(uGround.x*1.1, 0.3);',
  '    gl_FragColor = vec4(col*al + poolCol*pool*(1.0 - al), al + pool*(1.0 - al));',
  '  } else {',
  '    float ring = 0.0;',
  '    float rc = length(vP - uC) / uRs;',
  '    for (int i = 0; i < 4; i++) { vec3 R = uRings[i]; float x = (rc - R.x)/R.z; ring += R.y*exp(-x*x); }',
  '    ring *= smoothstep(0.9, 1.08, r);',
  '    float win = smoothstep(1.0, 0.5, length(vP));',
  '    vec3 col = (uHaloCol*a + uRingCol*ring) * win;',
  '    float al = (a + ring) * win;',
  '    float pool = exp(-dot(gp, gp)) * uGround.x;',
  '    col += poolCol * pool; al += pool;',
  '    gl_FragColor = vec4(col, al * mix(1.0, 0.3, uDark));',
  '  }',
  '}'
].join('\n');

var POINTS_VERT = [
  'attribute vec4 aRnd; attribute float aIdx;',
  'uniform vec4 uSeed; uniform vec2 uCount; uniform vec2 uT; uniform float uPx; uniform vec3 uCenterW; uniform float uS;',
  'uniform float uInward; uniform float uPush; uniform vec2 uAl; uniform vec2 uSatTilt; uniform float uRetro;',
  'varying float vA; varying float vKind;',
  'mat2 rot(float a){ float c = cos(a); float s = sin(a); return mat2(c, s, -s, c); }',
  'void main(){',
  '  vec4 h = fract(aRnd + uSeed);',
  '  float isSat = step(aIdx, uCount.x - 0.5);',
  '  float on = step(aIdx, uCount.x + uCount.y - 0.5);',
  '  float rad = mix(1.10 + 0.52*h.x*h.x, 1.36 + 0.30*h.x, isSat);',
  '  float spd = mix(0.3 + 0.8*h.y, 0.45 + 0.3*h.y, isSat) * mix(h.z > 0.5 ? 1.0 : -1.0, 1.0, isSat);',
  '  float t = mix(uT.x, uT.y, isSat);',
  '  float ph = h.w*6.2831853 + t*spd;',
  '  float fall = fract(h.w*3.7 + uT.x*0.2);',
  '  float m = uInward*(1.0 - isSat);',
  '  rad = mix(rad, mix(1.95, 0.98, fall*fall), m) + uPush*(1.0 - isSat)*0.14*(0.4 + h.y);',
  '  vec3 o = vec3(cos(ph), 0.0, sin(ph)) * rad;',
  '  float a1 = mix((h.x - 0.5)*2.6, uSatTilt.x + (h.y - 0.5)*0.5, isSat);',
  '  float a2 = mix((h.y - 0.5)*2.2, uSatTilt.y + (h.x - 0.5)*0.4, isSat);',
  '  o.yz = rot(a1)*o.yz; o.xy = rot(a2)*o.xy;',
  '  vec4 mv = viewMatrix * vec4(uCenterW + o*uS, 1.0);',
  '  gl_Position = on > 0.5 ? projectionMatrix * mv : vec4(3.0, 3.0, 3.0, 1.0);',
  '  float size = mix(0.06 + 0.07*h.z, 0.10 + 0.07*h.z, isSat) * uS * uPx * (3.7320508 / -mv.z);',
  '  gl_PointSize = uRetro > 0.5 ? max(1.0, floor(size*mix(0.6, 1.0, isSat) + 0.5)) : max(1.5, size);',
  '  float tw = 0.6 + 0.4*sin(t*1.7*(0.5 + h.x) + h.y*40.0);',
  '  float fadeIn = mix(1.0, smoothstep(0.0, 0.18, fall)*smoothstep(1.0, 0.8, fall), m);',
  '  float occ = mix(1.0, smoothstep(0.94, 1.12, length(o.xy)), step(o.z, 0.0));',
  '  vA = on * occ * mix(uAl.x*tw*fadeIn, uAl.y, isSat);',
  '  vKind = isSat;',
  '}'
].join('\n');
var POINTS_FRAG = [
  'uniform vec3 uMoteCol; uniform vec3 uSatCol; uniform vec3 uSatHi; uniform float uDark; uniform float uRetro;',
  'varying float vA; varying float vKind;',
  'void main(){',
  '  vec2 c = gl_PointCoord*2.0 - 1.0; float d = length(c);',
  '  vec3 n = vec3(c.x, -c.y, sqrt(max(0.0, 1.0 - d*d)));',
  '  float dif = dot(n, normalize(vec3(-0.45, 0.65, 0.62)))*0.5 + 0.5;',

   every corner on a whole pixel, and what is see-through as a pattern of holes: the look of the
   consoles the creature comes from.

   lays over this one where `egg()` says it stands.

   sky.resize(width, height)              the size it is shown at, in CSS pixels

   sky.fall()                             the egg starts at the top of the sky and comes down; sky.onLand = fn

function topper(m) {
  m.bare();
  var g = m.group(), p = m.surf(0, 1, 0);
  g.position.set(p.x, p.y + 0.015, p.z);
  return g;
}
// A flat piece of a ring, lying level: from `r0` out to `r1`, `arc` wide, centred on the front.
function brim(r0, r1, arc, seg) { var g = new THREE.RingGeometry(r0, r1, seg || 6, 1, HALF - arc / 2, arc); g.rotateX(HALF); return g; }
// A cone that stands on its base, to be grown and swayed from there: a flame, a tentacle.
function spike(r, h, seg) { var g = cone(r, h, seg || 5); g.translate(0, h / 2, 0); return g; }

/* A mask: a sheet on the skin round each eye, from the eye's edge to `grow` beyond it, which is a
   number or a function of how far outward and how far up the place is. The two meet in the middle. */
function mask(m, color, grow, o) {
  var e = m.eye, n = 14;
  [-1, 1].forEach(function (s) {
    var pos = [], idx = [], i;
    for (i = 0; i <= n; i++) {
      var c = Math.cos(i * TAU / n), up = Math.sin(i * TAU / n), k = typeof grow === "function" ? grow(c, up) : grow;
      var p = m.face(s * (e.x + c * (e.a + 0.025)), e.y + up * (e.b + 0.025), 0.05), q = m.face(s * Math.max(0, e.x + c * (e.a + k)), e.y + up * (e.b + k * 0.8), 0.05);
      pos.push(p.x, p.y, p.z, q.x, q.y, q.z);
    }
    for (i = 0; i < n; i++) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 2, i * 2 + 1, i * 2 + 3);
    var geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx);
    m.mesh(geo, color, o);
  });
}

/* ================= what one creature has on ================= */
/* Kept on the creature as `orb.worn`, which the core calls: after each update, so that what moves
   moves; after its size or seed changes, since everything was fitted to the body it had; and when
   the creature goes. */
function Worn(orb) {
  this.orb = orb; this.maker = null; this.sig = ""; this.outfit = null; this.gift = null;
  this.keep();
}
// What grows on its head, and the room it leaves itself, as the creature made them: kept so that a hat's changes can be undone.
Worn.prototype.keep = function () {
  var o = this.orb, u = o.uB, b = u.uBump.value;
  this.base = { fill: o.fill, rest: o.rest, top: u.uTop.value.w, bumps: [b[0].clone(), b[1].clone()] };
};
Worn.prototype.restore = function () {
  var u = this.orb.uB, b = this.base;
  u.uTop.value.w = b.top; u.uBump.value[0].copy(b.bumps[0]); u.uBump.value[1].copy(b.bumps[1]);
};
// The creature already leaves room above its head for ears and antennae; a hat asks for more, and
// something wide asks for room at the sides.
Worn.prototype.room = function () {
  var o = this.orb, b = this.base, m = this.maker;
  if (!m) { o.fill = b.fill; o.rest = b.rest; return; }
  var top = Math.max(-b.rest / (0.34 * b.fill), m ? m.top - 1 : 0);
  o.fill = Math.min(b.fill, 0.95 / (1 + top * 0.8), m && m.wide ? 0.94 / m.wide : 9);
  o.rest = -top * 0.34 * o.fill;
};
Worn.prototype.off = function () {
  var m = this.maker;
  if (m) { this.orb.body.remove(m.root); m.free(); }
  this.maker = null; this.sig = ""; this.outfit = null;
  this.restore(); this.room();
};
Worn.prototype.put = function (outfit) {
  outfit = outfit || {};
  var sig = SLOTS.map(function (s) { return ITEMS[outfit[s]] === s ? outfit[s] : ""; }).join("/");
  if (this.sig === sig && this.maker) return;
  this.off();
  if (sig === "///") return;
  var m = new Maker(this.orb);
  SLOTS.forEach(function (s) { if (ITEMS[outfit[s]] === s) MAKE[outfit[s]](m); });
  m.settle();
  this.orb.body.add(m.root);
  this.maker = m; this.sig = sig; this.outfit = outfit;
  this.room();
};
Worn.prototype.tick = function (dt, t) {
  var m = this.maker;
  if (m) for (var i = 0; i < m.ticks.length; i++) m.ticks[i](dt, t);
  if (this.gift) this.gift.tick(dt, t);
};
Worn.prototype.fit = function () {
  var was = this.outfit;
  this.keep();
  if (this.maker) { this.orb.body.remove(this.maker.root); this.maker.free(); this.maker = null; }
  if (was) this.put(was); else this.room();
};
Worn.prototype.dispose = function () {
  if (this.gift) this.gift.dispose();
  this.off();
};
function wornOf(orb) { return orb.worn || (orb.worn = new Worn(orb)); }

// Put these on a creature, in place of whatever it wore: `{ hat, glasses, face, neck }`, each the id of a thing or nothing.
function dress(orb, outfit) {
  // a creature that wears nothing and never has is left as it is
  if (!orb.worn && !SLOTS.some(function (s) { return outfit && ITEMS[outfit[s]] === s; })) return;
  wornOf(orb).put(outfit);
}
// Take everything off.
function strip(orb) { if (orb.worn) orb.worn.off(); }
/* How far the deepest corner of anything it wears is inside its body, in body radii; nothing is
   when this is zero or less. It is measured against the body at rest. */
function audit(orb) { var m = orb.worn && orb.worn.maker; return m ? m.sunk(m.root) : -9; }

/* ================= a box, and the opening of it =================
   Shown on a creature's own stage in place of the creature, so that it is drawn by the same
   renderer at the same low resolution. Shut, it rocks now and then, as the egg does. Opened, it
   plays one short timeline, as the hatch does: it rattles, and jolts once for each rarity up to
   the one inside, the light at its seam stepping up through their colors; it gathers itself; and
   it bursts: the lid is blown off, the walls fall open, confetti and rings fly, and what was
   inside rises into a beam of light and hangs there. The rarer the thing, the longer the wait. */
var GROUND = -0.6, FLOAT = 0.3, JOLT_EVERY = 0.42, FIRST_JOLT = 0.3, GATHER = 0.6, SHOWN_AFTER = 0.9;
function Gift(orb, o) {
  o = o || {};
  var self = this, m = this.m = new Maker(orb), W = 0.3, H = 0.4, T = 0.03;
  this.orb = orb; this.phase = "shut";
  this.onPop = o.onPop || null; this.onShown = o.onShown || null;
  this.T = 0; this.clock = 0; this.popAt = 0; this.tiers = []; this.jolt = 0;
  this.wait = 1.2; this.rockT = 9; this.rockA = 0;
  this.hop = { y: 0, v: 0 }; this.lidAt = { x: 0, y: 0, vx: 0, vy: 0, r: 0, vr: 0, off: false };
  this.rise = { x: 0, v: 0 }; this.item = null;
  // on the stage itself, since the creature is not drawn while a box is
  var stage = this.stage = new THREE.Group();
  orb.scene.add(stage);
  put(m.mesh(disc(0.5, 10), "#06090b", { in: stage, plain: true, door: true }), 0, GROUND - 0.03, -0.2).scale.y = 0.22;
  // seen a little from above, and from a corner, so that it is plainly a box
  var root = this.root = m.group(stage);
  root.rotation.set(0.3, 0.62, 0);
  put(m.mesh(box(2 * W, T, 2 * W), "#1f8a80", { in: root }), 0, T / 2, 0);
  this.glow = put(m.mesh(box(2 * W - 0.03, 0.02, 2 * W - 0.03), "#ffffff", { in: root, plain: true }), 0, T + 0.012, 0);
  this.glow.visible = false;
  this.walls = [[0, W, 0], [W, 0, HALF], [0, -W, Math.PI], [-W, 0, -HALF]].map(function (p) {
    // each wall turns about its bottom edge, and falls outward
    var hinge = m.group(root), leaf = m.group(hinge);
    hinge.position.set(p[0], 0, p[1]); hinge.rotation.y = p[2];
    put(m.mesh(box(2 * W, H, T), TEAL, { in: leaf }), 0, H / 2, 0);
    put(m.mesh(box(0.13, H, T + 0.014), YEL, { in: leaf }), 0, H / 2, 0);
    return { leaf: leaf, a: 0, v: 0 };
  });
  var lid = this.lid = m.group(root);
  lid.position.y = H;

    function present() {
      phase = "gift"
      var three = [of("common"), of("uncommon"), of(Math.random() < 0.7 ? "rare" : "epic")]
      var gift = wardrobe.unwrap(orb, {
        onPop: function () { sky.flash(0.4); sky.bump(0.6) },
        onShown: function () { setTimeout(function () { if (!gone) choose() }, 700) },
      })
      openIt = function () {
        openIt = null
        show()
        gift.shake()
        setTimeout(function () { if (!gone) gift.open({ id: three[2].id, tiers: tiersTo(three[2]) }) }, 800)
      }
      show(
        h("p", { class: "line", text: mine.name + " came with a present." }),
        h("p", { class: "sub", text: "Three things are inside. One is " + mine.name + "'s to keep." }),
        h("div", { class: "row" }, btn("dark grow", "Open it", function () { openIt && openIt() })),
      )
      function choose() {
        gift.dispose()
        phase = "out"
        var picked = null
        var keep = btn("dark grow", "Pick one", function () {
          mine.outfit = wearing(picked, {})
          small.splice(0).forEach(function (one) { one.dispose() })
          ready()
        })
        keep.disabled = true
        var tiles = h("div", { class: "tiles" })
        three.forEach(function (thing) {
          var canvas = h("canvas")
          var tile = h("button", { class: "tile", "aria-pressed": "false" }, canvas,
            h("b", { text: thing.name }), h("i", { text: thing.rarity, style: "color:" + RARITY[thing.rarity] }))
          tile.onclick = function () {
            picked = thing
            Array.prototype.forEach.call(tiles.children, function (t) { t.setAttribute("aria-pressed", String(t === tile)) })
            wardrobe.dress(orb, wearing(thing, {}))
            orb.cheer()
            sky.glow(0.6)
            keep.disabled = false
            keep.textContent = "Keep the " + thing.name.toLowerCase()
          }
          tiles.append(tile)
          var one = core.createOrb(canvas, { seed: look.seed, color: hexOf(look.color), size: 72, dark: false, notice: false, slow: true })
          wardrobe.dress(one, wearing(thing, {}))
          small.push(one)
        })
        show(h("p", { class: "line", text: "Which one is " + mine.name + "'s?" }), tiles, h("div", { class: "row" }, keep))
      }
    }

    function ready() {
      show(
        h("p", { class: "line", text: mine.name + " is ready." }),
        h("p", { class: "sub", text: "Show it to everyone, or keep it. Once it is claimed, the treats people give it in the post fill presents for you." }),
        h("div", { class: "row" },
          btn("light grow", "Share " + mine.name, function () { location.hash = "share" }),
          btn("dark grow", "Claim " + mine.name, function () { location.hash = "claim" })),
      )
    }

    function meet() {
      phase = "out"
      orb.notice = true
      var pats = 412, treats = 96, stroke = 0
      var count = h("span", { class: "count" })
      var tally = function () { count.textContent = pats + " pats · " + treats + " treats" }
      tally()
      el.addEventListener("pointermove", function (e) {
        var box = eggBox.getBoundingClientRect()
        var x = ((e.clientX - box.left) / box.width) * 2 - 1
        if (Math.abs(x) > 0.7 || e.clientY < box.top + box.height * 0.2 || e.clientY > box.bottom) return
        orb.pet(x, 0.08)
        if ((stroke += 0.08) >= 1) { stroke = 0; pats++; tally() }
      })
      // Four treats fill a present, as in the app. Here they are anyone's who opens the post.
      var filled = 3
      var pips = h("div", { class: "pips" })
      var toward = h("span")
      var meter = h("div", { class: "meter" }, pips, toward)
      var fill = function () {
        pips.replaceChildren()
        for (var n = 0; n < 4; n++) pips.append(h("i", { "data-on": String(n < filled) }))
        toward.textContent = filled === 4 ? "That makes a present for " + look.name + "'s owner" : filled + " of 4 treats to its next present"
        meter.dataset.full = String(filled === 4)
      }
      fill()
      var feed = btn("light grow", "Give a treat", function () {
        feed.disabled = true
        orb.offer(true)
        setTimeout(function () { orb.bite() }, 650)
        setTimeout(function () { orb.bite() }, 1050)
        setTimeout(function () {
          orb.offer(false)
          orb.cheer()
          treats++
          tally()
          filled++
          fill()
          feed.textContent = "Given for today"
          if (filled === 4) sky.confetti([hexOf(look.color), "#ffb92e"])
        }, 1500)
      })
      show(
        h("div", { class: "row", style: "margin-top:0" }, h("p", { class: "line", text: look.name }), count),
        meter,
        h("div", { class: "row" }, feed, btn("dark grow", "Hatch your own", function () {
          dispose()
          card(root, { mode: "hatch", shape: o.shape, auto: true })
        })),
      )
    }

    // In the app, as its owner: what the post's treats came to, opened with the app's own box.
    function owner() {
      phase = "out"
      orb.notice = true
      var left = 3
      var waiting = function (line, sub) {
        show(
          h("p", { class: "line", text: line }),
          h("p", { class: "sub", text: sub }),
          left ? h("div", { class: "row" }, btn("dark grow", left === 3 ? "Open one" : "Open another", open)) : null,
        )
      }
      function open() {
        var thing = found()
        show()
        phase = "gift"
        var gift = wardrobe.unwrap(orb, {
          onPop: function () { sky.flash(0.4); sky.bump(0.6) },
          onShown: function () {
            setTimeout(function () {
              if (gone) return
              gift.dispose()
              phase = "out"
              look.outfit = wearing(thing, look.outfit)
              wardrobe.dress(orb, look.outfit)
              orb.cheer()
              left--
              waiting(thing.name + ".", thing.rarity[0].toUpperCase() + thing.rarity.slice(1) + ", and on. " +
                (left ? left + (left === 1 ? " present" : " presents") + " left." : "That was the last one, until the next four treats."))
            }, 1300)
          },
        })
        gift.shake()
        setTimeout(function () { if (!gone) gift.open({ id: thing.id, tiers: tiersTo(thing) }) }, 800)
      }
      waiting("12 treats came in from your post.", "Four treats fill a present, so that is 3. Each holds one thing to wear, as a present in the app does today.")
    }

    function claim() {
      phase = "out"
      orb.notice = true
      orb.setState("speaking")
      var done = function () {
        orb.setState("idle")
        orb.cheer()
        sky.confetti([hexOf(look.color)])
        show(
          h("p", { class: "line", text: look.name + " is yours." }),
          h("p", { class: "sub", text: "From here it is the app: " + look.name + "'s chat, with its hello first. Treats given in the post now fill presents for you." }),
        )
      }
      show(
        h("p", { class: "line", text: "I'm " + look.name + ". I hatched in a post on X." }),
        h("p", { class: "sub", text: "Sign in and I'm yours. I get a computer of my own and start working for you." }),
        h("div", { class: "row" }, btn("dark grow", "Continue with GitHub", done), btn("light grow", "Use email", done)),
      )
    }

    el.addEventListener("click", function () {
      if (phase === "fall" && sky.falling) sky.land()
      else if (phase === "tap") tap()
      else if (phase === "gift") openIt && openIt()
      else if (phase === "out") orb.cheer()
    })
    skip.onclick = function (e) { e.stopPropagation(); sky.land() }
    poster.onclick = function (e) { e.stopPropagation(); o.onPoster ? o.onPoster() : play() }

    if (o.auto) play()
    else {
      still = true
      var title = o.mode === "hatch" ? ["Hatch a Dood", "Right here, in this post"] : ["Meet " + look.name, "A Dood, hatched in a post"]
      poster.append(h("h2", { html: esc(title[0]) + "<small>" + esc(title[1]) + "</small>" }))
      if (o.play !== false) poster.append(h("div", { class: "play" }))
    }

    function dispose() {
      if (gone) return
      gone = true
      cancelAnimationFrame(raf)
      small.forEach(function (one) { one.dispose() })
      orb.dispose()
      sky.dispose()
      el.remove()
    }
    var it = { dispose: dispose }
    live.push(it)
    return it
  }

  /* The post around it. */
  function face(seed, color) {
    var canvas = h("canvas")
    var orb = core.createOrb(canvas, { seed: seed, color: hexOf(color), size: 40, dark: true, notice: false, slow: true })
    live.push(orb)
    return h("div", { class: "x-face" }, canvas)
  }
  var who = function (name, at, seed, color) {
    return h("div", { class: "x-who" }, face(seed, color),
      h("div", {}, h("div", { class: "x-name", text: name }), h("div", { class: "x-at", text: "@" + at })))
  }
  function post(o) {
    var body = h("div")
    var el = h("div", { class: "x-post" },
      who(o.name, o.at, o.seed, o.color),
      h("div", { class: "x-text", html: o.text }),
      body,
      h("p", { class: "x-from", text: "From do.computer" }),
      h("div", { class: "x-meta", html: "9:41 AM · Oct 12, 2026 · <b>" + o.views + "</b> Views" }),
      h("div", { class: "x-acts", html: "<span><b>" + o.counts[0] + "</b> Replies</span><span><b>" + o.counts[1] + "</b> Reposts</span><span><b>" + o.counts[2] + "</b> Likes</span>" }),
    )
    return { el: el, body: body }
  }
  var reply = function (name, at, seed, color, text) {
    return h("div", { class: "x-reply" }, face(seed, color),
      h("div", {}, h("span", { class: "x-name", text: name }), h("span", { class: "x-at", text: " @" + at + " · 2m" }), h("p", { html: text })))
  }
  var column = function () {
    var col = h("div", { class: "x-col" }, h("div", { class: "x-head", html: "<span>←</span><span>Post</span>" }))
    for (var i = 0; i < arguments.length; i++) col.append(arguments[i])
    return col
  }
  var link = function () { return '<span class="x-link">do.computer/d/' + mine.id + "</span>" }
  var ours = function () {
    return post({ name: "Do Computer", at: "docomputer", seed: "do-computer", color: "tide", text: "Hatch a Dood.\nRight here, in this post. 🥚", views: "88.4K", counts: ["48", "212", "1.9K"] })
  }
  var theirs = function () {
    return post({ name: "Ada", at: "ada_builds", seed: "ada", color: "rose", text: "I hatched " + esc(mine.name) + " 🥚\n\nHatch yours: " + link(), views: "3,104", counts: ["7", "12", "86"] })
  }
  var replies = function () {
    return [
      reply("Ada", "ada_builds", "ada", "rose", "mine is called Pip and it is perfect " + link()),
      reply("Tomás", "tomasr", "tomas", "honey", "ok I named mine Gerald"),
    ]
  }

  var SCENES = {
    hatch: {
      label: "1 · Hatch in the post",
      note: "Our own post. Before it is played X shows our picture and its play button; then the card is our page, 480 by 480, shown at the post's width. An egg comes down, two taps crack it, it is named and given a colour, and it hatches. \"Hatch another\" gives a different Dood as often as wanted. Then its present: the app's box, with three things in it and one to keep. Nobody signs in. The two buttons at the end go to scenes 2 and 4.",
      draw: function (app) {
        var p = ours()
        card(p.body, { mode: "hatch" })
        app.append(column.apply(null, [p.el].concat(replies())))
      },
    },
    share: {
      label: "2 · Share it",
      note: "\"Share\" opens X's own composer in a new tab with the words and the Dood's link filled in. The link is a page of ours for that one Dood, so the post it makes carries that Dood as its card. \"Post\" goes to scene 3.",
      draw: function (app) {
        var p = ours()
        card(p.body, { mode: "meet", dood: mine, play: false, onPoster: function () {} })
        app.append(column(p.el))
        var preview = h("div")
        var box = h("div", { class: "x-compose" },
          who("You", "you", "you", "moss"),
          h("div", { class: "x-text", html: "I hatched " + esc(mine.name) + " 🥚\n\nHatch yours: " + link() }),
          preview,
          h("div", { class: "bar" }, h("span", { text: "Everyone can reply" }), h("button", { class: "x-go", text: "Post", onclick: function () { location.hash = "shared" } })),
        )
        app.append(h("div", { class: "x-dim" }, box))
        card(preview, { mode: "meet", dood: mine, onPoster: function () {} })
      },
    },
    shared: {
      label: "3 · Someone's Dood",
      note: "What their followers see, of a Dood that has been claimed. Played, it is that Dood on its island in what it wears: it looks at the pointer and can be stroked and fed. Every fourth treat, whoever gives it, is a present for its owner (scene 5). One treat a day from each person. \"Hatch your own\" starts scene 1 in the same card.",
      draw: function (app) {
        var p = theirs()
        card(p.body, { mode: "meet", dood: mine })
        app.append(column(p.el, reply("Tomás", "tomasr", "tomas", "honey", "gave it a treat. it did a little hop")))
      },
    },
    claim: {
      label: "4 · Claim it",
      note: "\"Claim\" opens do.computer in a new tab with the Dood's id in the address (a card in a post cannot share a sign-in with the site). It is the first run without the fall and the name: the Dood is already out and asks only who you are. Signing in makes it the account's first agent, same look and name.",
      draw: function (app) {
        var body = h("div", { class: "body" })
        app.append(h("div", { class: "win" },
          h("div", { class: "bar" }, h("i"), h("i"), h("i"), h("span", { text: "do.computer/welcome?dood=" + mine.id })), body))
        card(body, { mode: "claim", dood: mine, shape: "fill", auto: true })
      },
    },
    presents: {
      label: "5 · Presents from treats",
      note: "The owner, in the app. The treats given in the post have filled presents, and they are opened with the box the app already has: one thing each, by its rarities, and worn from then on, in the post as well.",
      draw: function (app) {
        var body = h("div", { class: "body" })
        app.append(h("div", { class: "win" },
          h("div", { class: "bar" }, h("i"), h("i"), h("i"), h("span", { text: "do.computer" })), body))
        card(body, { mode: "owner", dood: mine, shape: "fill", auto: true })
      },
    },
    phone: {
      label: "6 · In the X app",
      note: "The phone apps do not play a card in the timeline. They show the picture with a play button, and a tap opens our page in X's own browser over the post, where it is the same card at full height. Tap the picture.",
      draw: function (app) {
        var p = theirs()
        var body = h("div", { class: "body" })
        var sheet = h("div", { class: "sheet", "data-on": "false" },
          h("div", { class: "bar" }, h("b", { text: "Done", onclick: function () { location.hash = "phone"; draw() } }), h("span", { text: "do.computer/d/" + mine.id })), body)
        card(p.body, { mode: "meet", dood: mine, onPoster: function () {
          sheet.dataset.on = "true"
          card(body, { mode: "meet", dood: mine, shape: "fill", auto: true })
        } })
        app.append(h("div", { class: "phone" }, column(p.el), sheet))
      },
    },
    off: {
      label: "7 · If X turns cards off",
      note: "X stopped playing cards in posts for some hours on 8 October, Tweetcraft's included, and may again. The same link then shows as an ordinary picture card, and a click opens the Dood's page in a tab. Nothing else changes. Click the picture.",
      draw: function (app, opened) {
        if (opened) {
          var body = h("div", { class: "body" })
          app.append(h("div", { class: "win" },
            h("div", { class: "bar" }, h("i"), h("i"), h("i"), h("span", { text: "do.computer/d/" + mine.id })), body))
          return void card(body, { mode: "meet", dood: mine, shape: "fill", auto: true })
        }
        var p = theirs()
        card(p.body, { mode: "meet", dood: mine, shape: "wide", play: false, onPoster: function () { draw(true) } })
        app.append(column(p.el))
      },
    },
  }

  var app = document.getElementById("app"), strip = document.getElementById("strip")
  function draw(opened) {
    var name = location.hash.slice(1)
    if (!SCENES[name]) name = "hatch"
    live.splice(0).forEach(function (it) { it.dispose() })
    app.replaceChildren()
    SCENES[name].draw(app, opened === true)
    var nav = h("nav", {}, h("b", { text: "Mock-up" }))
    Object.keys(SCENES).forEach(function (key) {
      nav.append(h("button", { text: SCENES[key].label, "aria-current": String(key === name), onclick: function () {
        if (location.hash === "#" + key) draw()
        else location.hash = key
      } }))
    })
    strip.replaceChildren(nav, h("p", { text: SCENES[name].note }))
    scrollTo(0, 0)
  }
  addEventListener("hashchange", draw)
  draw()
})()
</script>
</body>
</html>
