<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice calls · mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
html { background: var(--background, #14181a); color: var(--foreground, #e8ecee); }
body {
  font-family: "Geist", "Inter", ui-sans-serif, system-ui, sans-serif;
  letter-spacing: -0.006em;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; cursor: pointer; }
ul { list-style: none; padding: 0; }
.ic { flex: none; display: block; }

/* The mock-up's own bar: scenes and what each shows. Not part of the design. */
#nav { padding: 2px 0 0; }
.ngroups { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.ng { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ng > span { font-size: 11.5px; color: var(--muted-foreground, #8b979c); margin-right: 4px; }
.nb { font-size: 12.5px; padding: 5px 10px; border-radius: 7px; color: var(--foreground, #c9d2d6); background: var(--muted, #1f2528); white-space: nowrap; }
.nb:hover { filter: brightness(1.12); }
.nb.on { background: #2f8f8a; color: #fff; }
.nb.act { background: transparent; box-shadow: inset 0 0 0 1px var(--border, #3a4347); }
.nb.act:hover { background: var(--muted, #1f2528); }
.nb.go { box-shadow: inset 0 0 0 1px #2f8f8a; color: #2f8f8a; font-weight: 600; }
#cap { font-size: 13px; line-height: 1.5; color: var(--muted-foreground, #aab5ba); margin-top: 8px; max-width: 1100px; min-height: 39px; }
#cap b { color: var(--foreground, #e8ecee); font-weight: 600; }
#wrap { padding: 10px 0 0; }
#wrap.real { overflow-x: auto; }
#fit { position: relative; }
#stage { width: 1200px; height: 770px; box-shadow: 0 0 0 1px var(--border, #2a3033); transform-origin: 0 0; border-radius: 12px; overflow: hidden; position: absolute; top: 0; left: 0; }

/* The app's colors, as in apps/web/src/styles.css. */
.t {
  --agent-color: oklch(0.5 0.08 195);
  --canvas: oklch(0.997 0.001 212);
  --ink: oklch(0.27 0.008 212);
  --shade: oklch(0.27 0.02 212);
  --frame: color-mix(in oklch, var(--ink) 4.5%, var(--canvas));
  --hairline: color-mix(in oklch, var(--ink) 10%, transparent);
  --elevation-raised: 0 0 0 1px var(--hairline), 0 1px 2px oklch(from var(--shade) l c h / 0.07);
  --elevation-card: 0 0 0 1px var(--hairline), 0 1px 2px oklch(from var(--shade) l c h / 0.04), 0 10px 28px -14px oklch(from var(--shade) l c h / 0.12);
  --elevation-float: 0 0 0 1px var(--hairline), 0 2px 5px oklch(from var(--shade) l c h / 0.05), 0 22px 48px -22px oklch(from var(--shade) l c h / 0.26);
  --background: var(--canvas);
  --foreground: var(--ink);
  --card: var(--canvas);
  --primary: oklch(from var(--agent-color) 0.5 c h);
  --muted: color-mix(in oklch, var(--ink) 6%, var(--canvas));
  --muted-foreground: color-mix(in oklch, var(--ink) 62%, var(--canvas));
  --accent: color-mix(in oklch, var(--ink) 8%, var(--canvas));
  --border: color-mix(in oklch, var(--ink) 13%, var(--canvas));
  --input: color-mix(in oklch, var(--ink) 22%, var(--canvas));
  --hang: oklch(0.6 0.2 25);
  --live: oklch(0.62 0.15 155);
  /* The call's own surface: the Dood's color, taken dark. */
  --night: oklch(from var(--agent-color) 0.26 0.045 h);
  --night-2: oklch(from var(--agent-color) 0.4 0.075 h);
  color: var(--foreground);
  font-size: 14px;
}
.dk .t {
  --canvas: oklch(0.212 0.004 212);
  --ink: oklch(0.9 0.006 212);
  --frame: oklch(0.168 0.004 212);
  --hairline: color-mix(in oklch, var(--ink) 11%, transparent);
  --elevation-raised: 0 0 0 1px var(--hairline), inset 0 1px 0 oklch(1 0 0 / 0.04);
  --elevation-card: 0 0 0 1px var(--hairline);
  --elevation-float: 0 0 0 1px var(--hairline), inset 0 1px 0 oklch(1 0 0 / 0.05), 0 22px 48px -22px oklch(0 0 0 / 0.7);
  --card: color-mix(in oklch, var(--ink) 4%, var(--canvas));
  --primary: oklch(from var(--agent-color) 0.62 c h);
  --muted: color-mix(in oklch, var(--ink) 8%, var(--canvas));
  --accent: color-mix(in oklch, var(--ink) 11%, var(--canvas));
  --input: color-mix(in oklch, var(--ink) 20%, var(--canvas));
  --live: oklch(0.74 0.15 155);
  --night: oklch(from var(--agent-color) 0.2 0.035 h);
  --night-2: oklch(from var(--agent-color) 0.32 0.06 h);
}
.muted { color: var(--muted-foreground); }

/* Frame, sidebar and sheet. */
.app { width: 1200px; height: 770px; display: flex; background: var(--frame); position: relative; }
.side { width: 252px; flex: none; display: flex; flex-direction: column; padding: 8px; }
.shead { display: flex; align-items: center; gap: 10px; padding: 8px 8px 14px; }
.shead b { font-weight: 600; }
.shead .ib { margin-left: auto; }
.av { width: 28px; height: 28px; border-radius: 50%; background: #1d2b3a; color: #fff; font-size: 10.5px; font-weight: 600; display: grid; place-items: center; flex: none; }
.slbl { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 8px; font-size: 13px; color: var(--muted-foreground); }
.row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; }
.row.sel { background: var(--card); box-shadow: var(--elevation-raised); }
.row .cr { width: 40px; height: 40px; object-fit: contain; flex: none; image-rendering: pixelated; }
.rt { min-width: 0; flex: 1; }
.nm { display: flex; justify-content: space-between; align-items: baseline; font-weight: 500; font-size: 14.5px; }
.nm time { font-size: 11.5px; color: var(--muted-foreground); font-weight: 400; font-variant-numeric: tabular-nums; }
.ln { font-size: 12.5px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.ln.live { color: var(--live); display: flex; align-items: center; gap: 6px; font-weight: 500; }
.sfoot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; font-weight: 500; }
.sfoot .ic { margin-left: auto; color: var(--muted-foreground); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); flex: none; }
.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }

.sheet { flex: 1; min-width: 0; margin: 8px 8px 8px 0; background: var(--background); border-radius: 14px; box-shadow: var(--elevation-card); display: flex; flex-direction: column; overflow: hidden; position: relative; }
.strip { height: 56px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 14px; }
.who { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15.5px; }
.who img { width: 30px; height: 30px; image-rendering: pixelated; }
.who .ic { color: var(--muted-foreground); }
.tabs { display: flex; background: var(--muted); border-radius: 9px; padding: 3px; gap: 2px; }
.tab { padding: 5px 12px; border-radius: 7px; font-size: 13.5px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
.tab.on { background: var(--card); box-shadow: var(--elevation-raised); color: var(--foreground); }
.sr { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--muted-foreground); font-size: 13.5px; }
.sr .sc { display: flex; align-items: center; gap: 7px; padding: 0 10px; font-weight: 500; }
.sr .n { font-size: 11.5px; background: var(--muted); border-radius: 99px; padding: 1px 7px; }
.ib { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted-foreground); flex: none; position: relative; }
.ib:hover { background: var(--accent); color: var(--foreground); }
.ib.hot { box-shadow: 0 0 0 2px var(--primary); color: var(--foreground); }
.ib.live { color: var(--live); background: color-mix(in oklch, var(--live) 14%, var(--canvas)); }
.body { flex: 1; min-height: 0; display: flex; position: relative; }
.tip { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--canvas); font-size: 12px; font-weight: 500; padding: 5px 9px; border-radius: 7px; white-space: nowrap; z-index: 5; pointer-events: none; }
.tip.r { left: auto; right: -6px; transform: none; }

/* The chat. */
.chat { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.msgs { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; padding: 12px 28px 18px; width: 100%; max-width: 736px; margin: 0 auto; }
.msgs > * { flex: none; }
.me { align-self: flex-end; max-width: 86%; background: color-mix(in oklch, var(--primary) 15%, var(--canvas)); padding: 10px 16px; border-radius: 16px; font-size: 15px; line-height: 1.55; }
.ai { font-size: 15px; line-height: 1.65; }
.ai code { font-family: "Geist Mono", ui-monospace, monospace; font-size: 0.85em; border: 1px solid var(--hairline); background: var(--muted); border-radius: 6px; padding: 1px 5px; }
.comp { margin: 0 auto 14px; width: calc(100% - 56px); max-width: 680px; flex: none; border-radius: 16px; box-shadow: var(--elevation-float); background: var(--card); padding: 14px 14px 10px; }
.comp .ph { color: var(--muted-foreground); font-size: 15px; padding: 0 4px 16px; }
.comp .cb { display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); }
.comp .cb .sp { flex: 1; }
.send { margin-left: 6px; width: 32px; height: 32px; border-radius: 50%; background: color-mix(in oklch, var(--primary) 55%, var(--canvas)); color: #fff; display: grid; place-items: center; }
.pic { display: flex; gap: 8px; padding: 0 4px 10px; }
.pic span { width: 54px; height: 54px; border-radius: 10px; background: linear-gradient(135deg, #f1c27d, #d9728a 55%, #5b6fb5); box-shadow: var(--elevation-raised); }

/* A call in the chat: live while it lasts, a short record afterwards. */
.callc { align-self: stretch; border-radius: 14px; box-shadow: var(--elevation-raised); background: var(--card); overflow: hidden; }
.callc.live { box-shadow: 0 0 0 1.5px color-mix(in oklch, var(--live) 70%, transparent), 0 0 0 5px color-mix(in oklch, var(--live) 14%, transparent); }
.cch { display: flex; align-items: center; gap: 9px; padding: 10px 14px; font-size: 13.5px; }
.cch b { font-weight: 550; }
.cch .ic { color: var(--muted-foreground); }
.cch .ct { margin-left: auto; color: var(--muted-foreground); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); flex: none; box-shadow: 0 0 0 0 color-mix(in oklch, var(--live) 60%, transparent); animation: beat 1.6s ease-out infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--live) 60%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
.ccl { border-top: 1px solid var(--hairline); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 7px; }
.cl { display: grid; grid-template-columns: 58px 1fr; gap: 8px; font-size: 14px; line-height: 1.5; }
.cl i { font-style: normal; font-size: 12px; color: var(--muted-foreground); padding-top: 2.5px; font-weight: 500; }
.cl.you span { color: color-mix(in oklch, var(--ink) 74%, var(--canvas)); }
.cl.now span::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); margin-left: 6px; animation: pulse 0.9s ease-in-out infinite; vertical-align: 1px; }
.cw { margin-left: 66px; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; font-size: 13px; padding: 4px 11px 4px 8px; border-radius: 8px; background: var(--muted); color: color-mix(in oklch, var(--ink) 80%, var(--canvas)); }
.cw .ic { color: var(--primary); }
.cw.run { color: var(--primary); background: color-mix(in oklch, var(--primary) 11%, var(--canvas)); }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 1.75px solid color-mix(in oklch, var(--primary) 28%, transparent); border-top-color: var(--primary); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.ccs { border-top: 1px solid var(--hairline); padding: 10px 16px 4px 16px; }
.ccs li { display: flex; gap: 9px; align-items: baseline; font-size: 14px; line-height: 1.5; padding: 2.5px 0; }
.ccs li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--input); flex: none; transform: translateY(-2.5px); }
.ccf { display: flex; align-items: center; gap: 10px; padding: 8px 12px 12px 14px; font-size: 12.5px; color: var(--muted-foreground); }
.ccf .sp { flex: 1; }
.btn { font-size: 12.5px; padding: 5px 10px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--border); font-weight: 500; color: var(--foreground); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--accent); }
.btn.pri { background: var(--primary); color: #fff; box-shadow: none; }
.btn.pri:hover { filter: brightness(1.08); background: var(--primary); }

/* The Dood's panel. */
.aside { width: 320px; flex: none; margin: 0 10px 10px 0; border-radius: 12px; box-shadow: var(--elevation-raised); background: var(--card); display: flex; flex-direction: column; overflow: hidden; position: relative; }
.face { position: relative; padding: 30px 16px 16px; text-align: center; flex: none; }
.face > .ib { position: absolute; top: 10px; right: 10px; }
.orb { display: inline-grid; place-items: center; position: relative; z-index: 1; vertical-align: top; }
.orb canvas, .orb img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.orb img { animation: bob 3.4s ease-in-out infinite; }
.orb canvas { position: absolute; inset: 0; opacity: 0; }
.orb.live canvas { opacity: 1; }
.orb.live img { visibility: hidden; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.an { font-size: 18px; font-weight: 500; margin-top: 4px; }
.as { font-size: 13.5px; color: var(--muted-foreground); margin-top: 2px; height: 20px; display: flex; justify-content: center; align-items: center; gap: 7px; }
.as.live { color: var(--live); font-weight: 500; }
.callb { margin: 14px auto 0; display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px 8px 14px; border-radius: 99px; font-weight: 550; font-size: 14px; background: color-mix(in oklch, var(--primary) 13%, var(--canvas)); color: var(--primary); position: relative; }
.callb:hover { background: color-mix(in oklch, var(--primary) 20%, var(--canvas)); }
.callb.hot { box-shadow: 0 0 0 2px var(--primary), 0 0 0 7px color-mix(in oklch, var(--primary) 16%, transparent); }
.sec { border-top: 1px solid var(--hairline); padding: 12px 18px 14px; flex: none; }
.sec.grow { flex: 1; min-height: 0; overflow: hidden; }
.lbl { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--muted-foreground); font-weight: 500; margin-bottom: 6px; height: 22px; }
.sec li { display: flex; gap: 9px; align-items: baseline; font-size: 13px; padding: 4px 0; color: color-mix(in oklch, var(--ink) 80%, var(--canvas)); }
.sec li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--input); flex: none; transform: translateY(-2px); }
.sec li.run { color: var(--primary); }
.sec li.run::before { background: var(--primary); animation: pulse 1.1s ease-in-out infinite; }
.sec li time { margin-left: auto; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
.sec p { font-size: 13px; line-height: 1.55; color: var(--muted-foreground); }
.prow { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 9px; box-shadow: var(--elevation-raised); font-size: 13px; }
.prow .ic { color: var(--muted-foreground); }
.prow .tt { font-weight: 500; flex: 1; }
.prow .tm { font-size: 12px; color: var(--muted-foreground); }

/* A: the call in the panel. The face is the call. */
.oncall .cbar { display: flex; align-items: center; gap: 8px; padding: 10px 8px 0 14px; font-size: 13px; font-weight: 500; color: var(--live); }
.oncall .cbar .ct { color: var(--muted-foreground); font-weight: 400; font-variant-numeric: tabular-nums; }
.oncall .cbar .sp { flex: 1; }
.oncall .cbar .ib { width: 26px; height: 26px; }
.cface { position: relative; height: 226px; display: grid; place-items: center; flex: none; }
.glow { position: absolute; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle, color-mix(in oklch, var(--primary) 26%, transparent), transparent 66%); opacity: 0.55; transition: opacity 0.4s, transform 0.4s; }
.rings { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.rings i { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 1.5px solid var(--primary); opacity: 0; }
[data-phase="speaking"] .glow { opacity: 1; animation: breathe 0.9s ease-in-out infinite; }
[data-phase="speaking"] .rings i { animation: ring 2.1s ease-out infinite; }
[data-phase="speaking"] .rings i:nth-child(2) { animation-delay: 0.7s; }
[data-phase="speaking"] .rings i:nth-child(3) { animation-delay: 1.4s; }
[data-phase="hearing"] .rings i:first-child { opacity: 0.5; width: 196px; height: 196px; border-style: dashed; border-color: color-mix(in oklch, var(--ink) 40%, transparent); animation: hear 0.7s ease-in-out infinite; }
[data-phase="working"] .rings i:first-child { opacity: 0.9; width: 196px; height: 196px; border-color: transparent; border-top-color: var(--primary); border-right-color: color-mix(in oklch, var(--primary) 40%, transparent); animation: spin 1.1s linear infinite; }
[data-phase="connecting"] .rings i:first-child { opacity: 0.6; width: 196px; height: 196px; border-style: dotted; animation: spin 6s linear infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
@keyframes ring { 0% { transform: scale(0.95); opacity: 0.5; } 100% { transform: scale(1.62); opacity: 0; } }
@keyframes hear { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.955); } }
.oncall .an { text-align: center; margin-top: -6px; }
.oncall .as { color: var(--primary); font-weight: 500; }
[data-phase="listening"] .as, [data-phase="hearing"] .as, [data-phase="connecting"] .as { color: var(--muted-foreground); font-weight: 400; }
.capt { margin: 12px 16px 0; padding: 11px 13px; border-radius: 12px; background: var(--muted); min-height: 96px; font-size: 14px; line-height: 1.5; flex: none; }
.capt .cy { color: var(--muted-foreground); font-size: 12.5px; margin-bottom: 5px; min-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.capt .cy i, .scap .cy i { font-style: normal; font-weight: 600; margin-right: 5px; }
.capt .cs { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ctl { display: flex; justify-content: center; align-items: flex-start; gap: 14px; padding: 16px 0 16px; flex: none; }
.cbt { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted-foreground); width: 64px; }
.cbt > span { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--muted); color: var(--foreground); transition: background 0.15s; }
.cbt:hover > span { background: var(--accent); }
.cbt.on > span { background: var(--ink); color: var(--canvas); }
.cbt.end > span { background: var(--hang); color: #fff; width: 62px; }
.cbt.end:hover > span { filter: brightness(1.08); background: var(--hang); }

/* B: a small card over the chat, as Dots does it. Also what a call shrinks to when you go elsewhere. */
.ccard { --night: oklch(from var(--agent-color) 0.26 0.045 h); position: absolute; z-index: 6; top: 6px; right: 16px; width: 272px; border-radius: 16px; background: var(--night); color: #fff; padding: 12px; box-shadow: 0 0 0 1px oklch(1 0 0 / 0.08), 0 22px 44px -18px oklch(0 0 0 / 0.5); }
.ccard.br { top: auto; bottom: 18px; right: 18px; }
.ccard .top { display: flex; align-items: center; gap: 10px; }
.ccard .cf { position: relative; width: 52px; height: 52px; flex: none; display: grid; place-items: center; }
.ccard .cf img { width: 52px; height: 52px; image-rendering: pixelated; position: relative; }
.ccard .cf::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, oklch(1 0 0 / 0.18), transparent 70%); }
.ccard .cn { flex: 1; min-width: 0; line-height: 1.3; }
.ccard .cn b { font-weight: 550; font-size: 14.5px; display: block; }
.ccard .cn span { font-size: 12.5px; color: oklch(1 0 0 / 0.66); font-variant-numeric: tabular-nums; }
.ccard .ib { color: oklch(1 0 0 / 0.7); width: 26px; height: 26px; }
.ccard .ib:hover { background: oklch(1 0 0 / 0.12); color: #fff; }
.ccard .cc1 { font-size: 13px; line-height: 1.45; color: oklch(1 0 0 / 0.86); margin: 9px 2px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px; }
.ccard .cbs { display: flex; gap: 8px; margin-top: 10px; }
.ccard .cbs button { flex: 1; height: 36px; border-radius: 99px; display: grid; place-items: center; background: oklch(1 0 0 / 0.13); }

<script>
/* ================================================================

   Everything the mascot needs and nothing from the demo page: the seed
   genome, the shaders, the shared Stage, the Orb and the Runner.
   Hand it THREE (r128 core is enough):  var AgentOrb = AgentOrbCore(THREE)

   AgentOrb.makeGenome(seed)            pure: every trait the seed decides, as plain data
   AgentOrb.describeGenome(g, mascot)   pure: the same traits as [label, value] rows for people
   AgentOrb.createOrb(canvas, opts)     new Orb(canvas, opts), added to the Runner, loop started

             style ('retro' mascot | 'glass'), dark, reduced, notice (follow the pointer),
             pixelRatio, slow (draw at the lower frame rate)
   orb.setSeed(seed)   orb.setColor(hex)   orb.setStyle('retro' | 'glass')   orb.setTheme(dark)
   orb.setState(state, variant)         state: one of AgentOrb.STATES, or 'egg' for the waiting egg;
                                        variant: one of AgentOrb.VARIANTS, used by 'working'
   orb.getState()                       'egg', 'hatching' or the state name
   orb.feed('token', 0..1)              one streamed token of the answer
   orb.feed('key')                      one keystroke of the user
   orb.pet(x, amount)                   a hand on it: x from -1 (its left edge) to 1, amount 0..1 of a pat
   orb.setPointer(clientX, clientY)     point its attention there (null lets go);
                                        orb.attend(x, y, strength) is the raw, DOM-free form
   orb.offer(true | false)              a treat is held out to it: it opens its mouth for it, until told otherwise
   orb.bite()                           it takes a bite of what it was offered
   orb.cheer()                          a pleased little hop, whatever it is doing
   orb.hatch({ onDone, onOut })         play the hatch; orb.skipHatch() jumps to its end. onOut is the moment
                                        the shell breaks
   orb.crack(0..1)                      how cracked the waiting egg is: it keeps its cracks while it waits,
                                        and the hatch goes on from them
   orb.shadow = 0..1                    how much of its shadow is drawn: 0 for one that is in the air
   orb.turn = radians                   how far its egg is turned about its long axis: one that falls spins
   orb.stance()                         where it stands in its picture: { ground, egg }, see orb-core.d.ts
   orb.paused = true                    stop updating and drawing this one;
                                        Runner.stop() / Runner.start() pause and resume all of them
   orb.reduced = true                   reduced motion
   orb.resize(size)                     new css size (or re-measure the canvas)
   orb.dispose()                        remove it; its materials are freed a little later (Stage.retire)
   orb.onAuto = fn(state)               called when it changes state by itself (done -> idle, hatch -> idle)
   orb.hidden = true                    draw its scene without it: for something else shown on its stage
   orb.worn                             null, or what it has on (see wardrobe.js): { tick(dt, t), fit(), dispose() },
                                        called after each update, after its size or seed changes, and when it goes

     Stage.get      lets THREE.WebGLRenderer create its own canvas, unless Stage.provide(key, renderer)

/* ================================================================
   Genome: everything the seed decides
   ================================================================ */
function makeGenome(seed) {
  var r = seeded('orb/' + seed);
  var pool = [];
  for (var i = 0; i < 160; i++) pool.push(r());
  var at = 0;
  function n() { return pool[at++]; }
  function nr(a, b) { return a + (b - a) * n(); }
  function sign() { return n() < 0.5 ? -1 : 1; }
  // Each trait pulls a fixed number of values, so traits stay independent of one another.
  var g = { seed: seed };

  var k = n();
  g.kind = k < 0.40 ? 'liquid' : k < 0.70 ? 'faceted' : 'wispy';
  var s = [n(), n(), n(), n(), n(), n()];
  if (g.kind === 'liquid') {
    g.freq = lerp(0.6, 1.25, s[0]); g.amp = lerp(0.05, 0.11, s[1]);
    g.freq2 = g.freq * lerp(2.0, 3.0, s[2]); g.amp2 = lerp(0.0, 0.012, s[3]);
    g.flowSpd = lerp(0.10, 0.22, s[4]); g.wisp = 0; g.feather = 0; g.facet = 0; g.detail = 0;
  } else if (g.kind === 'faceted') {
    g.freq = lerp(0.7, 1.4, s[0]); g.amp = lerp(0.07, 0.14, s[1]);
    g.freq2 = 3; g.amp2 = 0;
    g.flowSpd = lerp(0.05, 0.12, s[4]); g.wisp = 0; g.feather = 0; g.facet = 1;
    g.detail = s[5] < 0.3 ? 1 : s[5] < 0.75 ? 2 : 3;
  } else {
    g.freq = lerp(1.0, 1.6, s[0]); g.amp = lerp(0.07, 0.12, s[1]);
    g.freq2 = g.freq * lerp(2.0, 2.6, s[2]); g.amp2 = lerp(0.02, 0.04, s[3]);
    g.flowSpd = lerp(0.20, 0.36, s[4]); g.wisp = 1; g.feather = lerp(0.7, 1.0, s[5]); g.facet = 0; g.detail = 0;
  }
  g.yawSpd = nr(0.10, 0.26) * sign();
  g.tilt0 = nr(-0.35, 0.35);

  // inner structure (glass) or skin markings (mascot)
  var pats = ['swirl', 'bands', 'spiral', 'cells'];
  var p1 = Math.floor(n() * 4) % 4, p2 = (p1 + 1 + Math.floor(n() * 3)) % 4;
  var mix2 = n() < 0.55 ? nr(0.15, 0.4) : (n(), 0);
  g.pattern = pats[p1]; g.pattern2 = mix2 > 0 ? pats[p2] : null;
  g.pat = [0, 0, 0, 0]; g.pat[p1] = 1 - mix2; g.pat[p2] += mix2;
  g.patScale = nr(1.2, 2.5);
  g.bands = 2 + Math.floor(n() * 6);
  g.arms = 2 + Math.floor(n() * 4);
  g.twist = nr(0.5, 2.0);
  g.contrast = nr(0.7, 1.0);
  g.axisX = nr(-0.7, 0.7); g.axisZ = nr(-0.7, 0.7);
  g.spinSpd = nr(0.10, 0.26) * sign();

  // core
  g.coreSize = nr(0.30, 0.55);
  g.coreGain = nr(0.75, 1.2);

  // colour drift around the base hue
  g.hueB = nr(14, 40) * sign();
  g.hueC = -Math.sign(g.hueB) * nr(25, 70);
  g.satK = nr(0.92, 1.18);
  g.lightK = nr(-0.04, 0.05);

  // finish
  g.glintPow = nr(16, 60);
  g.glintGain = nr(0.75, 1.2);
  g.rim = nr(0.6, 1.15);

  // company: motes, satellites, rings
  var hasM = n() < 0.7; var mc = 4 + Math.floor(n() * 14);
  g.motes = hasM ? mc : 0;
  g.moteSpd = nr(0.6, 1.3);
  var hasS = n() < 0.40; var sc = n();
  g.sats = hasS ? (sc < 0.55 ? 1 : sc < 0.85 ? 2 : 3) : 0;
  g.satTilt = [nr(-0.5, 0.5), nr(-0.6, 0.6)];
  g.satSpd = nr(0.7, 1.3);
  var hasR = n() < 0.36; var rc = n();
  g.rings = hasR ? (rc < 0.72 ? 1 : 2) : 0;
  g.ring = [
    { r: nr(1.34, 1.52), w: nr(0.035, 0.09), tx: nr(0.18, 0.42) * sign(), tz: nr(-0.5, 0.5), spd: nr(0.25, 0.6) * sign() },
    { r: nr(1.56, 1.70), w: nr(0.02, 0.05), tx: nr(0.2, 0.5) * sign(), tz: nr(-0.7, 0.7), spd: nr(0.2, 0.5) * sign() }
  ];
  g.seedVec = [n(), n(), n(), n()];

  // temperament
  g.tempo = nr(0.86, 1.18);
  g.breathHz = nr(0.85, 1.2);
  g.restless = nr(0.8, 1.35);
  g.bounce = nr(0.32, 0.55);
  g.side = sign();
  g.phase = nr(0, 100);
  g.ph = [nr(0, TAU), nr(0, TAU), nr(0, TAU), nr(0, TAU)];
  g.flowDir = (function () {
    var a = nr(0, TAU), z = nr(-0.6, 0.6), q = Math.sqrt(1 - z * z);
    return g.kind === 'wispy' ? [0.15 * Math.cos(a), -1, 0.15 * Math.sin(a)] : [q * Math.cos(a), z, q * Math.sin(a)];
  })();

  // eyes
  var er = n(), ea = n(), ez = n();
  g.eyeShape = er < 0.36 ? 'round' : er < 0.70 ? 'tall' : 'wide';
  g.eyeAspect = g.eyeShape === 'round' ? lerp(0.95, 1.12, ea) : g.eyeShape === 'tall' ? lerp(1.30, 1.62, ea) : lerp(0.70, 0.86, ea);
  g.eyeSize = g.eyeShape === 'round' ? lerp(0.170, 0.225, ez) : g.eyeShape === 'tall' ? lerp(0.145, 0.190, ez) : lerp(0.190, 0.245, ez);
  g.eyeGap = nr(0.07, 0.20);
  g.eyeY = nr(-0.02, 0.16);
  g.eyeN = nr(2.0, 3.4);
  g.eyeLid = nr(0.70, 1.05);
  if (g.eyeShape === 'wide') g.eyeLid = Math.max(g.eyeLid, 0.84);
  g.eyeTilt = nr(-0.14, 0.14);
  var ps = n(), pz = n();
  g.pupil = ps < 0.40 ? 'full' : ps < 0.75 ? 'dot' : 'iris';
  g.pupilSize = g.pupil === 'dot' ? lerp(0.50, 0.66, pz) : lerp(0.80, 0.93, pz);
  g.eyeHi2 = n() < 0.45;
  g.blinkEvery = nr(2.4, 5.6);
  g.blinkDouble = nr(0.05, 0.30);
  g.blinkSpeed = nr(0.85, 1.25);

  // mascot build
  var sh = n();
  g.shape = sh < 0.26 ? 'round' : sh < 0.46 ? 'drop' : sh < 0.66 ? 'mochi' : sh < 0.84 ? 'bean' : 'egg';
  g.shapeAmt = nr(0.6, 1.0);
  var pb = n();
  g.poly = pb < 0.30 ? 2 : pb < 0.75 ? 3 : 4;
  g.flat = n() < 0.55;
  var dz = n();
  g.dither = dz < 0.40 ? 'bayer' : dz < 0.62 ? 'checker' : dz < 0.78 ? 'lines' : 'none';
  g.tones = n() < 0.5 ? 3 : 4;
  var tp = n();
  g.top = tp < 0.22 ? 'none' : tp < 0.40 ? 'antenna' : tp < 0.54 ? 'floater' : tp < 0.72 ? 'ears' : tp < 0.86 ? 'horn' : 'tuft';
  if (g.shape === 'drop' && (g.top === 'ears' || g.top === 'horn' || g.top === 'tuft')) g.top = tp < 0.8 ? 'none' : 'floater';
  g.topSize = nr(0.75, 1.2);
  g.topLean = nr(-0.3, 0.3);
  g.tail = n() < 0.30;
  g.tailSide = sign();
  g.marks = n() < 0.72;
  g.markLight = n() < 0.5;
  g.mouthW = nr(0.8, 1.25);

  // the egg it hatches from
  g.eggTeeth = 5 + Math.floor(n() * 3);
  g.eggCrackY = nr(0.0, 0.2);
  g.eggDyed = n() < 0.3;
  return g;
}

function describeGenome(g, retro) {
  var marks = g.pattern === 'bands' ? 'stripes ×' + g.bands : g.pattern === 'spiral' ? 'whorl, ' + g.arms + ' arms' : g.pattern === 'cells' ? 'spots' : 'patches';
  var inside = g.pattern === 'bands' ? 'bands ×' + g.bands : g.pattern === 'spiral' ? 'spiral, ' + g.arms + ' arms' : g.pattern;
  if (g.pattern2) inside += ' + ' + g.pattern2;
  var surface = g.kind === 'faceted' ? 'faceted, ' + [0, 80, 180, 320][g.detail] + ' faces' : g.kind;
  var temper = g.tempo > 1.08 ? 'quick' : g.tempo < 0.94 ? 'slow' : 'even';
  temper += g.bounce < 0.4 ? ', bouncy' : g.bounce > 0.48 ? ', composed' : '';
  var rows = [
    ['eyes', g.eyeShape + (g.eyeGap < 0.11 ? ', close-set' : g.eyeGap > 0.16 ? ', wide-set' : '')],
    ['pupils', g.pupil === 'full' ? 'big' : g.pupil === 'dot' ? 'small' : 'ringed'],
    ['lids', g.eyeLid < 0.76 ? 'heavy' : g.eyeLid > 0.95 ? 'wide open' : 'relaxed'],
    ['blink', 'about every ' + g.blinkEvery.toFixed(1) + ' s']
  ];
  if (retro) {
    rows.push(['body', g.shape + ', ' + [0, 80, 180, 320, 500][g.poly] + ' faces']);
    rows.push(['shading', (g.flat ? 'flat' : 'gouraud') + ', ' + g.tones + ' tones' + (g.dither === 'none' ? '' : ', ' + g.dither + ' dither')]);
    rows.push(['on top', g.top === 'none' ? (g.shape === 'drop' ? 'tip' : 'nothing') : g.top]);
    rows.push(['tail', g.tail ? 'yes' : 'no']);
    rows.push(['markings', g.marks ? marks : 'none']);
  } else {
    rows.push(['surface', surface]);
    rows.push(['inside', inside]);
    rows.push(['core', g.coreSize > 0.46 ? 'wide' : g.coreSize < 0.37 ? 'tight' : 'medium']);
  }
  if (retro) rows.push(['egg', (g.eggDyed ? 'tinted' : 'pale') + ' shell, ' + (g.marks ? marks : 'speckles')]);
  rows.push(['hue drift', (g.hueB > 0 ? '+' : '−') + Math.abs(Math.round(g.hueB)) + '°']);
  rows.push(['rings', String(g.rings)]);
  rows.push(['satellites', String(g.sats)]);
  rows.push(['motes', String(g.motes)]);
  rows.push(['temper', temper]);
  return rows;
}

// Simplex noise at v: its slope in xyz and its value in w.
// From webgl-noise by Ian McEwan, Ashima Arts, and Stefan Gustavson (MIT): THIRD_PARTY_NOTICES.md.
var NOISE = [
  'vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}',
  'vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}',
  'vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}',
  'vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}',
  'vec4 snoise(vec3 v){',
  '  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);',
  '  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);',
  '  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);',
  '  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;',
  '  i=mod289(i);',
  '  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));',
  '  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;',
  '  vec4 j=p-49.0*floor(p*ns.z*ns.z);',
  '  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);',
  '  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);',
  '  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);',
  '  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));',
  '  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
  '  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);',
  '  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
  '  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;',
  '  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); vec4 m2=m*m; vec4 m4=m2*m2;',
  '  vec4 px=vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)); vec4 t=m2*m*px;',
  '  return 42.0*vec4(-8.0*(t.x*x0+t.y*x1+t.z*x2+t.w*x3) + m4.x*p0+m4.y*p1+m4.z*p2+m4.w*p3, dot(m4,px));',
  '}'
].join('\n');

// Ordered dither thresholds in 0..1: 4x4 Bayer, a two-level checker, or scanlines.
var DITHER = [
  'uniform float uDk;',
  'float B2(vec2 a){ a = floor(a); return fract(a.x/2.0 + a.y*a.y*0.75); }',
  'float bayer4(vec2 p){ return B2(0.5*p)*0.25 + B2(p) + 0.03; }',
  'float dth(vec2 p){',
  '  if (uDk < 0.5) return B2(0.5*p)*0.25 + B2(p) + 0.03;',
  '  if (uDk < 1.5) { vec2 a = floor(p); return mod(a.x + a.y, 2.0)*0.5 + 0.25; }',
  '  return mod(floor(p.y), 2.0)*0.5 + 0.25;',
  '}'
].join('\n');

// Marking / interior pattern, shared by the body and the egg.
var PATTERN = [
  'uniform vec4 uPat; uniform vec4 uPatP; uniform vec2 uPatQ; uniform float uPatT;',
  'float pattern(vec3 q){',
  '  float t = uPatT; float v = 0.0;',
  '  if (uPat.x > 0.001) {',
  '    vec3 w = q*uPatP.x;',
  '    w += 0.6*sin(w.yzx*1.9 + t*0.9);',
  '    w += 0.4*sin(w.zxy*3.1 - t*0.7);',
  '    v += uPat.x * smoothstep(0.1, 0.9, 0.5 + 0.5*sin(3.4*(w.x + w.y*0.8 + w.z*0.5)));',
  '  }',
  '  if (uPat.y > 0.001) {',
  '    float lat = q.y + 0.10*sin(q.x*3.1 + t*0.6)*sin(q.z*2.7 - t*0.4);',
  '    float b = 0.5 + 0.5*sin(lat*uPatP.y*3.14159 + 0.7*uPatP.z*sin(q.x*2.0 + q.z*2.0 + t*0.3));',
  '    v += uPat.y * smoothstep(0.12, 0.88, b);',
  '  }',
  '  if (uPat.z > 0.001) {',
  '    float ang = atan(q.z, q.x); float rad = length(q.xz);',
  '    v += uPat.z * (0.5 + 0.5*sin(ang*uPatQ.x + rad*uPatP.z*4.5 - t*1.3 + q.y*2.2)*smoothstep(0.08, 0.6, rad));',
  '  }',
  '  if (uPat.w > 0.001) {',
  '    vec3 w = q*uPatP.x*1.7 + 0.5*sin(q.zxy*2.1 + t*0.5);',
  '    v += uPat.w * smoothstep(-0.25, 0.55, sin(w.x)*sin(w.y)*sin(w.z)*1.6);',
  '  }',
  '  return v;',
  '}'
].join('\n');

var BODY_VERT = [
  'attribute float aPart;',
  'uniform vec3 uFlow; uniform vec3 uFlow2; uniform vec4 uSurf; uniform float uWisp; uniform float uFace;',
  'uniform vec3 uVoice; uniform vec3 uFront;',
  'uniform vec4 uShape; uniform vec4 uBump[3]; uniform vec3 uBumpK;',
  'uniform vec4 uTop; uniform vec3 uTopDir; uniform vec3 uBend; uniform float uSnap;',
  'varying vec3 vN; varying vec3 vV; varying vec3 vObj; varying vec3 vN0; varying float vPart;',
  NOISE,
  // The noise is taken once for a vertex, with its slope, and the two neighbours its normal is
  // found from are given the noise the slope says they have. Taken afresh at each of the three,
  // as it was, this shader drawn for a page's worth of creatures made a Mac's graphics card
  // fault under whatever else began to draw (macOS 27.0.1, Apple M2): see HANDOFF.md, item 45.

  '  vec4 s = snoise(p*uSurf.x + uFlow) * vec4(vec3(uSurf.x*uSurf.y), uSurf.y);',
  '  if (uSurf.w > 0.0005) s += snoise(p*uSurf.z + uFlow2) * vec4(vec3(uSurf.z*uSurf.w), uSurf.w);',
  '  return s;',
  '}',
  // d: the noise at p
  'float disp(vec3 p, float d){',
  '  d *= mix(1.0, 0.35 + 1.1*smoothstep(-0.7, 1.0, p.y), uWisp);',
  '  if (uVoice.x > 0.0005) {',
  '    float a = acos(clamp(dot(p, uFront), -1.0, 1.0));',
  '    d += uVoice.x * sin(a*uVoice.z - uVoice.y) * smoothstep(2.4, 0.2, a);',
  '  }',
  // the face stays calmer than the rest so the eyes keep their shape
  '  d *= 1.0 - uFace*smoothstep(0.3, 0.9, p.z);',
  '  d += uBump[0].w * pow(max(dot(p, uBump[0].xyz), 0.0), uBumpK.x);',
  '  d += uBump[1].w * pow(max(dot(p, uBump[1].xyz), 0.0), uBumpK.y);',
  '  d += uBump[2].w * pow(max(dot(p, uBump[2].xyz), 0.0), uBumpK.z);',
  '  return d;',
  '}',
  'vec3 shape(vec3 p, float d){',
  '  vec3 q = p*(1.0 + disp(p, d));',
  '  q.xz *= uShape.x*(1.0 - uShape.z*q.y);',
  '  q.y *= uShape.y;',
  '  float fb = -uShape.w;',
  '  q.y = fb + log(1.0 + exp((q.y - fb)*9.0))/9.0;',
  '  return q;',
  '}',
  'void main(){',
  '  vPart = aPart;',
  '  vec3 p = normalize(position);',
  '  vec3 pos; vec3 n;',
  '  if (aPart < 0.5) {',
  '    vec3 up = abs(p.y) > 0.92 ? vec3(1.0,0.0,0.0) : vec3(0.0,1.0,0.0);',
  '    vec3 t1 = normalize(cross(up, p)); vec3 t2 = cross(p, t1);',
  '    vec3 pa = normalize(p + t1*0.06); vec3 pb = normalize(p + t2*0.06);',
  '    vec4 s = surf(p);',
  '    pos = shape(p, s.w); vec3 qa = shape(pa, s.w + dot(s.xyz, pa - p)); vec3 qb = shape(pb, s.w + dot(s.xyz, pb - p));',
  '    n = normalize(cross(qa - pos, qb - pos));',
  '    if (dot(n, p) < 0.0) n = -n;',
  '    vObj = p;',
  '  } else {',

  '    vec3 base = shape(uTopDir, surf(uTopDir).w);',
  '    vec3 up = normalize(uTopDir + vec3(0.0, 0.7, 0.0));',
  '    if (aPart < 1.5) {',
  '      float t = position.y;',
  '      pos = base*0.96 + up*uTop.x*t + uBend*t*t + vec3(position.x, 0.0, position.z)*uTop.y*(1.0 - 0.35*t);',
  '      n = normalize(vec3(position.x, 0.25, position.z));',
  '    } else {',
  '      pos = base*0.96 + up*uTop.x + uBend + p*uTop.z;',
  '      n = p;',
  '    }',
  '    pos *= uTop.w;',
  '    vObj = vec3(0.0, 0.0, -1.0);',
  '  }',
  '  vN = normalize(normalMatrix * n);',
  '  vN0 = normalize(normalMatrix * p);',
  '  vec4 mv = modelViewMatrix * vec4(pos, 1.0);',
  '  vV = mv.xyz;',
  '  vec4 clip = projectionMatrix * mv;',
  // PS1-style vertex snap to the low-resolution pixel grid
  '  if (uSnap > 0.5) clip.xy = floor(clip.xy/clip.w*uSnap + 0.5)/uSnap*clip.w;',
  '  gl_Position = clip;',
  '}'
].join('\n');

var BODY_FRAG = [
  'uniform vec3 uCenterV; uniform float uS;',
  'uniform vec3 uDeep; uniform vec3 uShade; uniform vec3 uBase; uniform vec3 uLight; uniform vec3 uSpec; uniform vec3 uColB; uniform vec3 uColC; uniform vec3 uHot; uniform vec3 uRimCol;',
  'uniform mat3 uInner;',
  'uniform vec3 uCorePos; uniform vec3 uCore;',
  'uniform vec3 uGaze; uniform vec2 uGlint; uniform float uRim; uniform float uFacet; uniform float uFeather; uniform float uDetail; uniform float uWisp;',
  'uniform vec4 uGrade; uniform vec4 uAcc; uniform vec4 uAccP; uniform vec3 uRings[4];',
  'uniform float uRetro; uniform vec2 uTone; uniform float uLamp; uniform float uFade;',
  'uniform vec4 uEye; uniform vec4 uEyeS; uniform vec4 uLidL; uniform vec4 uLidR; uniform vec4 uPup; uniform vec4 uEyeK;',
  'uniform vec3 uEyeW; uniform vec3 uEyeD; uniform vec3 uEyeI; uniform vec3 uEyeLn;',
  'uniform vec4 uMouth; uniform vec3 uMouthK;',
  'varying vec3 vN; varying vec3 vV; varying vec3 vObj; varying vec3 vN0; varying float vPart;',
  DITHER,
  PATTERN,
  'void main(){',
  '  vec3 N = normalize(vN);',
  '  if (uFacet > 0.001) {',
  '    vec3 fn = normalize(cross(dFdx(vV), dFdy(vV)));',
  '    N = normalize(mix(N, fn, uFacet));',
  '  }',
  '  vec3 rd = normalize(vV);',
  '  float ndv = clamp(dot(N, -rd), 0.0, 1.0);',
  '  vec3 c = (vV - uCenterV) / uS;',
  '  vec3 L = normalize(vec3(-0.45, 0.65, 0.62));',
  '  vec3 fo = normalize(vObj);',
  '  float fwo = fwidth(fo.y);',
  '  float isBody = step(vPart, 0.5);',
  '  float face = smoothstep(0.4, 0.85, fo.z) * isBody;',
  '  float bay = dth(gl_FragCoord.xy);',
  '  if (uFade < 0.999 && bayer4(gl_FragCoord.xy) > uFade) discard;',
  // light shared by both looks: the reading band, rings passing through, the core
  '  float sy = clamp(c.y, -0.999, 0.999);',
  '  float lon = clamp(c.x / sqrt(1.0 - sy*sy), -1.0, 1.0);',
  '  float bx = (lon - uAccP.y) / mix(0.34, 0.2, uDetail);',
  '  float band = exp(-bx*bx) * uAcc.y;',
  '  float rl = length(c.xy);',
  '  float ring = 0.0;',
  '  for (int i = 0; i < 4; i++) { vec3 R = uRings[i]; float x = (rl - R.x)/R.z; ring += R.y*exp(-x*x); }',
  '  ring *= smoothstep(1.05, 0.9, rl);',
  '  vec3 kv = uCorePos - c; vec3 perp = kv - dot(kv, rd)*rd; float d2 = dot(perp, perp);',
  '  float cs = uCore.y*uCore.y;',
  '  float coreG = exp(-d2/cs);',
  '  vec3 col;',
  '  if (uRetro > 0.5) {',
  // mascot: a few flat tones picked by the light, dithered where they meet
  '    float nl = dot(N, L) + (coreG*uCore.x*0.30 + band*0.6 + ring*0.5)*isBody + uGrade.z*2.2;',
  '    float x = nl + (bay - 0.5)*uTone.y;',
  '    float ti = uTone.x > 3.5 ? step(-0.25, x) + step(0.22, x) + step(0.84, x) : step(-0.05, x)*2.0 + step(0.84, x);',
  '    col = ti < 0.5 ? uDeep : ti < 1.5 ? uShade : ti < 2.5 ? uBase : uLight;',
  '    if (vPart < 0.5) {',
  '      if (uPatP.w > 0.001) col = mix(col, uColB*(0.70 + 0.16*ti), step(uPatQ.y, pattern(fo)) * (1.0 - face));',
  '      if (1.0 - ndv > 0.80 - 0.12*uRim && N.y - N.x*0.5 > 0.15) col = mix(col, uRimCol, 0.45);',
  '    } else if (vPart < 1.5) {',
  '      col = uDeep;',
  '    } else {',
  '      col = (ti < 1.5 ? uColC*0.72 : ti < 2.5 ? uColC : mix(uColC, vec3(1.0), 0.5)) + uHot*uLamp;',
  '    }',
  '    if (uGlint.x > 0.3 && dot(N, uGaze) > uGlint.y) col = uSpec;',
  '  } else {',
  // glass: interior pattern seen through the surface with a little parallax
  '    float dif = smoothstep(-0.4, 1.0, dot(N, L));',
  '    dif = mix(dif, 0.5 + 0.3*dif, uWisp);',
  '    vec3 rr = refract(rd, N, 0.72);',
  '    float v = pattern(uInner * (c + rr*0.30));',
  '    if (uDetail > 0.3) v = mix(v, pattern(uInner * (c + rr*0.85) * 1.25 + 2.7), 0.38);',
  '    float pc = uPatP.w * mix(0.5, 1.0, uDetail) * (1.0 - 0.35*face);',
  '    float shade = clamp(dif + (v - 0.5)*0.30*pc, 0.0, 1.0);',
  '    col = mix(uDeep, uBase, smoothstep(0.04, 0.7, shade));',
  '    col = mix(col, uLight, smoothstep(0.72, 1.0, shade)*0.85);',
  '    col = mix(col, uColB*(0.45 + 0.7*dif), smoothstep(0.35, 0.9, v)*pc*0.6);',
  '    col = mix(col, uColC, smoothstep(0.72, 0.98, v)*pc*0.4);',
  '    col = mix(col, uDeep, smoothstep(0.35, 0.0, v)*pc*0.35);',
  '    col *= mix(0.74, 1.0, smoothstep(0.0, 0.62, ndv));',
  '    col += uLight * (band*0.55 + ring*0.42);',
  '    col += uHot * coreG * uCore.x * 0.5;',
  '    col += vec3(1.0) * exp(-d2/(cs*0.12)) * uCore.x * 0.22;',
  '  }',
  // the face: two eyes (and, on the mascot, a small mouth) painted on the skin in object space
  '  float eyeM = 0.0;',
  '  if (vPart < 0.5 && fo.z > 0.1) {',
  '    float hard = uRetro;',
  '    float fwq = fwo / uEye.w;',
  '    float es = fo.x < 0.0 ? -1.0 : 1.0;',
  '    vec2 q = vec2((fo.x - es*uEye.x)/uEye.z, (fo.y - uEye.y)/uEye.w);',
  '    float en = uEyeS.x;',
  '    float er = pow(pow(abs(q.x), en) + pow(abs(q.y), en), 1.0/en);',
  '    float aa = mix(clamp(fwq*0.8, 0.012, 0.5), 0.0001, hard);',
  '    if (er < 1.7) {',
  '      vec4 lid = es < 0.0 ? uLidL : uLidR;',
  '      float x2 = q.x*q.x;',
  '      float yu = lid.x + lid.z*x2 + lid.w*q.x*es;',
  '      float yl = lid.y + lid.z*x2*0.7 - lid.w*q.x*es*0.3;',
  '      float ym = 0.5*(yu + yl);',
  '      yu = max(yu, ym); yl = min(yl, ym);',
  '      float d = max(er - 1.0, max(q.y - yu, yl - q.y));',
  '      float open = smoothstep(aa, -aa, d);',
  '      float dif0 = smoothstep(-0.4, 1.0, dot(normalize(vN0), L));',
  '      float lsh = smoothstep(0.5, 0.0, yu - q.y);',
  '      vec3 ec = uEyeW * mix((0.80 + 0.24*dif0)*(1.0 - 0.30*lsh), 1.0 - 0.15*step(0.42, lsh), hard);',
  '      vec2 pq = (q - uPup.xy) * vec2(1.0, uPup.z);',
  '      float pr = length(pq) / uEyeS.y;',
  '      float pa = aa / uEyeS.y;',
  '      if (uEyeS.z > 0.001) ec = mix(ec, uEyeI * mix(0.75 + 0.35*dif0, 1.0, hard), smoothstep(1.0 + pa, 1.0 - pa, pr));',
  '      float pin = uEyeS.z > 0.001 ? uEyeS.z : 1.0;',
  '      ec = mix(ec, uEyeD, smoothstep(pin + pa, pin - pa, pr));',
  // highlight; while a command runs it squares off into a blinking cursor
  '      float sq = max(uPup.w, hard*0.7);',
  '      float hmin = hard*0.8*fwq/uEyeS.y;',
  '      vec2 hq = (pq/uEyeS.y - vec2(-0.30, 0.36)) / max(vec2(mix(0.27, 0.17, uPup.w), mix(0.27, 0.33, uPup.w)), vec2(hmin));',
  '      float hn = mix(2.0, 7.0, sq);',
  '      float hr = pow(pow(abs(hq.x), hn) + pow(abs(hq.y), hn), 1.0/hn);',
  '      float hl = smoothstep(1.0 + pa*2.5, 1.0 - pa*2.5, hr) * mix(1.0, uEyeK.w, uPup.w);',
  '      hl += smoothstep(0.15 + pa, 0.15 - pa, length(pq/uEyeS.y - vec2(0.30, -0.32))) * uEyeK.z * 0.7;',
  '      ec = mix(ec, vec3(1.0), clamp(hl, 0.0, 1.0) * uEyeS.w);',
  '      col = mix(col, ec, open);',
  // the lid line is always there, so a closed eye is still a clear mark
  '      float shut = 1.0 - smoothstep(0.0, 0.5, yu - yl);',
  '      float th = max(uEyeK.x * (1.0 + 0.6*smoothstep(-0.3, 0.3, q.y - ym)) * (1.0 + 0.5*shut), hard*mix(0.55, 0.95, shut)*fwq);',
  '      float line = smoothstep(th + aa, max(th - aa, 0.0), abs(d)) * max(uEyeK.y, shut) * mix(1.0, step(abs(q.x), 0.86), shut*hard);',
  '      col = mix(col, uEyeLn, line);',
  '      eyeM = max(open, line);',
  '    }',
  '    if (uMouthK.x > 0.001) {',
  '      vec2 mq = vec2((fo.x - uMouthK.y)/uMouth.y, (fo.y - uMouth.x)/uMouth.y);',
  '      float mx2 = min(mq.x*mq.x, 1.0);',
  '      float mh = max(uMouthK.z + uMouth.z*(1.0 - mx2), hard*0.55*fwo/uMouth.y);',
  '      float md = max(abs(mq.x) - 1.0, abs(mq.y + uMouth.w*(1.0 - mx2)*0.55) - mh);',
  '      float ma = mix(clamp(fwo/uMouth.y*0.8, 0.02, 0.6), 0.0001, hard);',
  '      float mm = smoothstep(ma, -ma, md) * uMouthK.x;',
  '      col = mix(col, uEyeLn, mm);',
  '      eyeM = max(eyeM, mm);',
  '    }',
  '  }',
  '  float alpha = 1.0;',
  '  if (uRetro < 0.5) {',
  '    float fres = pow(1.0 - ndv, 2.6);',
  '    col += uRimCol * fres * uRim * (1.0 - 0.6*uWisp);',
  '    float gd = max(dot(N, uGaze), 0.0);',
  '    float keep = 1.0 - 0.75*eyeM;',
  '    col += (uLight*0.5 + 0.5) * pow(gd, uGlint.y)*0.32 * uGlint.x * (1.0 - 0.5*uWisp) * keep;',
  '    col += vec3(1.0) * pow(gd, uGlint.y*6.0)*0.55 * uGlint.x * (1.0 - 0.6*uWisp) * keep;',
  '    alpha = mix(1.0, smoothstep(0.0, 0.7, ndv), uFeather);',
  '  }',
  '  float lum = dot(col, vec3(0.299, 0.587, 0.114));',
  '  vec3 grey = lum * (uGrade.w > 0.0 ? mix(vec3(1.0), vec3(1.12, 0.96, 0.87), uGrade.w) : mix(vec3(1.0), vec3(0.95, 1.0, 1.07), -uGrade.w));',
  '  col = mix(grey, col, uGrade.x) * uGrade.y;',
  '  if (uRetro > 0.5) {',
  // 15-bit colour, like the hardware
  '    col = floor(clamp(col, 0.0, 1.0)*31.0 + bay)/31.0;',
  '  } else {',
  '    col += uHot*uGrade.z;',
  '    col = col / (1.0 + max(col - 0.82, 0.0)*0.9);',
  '  }',
  '  gl_FragColor = vec4(col*alpha, alpha);',
  '}'
].join('\n');

// The egg: the same low-poly mesh pulled into an egg shape. When it breaks, every triangle becomes a shard
// that flies off around its own centre, the cap first and the cup a beat later.
var CRACK = [
  'uniform vec4 uCrk;',
  'float crackY(vec3 d){ float a = atan(d.x, d.z); return uCrk.x + uCrk.y*(abs(fract(a*uCrk.z/6.2831853 + 0.25) - 0.5)*2.0 - 0.5); }'
].join('\n');
var EGG_VERT = [
  'attribute float aPart; attribute vec3 aTri;',
  'uniform vec3 uEggS; uniform float uBurst; uniform float uSnap;',
  'varying vec3 vN; varying vec3 vV; varying vec3 vObj;',
  CRACK,
  'vec3 eggShape(vec3 p){ vec3 q = p; q.xz *= uEggS.x*(1.0 - uEggS.z*q.y); q.y *= uEggS.y; return q; }',
  'void main(){',
  '  vec3 p = normalize(position);',
  '  vec3 q = eggShape(p);',
  '  vec3 n = normalize(vec3(p.x/uEggS.x, p.y/uEggS.y + uEggS.z*0.6, p.z/uEggS.x));',
  '  if (uBurst > 0.0) {',
  '    vec3 c = normalize(aTri);',
  '    vec3 qc = eggShape(c);',
  '    float top = step(crackY(c), c.y);',
  '    float h = fract(sin(dot(c, vec3(12.9898, 78.233, 37.719)))*43758.5453);',
  '    float go = max(uBurst*(0.75 + 0.5*h) - (1.0 - top)*0.22, 0.0);',
  '    vec3 dir = normalize(c + vec3(0.0, mix(-0.1, 0.9, top), 0.0));',
  '    vec3 off = dir*(1.5*go)*mix(0.55, 1.0, top) + vec3(0.0, -2.0*go*go, 0.0);',
  '    vec3 k = normalize(vec3(c.z, 0.35, -c.x));',
  '    float ang = go*(5.0 + 9.0*h);',
  '    vec3 v = q - qc;',
  '    v = v*cos(ang) + cross(k, v)*sin(ang) + k*dot(k, v)*(1.0 - cos(ang));',
  '    q = qc + v*(1.0 - smoothstep(0.5, 1.0, go)) + off;',
  '  }',
  '  if (aPart > 0.5) q = vec3(0.0);',
  '  vObj = p;',
  '  vN = normalize(normalMatrix * n);',
  '  vec4 mv = modelViewMatrix * vec4(q, 1.0);',
  '  vV = mv.xyz;',
  '  vec4 clip = projectionMatrix * mv;',
  '  if (uSnap > 0.5) clip.xy = floor(clip.xy/clip.w*uSnap + 0.5)/uSnap*clip.w;',
  '  gl_Position = clip;',
  '}'
].join('\n');
var EGG_FRAG = [
  'uniform vec3 uShA; uniform vec3 uShB; uniform vec3 uShC; uniform vec3 uShM; uniform vec3 uCrkCol;',
  'uniform float uBurst; uniform vec2 uTone; uniform float uFacet; uniform vec4 uGrade; uniform float uFade; uniform vec2 uEggM;',
  'varying vec3 vN; varying vec3 vV; varying vec3 vObj;',
  DITHER,
  PATTERN,
  CRACK,
  'void main(){',
  '  vec3 N = normalize(vN);',
  '  vec3 fn = normalize(cross(dFdx(vV), dFdy(vV)));',
  '  N = uBurst > 0.0 ? fn : normalize(mix(N, fn, uFacet));',
  '  vec3 L = normalize(vec3(-0.45, 0.65, 0.62));',
  '  vec3 fo = normalize(vObj);',
  '  float fw = fwidth(fo.y);',
  '  float bay = dth(gl_FragCoord.xy);',
  '  if (uFade < 0.999 && bayer4(gl_FragCoord.xy) > uFade) discard;',
  '  float x = dot(N, L) + uGrade.z*2.0 + (bay - 0.5)*uTone.y;',
  '  float ti = step(-0.1, x) + step(0.8, x);',
  '  vec3 col = ti < 0.5 ? uShA : ti < 1.5 ? uShB : uShC;',
  '  col = mix(col, uShM*(0.8 + 0.12*ti), uEggM.x * step(uEggM.y, pattern(fo)));',
  // the crack: a zigzag round the shell that opens from the front
  '  float a = atan(fo.x, fo.z);',
  '  if (uBurst <= 0.0 && abs(fo.y - crackY(fo)) < max(0.035, 0.8*fw) && abs(a) < uCrk.w*3.2) col = uCrkCol;',
  '  col = floor(clamp(col*uGrade.y, 0.0, 1.0)*31.0 + bay)/31.0;',
  '  gl_FragColor = vec4(col, 1.0);',
  '}'
].join('\n');

var HALO_VERT = 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
var HALO_FRAG = [
  'uniform vec2 uC; uniform vec2 uSc; uniform float uRoll;',
  'uniform vec3 uHaloCol; uniform vec3 uRingCol; uniform float uHalo; uniform float uDark; uniform float uRetro;',
  'uniform vec3 uRings[4]; uniform vec3 uLobe; uniform vec3 uGround; uniform float uRs;',
  'varying vec2 vP;',
  DITHER,
  'void main(){',
  '  vec2 d = vP - uC; float cr = cos(uRoll); float sr = sin(uRoll);',
  '  d = vec2(cr*d.x + sr*d.y, -sr*d.x + cr*d.y) / uSc;',
  '  float r = length(d);',
  '  float o = max(r - 0.7, 0.0);',
  '  float g = exp(-o*o*7.0)*0.82 + exp(-o*2.6)*0.18;',
  '  g *= 1.0 + uLobe.z * dot(d/(r + 0.0001), uLobe.xy);',
  '  float a = g * uHalo;',
  '  vec2 gp = (vP - vec2(uC.x, uGround.z)) / vec2(uSc.x*0.62*uGround.y, mix(0.04, 0.055, uRetro));',
  '  vec3 poolCol = mix(vec3(0.03, 0.06, 0.06), uHaloCol*0.55, uDark);',
  '  if (uRetro > 0.5) {',
  // mascot: no soft glow, just crisp pixel rings that break into dither as they fade, and a flat blob shadow
  '    float bay = dth(gl_FragCoord.xy);',
  '    float rc = length(vP - uC) / uRs;',
  '    float rg = 0.0;',
  '    for (int i = 0; i < 4; i++) { vec3 R = uRings[i]; rg = max(rg, step(abs(rc - R.x), R.z*0.42) * step(bay*0.9, R.y*1.8)); }',
  '    rg *= step(0.98, r) * step(length(vP), 0.97);',
  '    float al = rg;',
  '    vec3 col = uRingCol;',
  '    float pool = step(pow(abs(gp.x), 3.0) + pow(abs(gp.y), 3.0), 1.0) * min(uGround.x*1.1, 0.3);',
  '    gl_FragColor = vec4(col*al + poolCol*pool*(1.0 - al), al + pool*(1.0 - al));',
  '  } else {',
  '    float ring = 0.0;',
  '    float rc = length(vP - uC) / uRs;',
  '    for (int i = 0; i < 4; i++) { vec3 R = uRings[i]; float x = (rc - R.x)/R.z; ring += R.y*exp(-x*x); }',
  '    ring *= smoothstep(0.9, 1.08, r);',
  '    float win = smoothstep(1.0, 0.5, length(vP));',
  '    vec3 col = (uHaloCol*a + uRingCol*ring) * win;',
  '    float al = (a + ring) * win;',
  '    float pool = exp(-dot(gp, gp)) * uGround.x;',
  '    col += poolCol * pool; al += pool;',
  '    gl_FragColor = vec4(col, al * mix(1.0, 0.3, uDark));',
  '  }',
  '}'
].join('\n');

var POINTS_VERT = [
  'attribute vec4 aRnd; attribute float aIdx;',
  'uniform vec4 uSeed; uniform vec2 uCount; uniform vec2 uT; uniform float uPx; uniform vec3 uCenterW; uniform float uS;',
  'uniform float uInward; uniform float uPush; uniform vec2 uAl; uniform vec2 uSatTilt; uniform float uRetro;',
  'varying float vA; varying float vKind;',
  'mat2 rot(float a){ float c = cos(a); float s = sin(a); return mat2(c, s, -s, c); }',
  'void main(){',
  '  vec4 h = fract(aRnd + uSeed);',
  '  float isSat = step(aIdx, uCount.x - 0.5);',
  '  float on = step(aIdx, uCount.x + uCount.y - 0.5);',
  '  float rad = mix(1.10 + 0.52*h.x*h.x, 1.36 + 0.30*h.x, isSat);',
  '  float spd = mix(0.3 + 0.8*h.y, 0.45 + 0.3*h.y, isSat) * mix(h.z > 0.5 ? 1.0 : -1.0, 1.0, isSat);',
  '  float t = mix(uT.x, uT.y, isSat);',
  '  float ph = h.w*6.2831853 + t*spd;',
  '  float fall = fract(h.w*3.7 + uT.x*0.2);',
  '  float m = uInward*(1.0 - isSat);',
  '  rad = mix(rad, mix(1.95, 0.98, fall*fall), m) + uPush*(1.0 - isSat)*0.14*(0.4 + h.y);',
  '  vec3 o = vec3(cos(ph), 0.0, sin(ph)) * rad;',
  '  float a1 = mix((h.x - 0.5)*2.6, uSatTilt.x + (h.y - 0.5)*0.5, isSat);',
  '  float a2 = mix((h.y - 0.5)*2.2, uSatTilt.y + (h.x - 0.5)*0.4, isSat);',
  '  o.yz = rot(a1)*o.yz; o.xy = rot(a2)*o.xy;',
  '  vec4 mv = viewMatrix * vec4(uCenterW + o*uS, 1.0);',
  '  gl_Position = on > 0.5 ? projectionMatrix * mv : vec4(3.0, 3.0, 3.0, 1.0);',
  '  float size = mix(0.06 + 0.07*h.z, 0.10 + 0.07*h.z, isSat) * uS * uPx * (3.7320508 / -mv.z);',
  '  gl_PointSize = uRetro > 0.5 ? max(1.0, floor(size*mix(0.6, 1.0, isSat) + 0.5)) : max(1.5, size);',
  '  float tw = 0.6 + 0.4*sin(t*1.7*(0.5 + h.x) + h.y*40.0);',
  '  float fadeIn = mix(1.0, smoothstep(0.0, 0.18, fall)*smoothstep(1.0, 0.8, fall), m);',
  '  float occ = mix(1.0, smoothstep(0.94, 1.12, length(o.xy)), step(o.z, 0.0));',
  '  vA = on * occ * mix(uAl.x*tw*fadeIn, uAl.y, isSat);',
  '  vKind = isSat;',

}

let cur = "start"
let real = false
const stage = document.getElementById("stage")
const fitBox = document.getElementById("fit")

// --- The creature, drawn live by the app's own code where the page can; a still where it cannot.
let core = null
try {
  if (window.THREE && window.AgentOrbCore && document.createElement("canvas").getContext("webgl")) core = window.AgentOrbCore(window.THREE)
} catch {
  core = null
}
const orbs = new Map()
function orbState() {
  if (!K.on) return ["idle"]
  if (K.phase === "speaking") return ["speaking"]
  if (K.phase === "working") return ["working", K.variant]
  if (K.phase === "hearing" && !K.muted) return ["listening"]
  if (K.phase === "connecting" || K.phase === "asking") return ["thinking"]
  return ["idle"]
}
const still = (who, state) => (who === "juniper" ? (ST[state] ?? ST.idle) : C[D[who].still])
function mountOrbs() {
  const seen = new Set()
  for (const slot of stage.querySelectorAll("[data-orb]")) {
    const key = slot.dataset.orb
    const who = slot.dataset.who
    const size = +slot.dataset.size
    const fixed = slot.dataset.state || null
    const dark = !!slot.dataset.dark || stage.classList.contains("dk")
    seen.add(key)
    if (!core) {
      slot.innerHTML = `<img class="under" src="${still(who, fixed ?? orbState()[0])}" alt="">`
      continue
    }
    // A still stands in the slot until the live one has a picture, so it is never empty.
    slot.innerHTML = `<img class="under" src="${still(who, fixed ?? orbState()[0])}" alt="">`
    let o = orbs.get(key)
    if (!o) {
      const canvas = document.createElement("canvas")
      canvas.style.cssText = `width:${size}px;height:${size}px`
      slot.appendChild(canvas)
      o = { canvas, size, who, ready: false, orb: core.createOrb(canvas, { seed: D[who].seed, color: D[who].color, size, dark }) }
      orbs.set(key, o)
    } else slot.appendChild(o.canvas)
    slot.classList.toggle("live", o.ready)
    o.fixed = fixed
    o.orb.setTheme(dark)
    o.orb.paused = false
  }
  for (const [key, o] of orbs) if (!seen.has(key)) o.orb.paused = true
  syncOrbs()
}
function syncOrbs() {
  const [state, variant] = orbState()
  for (const slot of stage.querySelectorAll("[data-orb]:not(.live)")) {
    const img = slot.firstElementChild
    const src = still(slot.dataset.who, slot.dataset.state || state)
    if (img && img.getAttribute("src") !== src) img.setAttribute("src", src)
  }
  if (!core) return
  for (const o of orbs.values()) {
    if (o.orb.paused) continue
    if (o.fixed) o.orb.setState(o.fixed)
    else if (o.who !== "juniper") o.orb.setState("idle")
    else o.orb.setState(state, variant)
  }
}
const feed = (kind) => {
  if (core) for (const o of orbs.values()) if (!o.orb.paused && !o.fixed && o.who === "juniper") kind === "you" ? o.orb.feed("key") : o.orb.feed("token", 0.55 + Math.random() * 0.45)
}
// A live one takes over from its still once the middle of its picture has something in it.
setInterval(() => {
  for (const o of orbs.values()) {
    if (o.ready || o.orb.paused) continue
    try {
      const c = o.canvas
      if (c.getContext("2d").getImageData(c.width >> 1, c.height >> 1, 1, 1).data[3] > 0) {
        o.ready = true
        c.parentElement?.classList.add("live")
      }
    } catch {
      // No picture to read: the still stays.
    }
  }
}, 150)

function fit() {
  const room = document.getElementById("wrap").clientWidth
  const k = real ? 1 : Math.min(1, room / W)
  stage.style.transform = `scale(${k})`
  fitBox.style.height = `${H * k}px`
  fitBox.style.width = `${W * k}px`
}

// What changes many times a second (the clock, a word arriving) is written into the page as it
// stands; only a new line or a new scene draws it again.
function paint() {
  const root = stage.firstElementChild
  if (root) root.dataset.phase = ph()
  for (const el of stage.querySelectorAll("[data-b]")) {
    const b = el.dataset.b
    const text = b === "time" ? fmt(K.sec) : b === "phase" ? phaseText() : b === "you" ? lastYou() : lastSay()
    if (el.textContent !== text) el.textContent = text
  }
  for (const el of stage.querySelectorAll("[data-line]")) {
    const line = K.lines[+el.dataset.line]
    if (line && el.textContent !== line.text) el.textContent = line.text
  }
  for (const img of stage.querySelectorAll("[data-still]")) {
    const src = still("juniper", orbState()[0])
    if (img.getAttribute("src") !== src) img.setAttribute("src", src)
  }
  syncOrbs()
}

function render() {
  stage.innerHTML = scenes[cur]()
  document.getElementById("groups").innerHTML =
    nav
      .map(
        ([label, items]) =>
          `<div class="ng">${label ? `<span>${label}</span>` : ""}${items.map(([key, text]) => `<button class="nb${cur === key ? " on" : ""}" data-go="${key}">${text}</button>`).join("")}</div>`,
      )
      .join("") +
    `<div class="ng"><button class="nb act go" data-act="play">▶ Play the call</button><button class="nb act" data-act="dark">${stage.classList.contains("dk") ? "Light" : "Dark"}</button><button class="nb act" data-act="real">${
      real ? "Fit to width" : "Full size"
    }</button></div>`
  document.getElementById("cap").innerHTML = caps[cur]
  document.getElementById("wrap").classList.toggle("real", real)
  mountOrbs()
  fit()
}

// --- Playing the call.
let run = 0
const wait = (ms) => new Promise((done) => setTimeout(done, ms))
async function speak(who, text, alive) {
  const line = { who, text: "", now: true }
  K.lines.push(line)
  K.phase = who === "you" ? "hearing" : "speaking"
  render()
  const words = text.split(" ")
  for (let i = 0; i < words.length; i++) {
    if (!alive()) return
    line.text = words.slice(0, i + 1).join(" ")
    feed(who)
    paint()
    await wait((who === "you" ? 200 : 235) + (/[,.?!]$/.test(words[i]) ? 200 : 0))
  }
  if (!alive()) return
  line.now = false
  K.phase = "listening"
  render()
}
async function play() {
  const mine = ++run
  const alive = () => mine === run
  K = { ...fresh(), on: true, phase: "connecting", muted: false }
  if (!CALL.has(cur)) cur = "a"
  render()
  await wait(1700)
  if (!alive()) return
  K.phase = "listening"
  render()
  await wait(900)
  for (const step of SCRIPT) {
    if (!alive()) return
    if (step.work) {
      const line = { work: step.work, kind: step.kind, done: false }
      K.lines.push(line)
      K.phase = "working"
      K.variant = step.kind
      render()
      await wait(step.take)
      if (!alive()) return
      line.work = step.done
      line.done = true
      K.phase = "listening"
      render()
    } else await speak(step.you ? "you" : "dood", step.you ?? step.say, alive)
    await wait(step.gap ?? 550)
  }
}
setInterval(() => {
  if (K.on && K.phase !== "asking" && K.phase !== "connecting") {
    K.sec += 1
    paint()
  }
}, 1000)

function hangUp() {
  run += 1
  if (K.on) R = { sec: Math.max(K.sec, 1), lines: K.lines.filter((l) => !l.work || l.done).map((l) => ({ ...l, now: false })), open: false }
  K = fresh()
  cur = "after"
  render()
}

function go(name) {
  if (!scenes[name]) return
  if (name === "after" && K.on) return hangUp()
  if (CALL.has(name)) {
    if (!K.on) K = snapshot()
  } else {
    run += 1
    K = fresh()
  }
  cur = name
  history.replaceState(null, "", `#${name}`)
  render()
}

document.addEventListener("click", (event) => {
  const v = event.target.closest("[data-voice]")
  if (v) {
    voice = +v.dataset.voice
    render()
    return
  }
  const act = event.target.closest("[data-act]")
  if (act && act.dataset.act) {
    const what = act.dataset.act
    if (what === "play") play()
    else if (what === "call") {
      if (asked) play()
      else {
        run += 1
        K = { ...fresh(), on: true, phase: "asking" }
        cur = "a"
        render()
      }
    } else if (what === "allow") {
      asked = true
      play()
    } else if (what === "block") go("start")
    else if (what === "end") hangUp()
    else {
      if (what === "mute") K.muted = !K.muted
      if (what === "cc") K.cc = !K.cc
      if (what === "said") R.open = !R.open
      if (what === "dark") stage.classList.toggle("dk")
      if (what === "real") real = !real
      render()
    }
    return
  }
  const to = event.target.closest("[data-go]")
  if (to && to.dataset.go) go(to.dataset.go)
})
window.addEventListener("resize", fit)
if (scenes[window.START]) cur = window.START
if (scenes[location.hash.slice(1)]) cur = location.hash.slice(1)
if (CALL.has(cur)) K = snapshot()
render()
</script>
</body>
