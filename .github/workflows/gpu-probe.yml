name: GPU probe (temporary)
on:
  push:
    branches: [bb/fix-missing-3d-models-on-macos-electron-thr_njsqwi8kgj]
jobs:
  probe:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          desktop: "true"
      - run: sw_vers; uname -m; system_profiler SPDisplaysDataType || true
      - run: pnpm build
      - name: Unpacked
        run: node probe/gpu.mjs || true
      - name: Pack
        run: pnpm exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
      - name: Signatures
        run: |
          app="release/mac-universal/Do Computer.app"
          ls "$app/Contents/Frameworks" || true
          for part in "$app" "$app/Contents/Frameworks/Do Computer Helper (GPU).app" "$app/Contents/Frameworks/Do Computer Helper (Renderer).app" "$app/Contents/Frameworks/Electron Framework.framework"; do
            echo "=== $part"
            codesign -dvvv --entitlements - "$part" 2>&1 || true
          done
          ls -la "$app/Contents/Frameworks/Electron Framework.framework/Versions/A/Libraries" || true
          lipo -info "$app/Contents/MacOS/Do Computer" "$app/Contents/Frameworks/Electron Framework.framework/Versions/A/Libraries/"*.dylib || true
          electron="$(node -p "require('electron')")"
          echo "=== stock Electron"
          codesign -dvvv --entitlements - "${electron%/Contents/MacOS/Electron}" 2>&1 || true
          codesign -dvvv --entitlements - "${electron%/Contents/MacOS/Electron}/Contents/Frameworks/Electron Helper (GPU).app" 2>&1 || true
      - name: Packed
        run: node probe/gpu.mjs || true
        env:
          DC_DESKTOP_APP: ${{ github.workspace }}/apps/desktop/release/mac-universal/Do Computer.app/Contents/MacOS/Do Computer
      - name: Packed, GPU blocklist ignored
        run: node probe/gpu.mjs || true
        env:
          DC_DESKTOP_APP: ${{ github.workspace }}/apps/desktop/release/mac-universal/Do Computer.app/Contents/MacOS/Do Computer
          PROBE_ARGS: --ignore-gpu-blocklist
      - name: Packed, no sandbox
        run: node probe/gpu.mjs || true
        env:
          DC_DESKTOP_APP: ${{ github.workspace }}/apps/desktop/release/mac-universal/Do Computer.app/Contents/MacOS/Do Computer
          PROBE_ARGS: --no-sandbox
      - name: Released
        run: |
          gh release download desktop-v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir /tmp/released
          hdiutil attach /tmp/released/*.dmg -nobrowse -mountpoint /tmp/dmg
          cp -R "/tmp/dmg/Do Computer.app" /tmp/released/
          codesign --verify --deep --strict --verbose=2 "/tmp/released/Do Computer.app" || true
          DC_DESKTOP_APP="/tmp/released/Do Computer.app/Contents/MacOS/Do Computer" node probe/gpu.mjs || true
        env:
          GH_TOKEN: ${{ github.token }}
