name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run from the Actions tab to deploy again without a new commit.
  workflow_dispatch:

# A newer push to a branch, or to a pull request, replaces the tests of the older one, on main
# too: what the newer one deploys has the older one's changes in it. This is said job by job and
# not once for the run, so that a deploy already under way is left to finish.
#
# The checks run side by side, so a push waits for the slowest of them and not for their sum.
# A machine is paid for by the whole minute, though, so work of less than a minute shares one.
jobs:
  # The checks, and the unit and integration tests of everything but the agent, on Node and
  # inside the Workers runtime.
  check:
    name: check, test (the rest)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-check-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check
      # Whether or not the checks passed, so that one run says everything that is wrong.
      - if: success() || failure()
        run: pnpm --filter '!@durable-computer/agent' run test

  # The agent's tests take as long as all the others together, so they have a machine of their
  # own.
  test:
    name: test (agent)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter '@durable-computer/agent' run test

  # Browser tests against the built Node server, with a real daemon. Each file of them has a
  # server to itself, so the files are dealt out over several machines, where two run at a time:
  # one for each core. Every machine spends most of a minute getting ready, and that is paid for
  # once per machine, so more of them finish sooner and cost more. Three take about three
  # minutes each; five took two and a half, for a third more money.
  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-${{ matrix.share }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the server, fetching the browser meanwhile
        run: |
          pnpm --filter @durable-computer/web exec playwright install --only-shell chromium &
          pnpm --filter @durable-computer/web build:node
          wait $!
      - name: Run this machine's share of the files
        working-directory: apps/web
        run: |
          files=$(ls e2e/*.spec.ts | grep -v mobile.spec.ts | awk 'NR % ${{ strategy.job-total }} == ${{ strategy.job-index }}')
          echo "$files"
          # Asked for no files, Playwright runs them all.
          [ -n "$files" ] || exit 0
          pnpm exec playwright test --project=web $files
      # What a failed test left: of one that passed when it was run again, too.
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: e2e-${{ matrix.share }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The mobile app's screens, through its web build. Making that build takes longer than the
  # tests do, so it is kept from one run to the next for as long as nothing it is made of changes.
  e2e-mobile:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-mobile-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        id: mobile-build
        with:
          path: apps/mobile/dist-web-test
          key: mobile-web-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app/**', 'apps/mobile/src/**', 'apps/mobile/*.js', 'apps/mobile/*.ts', 'apps/mobile/*.json', 'packages/client/src/**', 'packages/client/package.json', 'packages/mascot/src/**', 'packages/mascot/package.json', 'packages/protocol/src/**', 'packages/protocol/package.json') }}
      - name: Build the server, fetching the browser meanwhile
        run: |
          pnpm --filter @durable-computer/web exec playwright install --only-shell chromium &
          pnpm --filter @durable-computer/web build:node
          wait $!
      - if: steps.mobile-build.outputs.cache-hit != 'true'
        run: pnpm --filter @durable-computer/mobile export:web:test
      # Without the build these tests skip themselves, which here would pass for nothing.
      - run: test -f apps/mobile/dist-web-test/index.html
      - run: pnpm --filter @durable-computer/web exec playwright test --project=mobile
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: e2e-mobile
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Deploys to Cloudflare once the tests pass on main. It only runs where the repository says
  # which deployment is its own: the variable DC_D1_DATABASE_ID, with the secrets
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. The rest of the deployment's settings are
  # variables too, read by apps/web/scripts/deploy-settings.mjs; none of them is in the code.
  deploy:
    needs: [check, test, e2e, e2e-mobile]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DC_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    # One deploy at a time, and never one cut off halfway.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @durable-computer/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DC_D1_DATABASE_ID: ${{ vars.DC_D1_DATABASE_ID }}
          DC_ROUTE: ${{ vars.DC_ROUTE }}
          DC_ROUTE_ZONE: ${{ vars.DC_ROUTE_ZONE }}
          DC_CUSTOM_DOMAIN: ${{ vars.DC_CUSTOM_DOMAIN }}
          DC_BASE_URL: ${{ vars.DC_BASE_URL }}
          DC_SIGNUP: ${{ vars.DC_SIGNUP }}
          DC_LANDING: ${{ vars.DC_LANDING }}
          DC_ALLOWED_EMAILS: ${{ vars.DC_ALLOWED_EMAILS }}
          DC_DEFAULT_MODEL: ${{ vars.DC_DEFAULT_MODEL }}
          DC_MODELS: ${{ vars.DC_MODELS }}
          DC_ADMIN_EMAILS: ${{ vars.DC_ADMIN_EMAILS }}
          DC_SEARCH_MODEL: ${{ vars.DC_SEARCH_MODEL }}
          DC_JUDGE_MODEL: ${{ vars.DC_JUDGE_MODEL }}
          DC_REVIEW_MODEL: ${{ vars.DC_REVIEW_MODEL }}
          DC_SANDBOX: ${{ vars.DC_SANDBOX }}
          DC_SANDBOX_KINDS: ${{ vars.DC_SANDBOX_KINDS }}
          DC_EMAIL_FROM: ${{ vars.DC_EMAIL_FROM }}
