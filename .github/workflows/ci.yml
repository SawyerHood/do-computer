name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Unit and integration tests, on Node and inside the Workers runtime.
      - run: pnpm test
      # Browser tests against the built Node server, with a real daemon.
      - run: pnpm --filter @durable-computer/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
