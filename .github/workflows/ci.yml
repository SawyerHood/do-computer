name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run from the Actions tab to deploy again without a new commit.
  workflow_dispatch:

# A pull request's newer push replaces the run of its older one. Runs on main are each left to
# finish, since they deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The checks run side by side, each on a machine of its own, so a push waits for the slowest of
# them and not for their sum.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check

  # Unit and integration tests, on Node and inside the Workers runtime.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Browser tests against the built Node server, with a real daemon. Each file of them has a
  # server to itself, so they are dealt out over several machines.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the server, fetching the browser meanwhile
        run: |
          pnpm --filter @durable-computer/web exec playwright install --only-shell chromium &
          pnpm --filter @durable-computer/web build:node
          wait $!
      - run: pnpm --filter @durable-computer/web exec playwright test --project=web --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  # The mobile app's screens, through its web build. Making that build takes longer than the
  # tests do, so it is kept from one run to the next for as long as nothing it is made of changes.
  e2e-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        id: mobile-build
        with:
          path: apps/mobile/dist-web-test
          key: mobile-web-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app/**', 'apps/mobile/src/**', 'apps/mobile/*.js', 'apps/mobile/*.ts', 'apps/mobile/*.json', 'packages/client/src/**', 'packages/client/package.json', 'packages/mascot/src/**', 'packages/mascot/package.json', 'packages/protocol/src/**', 'packages/protocol/package.json') }}
      - name: Build the server, fetching the browser meanwhile
        run: |
          pnpm --filter @durable-computer/web exec playwright install --only-shell chromium &
          pnpm --filter @durable-computer/web build:node
          wait $!
      - if: steps.mobile-build.outputs.cache-hit != 'true'
        run: pnpm --filter @durable-computer/mobile export:web:test
      # Without the build these tests skip themselves, which here would pass for nothing.
      - run: test -f apps/mobile/dist-web-test/index.html
      - run: pnpm --filter @durable-computer/web exec playwright test --project=mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-mobile
          path: apps/web/test-results
          retention-days: 7

  # Deploys to Cloudflare once the tests pass on main. It only runs where the repository says
  # which deployment is its own: the variable DC_D1_DATABASE_ID, with the secrets
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. The rest of the deployment's settings are
  # variables too, read by apps/web/scripts/deploy-settings.mjs; none of them is in the code.
  deploy:
    needs: [check, test, e2e, e2e-mobile]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DC_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    # One deploy at a time, and never one cut off halfway.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @durable-computer/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DC_D1_DATABASE_ID: ${{ vars.DC_D1_DATABASE_ID }}
          DC_ROUTE: ${{ vars.DC_ROUTE }}
          DC_ROUTE_ZONE: ${{ vars.DC_ROUTE_ZONE }}
          DC_CUSTOM_DOMAIN: ${{ vars.DC_CUSTOM_DOMAIN }}
          DC_BASE_URL: ${{ vars.DC_BASE_URL }}
          DC_SIGNUP: ${{ vars.DC_SIGNUP }}
          DC_ALLOWED_EMAILS: ${{ vars.DC_ALLOWED_EMAILS }}
          DC_DEFAULT_MODEL: ${{ vars.DC_DEFAULT_MODEL }}
          DC_SEARCH_MODEL: ${{ vars.DC_SEARCH_MODEL }}
          DC_JUDGE_MODEL: ${{ vars.DC_JUDGE_MODEL }}
          DC_SANDBOX: ${{ vars.DC_SANDBOX }}
          DC_SANDBOX_KINDS: ${{ vars.DC_SANDBOX_KINDS }}
          DC_EMAIL_FROM: ${{ vars.DC_EMAIL_FROM }}
