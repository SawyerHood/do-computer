name: Desktop

# The desktop app, built, tested and packed on each system it runs on. It is the only part of
# the project that runs on Windows and macOS, so this is where the daemon is tried there too.
#
# A change to what the daemon and the server say to each other (packages/protocol) does not
# start it: those happen most days, and are the same on every system.
on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - apps/desktop/**
      - apps/daemon/**
      - packages/computers/**
      # What starts the server the app brings with it. The server's own code is tested by the
      # main workflow, and is packed into the app as it is when the app is next built.
      - apps/web/server.node.mjs
      - apps/web/vite.config.ts
      - apps/web/scripts/build-packed.mjs
      - .github/workflows/desktop.yml
      - .github/actions/setup/**
      - pnpm-lock.yaml
  pull_request:
    paths:
      - apps/desktop/**
      - apps/daemon/**
      - packages/computers/**
      - apps/web/server.node.mjs
      - apps/web/vite.config.ts
      - apps/web/scripts/build-packed.mjs
      - .github/workflows/desktop.yml
      - .github/actions/setup/**
      - pnpm-lock.yaml
  # Run from the Actions tab to pack the app without a new commit.
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        # A minute of macOS costs ten of Linux, so a pull request goes without it. Main, a tag
        # and a run from the Actions tab have all three: to try a branch on macOS, run this
        # workflow on it from there.
        name: ${{ fromJSON(github.event_name == 'pull_request' && '["Linux", "Windows"]' || '["Linux", "macOS", "Windows"]') }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.name == 'macOS' && 'macos-latest' || matrix.name == 'Windows' && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    env:
      # The Mac's app is signed where the repository has a certificate for it: CSC_LINK, a
      # Developer ID Application certificate as a .p12 in base64, and CSC_KEY_PASSWORD. Apple
      # checks it too (APPLE_API_KEY_P8, an App Store Connect key, with APPLE_API_KEY_ID and
      # APPLE_API_ISSUER) for a release and for a run from the Actions tab. That takes minutes
      # of a Mac's time, which a push to main goes without.
      SIGN_MAC: ${{ matrix.name == 'macOS' && secrets.CSC_LINK != '' }}
      NOTARIZE_MAC: ${{ matrix.name == 'macOS' && secrets.CSC_LINK != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          desktop: "true"
      # What the daemon does to a machine, on this kind of machine. The tests written for
      # Linux run in the main workflow; these are the ones that hold on every system.
      - name: Test the daemon and the app's own code
        run: |
          pnpm --filter @do-computer/computers exec vitest run test/windows.test.ts
          pnpm --filter @do-computer/daemon --filter @do-computer/desktop run test
      - name: Build the server and the app
        run: |
          pnpm --filter @do-computer/web build:node
          pnpm --filter @do-computer/desktop build
        env:
          # The deployment the app opens without asking, where the repository has one.
          DC_DESKTOP_SERVER: ${{ vars.DC_BASE_URL }}
      # The app itself: a first run, pairing, an agent working on this machine, quitting; and
      # the app with no server anywhere, running the one it brings.
      - name: Run the app
        working-directory: apps/desktop
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} pnpm exec playwright test
      # The certificate goes into a keychain made here, which the packing is then pointed at.
      # electron-builder makes one itself when it is given CSC_LINK, but hands macOS the
      # certificate's password where the keychain's is wanted, and macOS 26 refuses that.
      - name: Put the Mac's certificate in a keychain
        if: env.SIGN_MAC == 'true'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MAC_CSC_KEY_PASSWORD" -f pkcs12 \
            -k "$keychain" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certificate.p12"
          # Apple's own certificate between its root and a Developer ID, without which the
          # one just put in is not taken for valid on a Mac that has not met it. GitHub's Macs
          # have, and say it already exists: whether the certificate is valid is asked below.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          # Lets codesign use the key without a question nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Pack it
        working-directory: apps/desktop
        # A release is the version its tag says, in the app and in the names of its files. It
        # is also told where releases are published, which is where it then looks for a newer
        # one of itself: the files of whichever release is the newest. Packing writes down
        # beside each what that is (latest*.yml), for the release before it to read.
        run: |
          flags=()
          case "$GITHUB_REF" in
            refs/tags/desktop-v*)
              flags+=("-c.extraMetadata.version=${GITHUB_REF_NAME#desktop-v}")
              flags+=(-c.publish.provider=generic)
              flags+=("-c.publish.url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download")
              ;;
          esac
          if [ "$SIGN_MAC" = true ]; then
            # The certificate is found in the keychain the step before made (CSC_KEYCHAIN).
            # One that will not sign fails the run. Left alone, the app is packed unsigned
            # and the run passes.
            flags+=(-c.mac.forceCodeSigning=true)
            if [ "$NOTARIZE_MAC" = true ]; then
              printf '%s\n' "$MAC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY_ID="$MAC_API_KEY_ID" APPLE_API_ISSUER="$MAC_API_ISSUER"
            fi
          else
            # Nobody's certificate signs it. Without this, one on the machine would be tried.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # On macOS it is still sealed, by no one.
            flags+=(--config electron-builder.unsigned.yml)
          fi
          pnpm exec electron-builder --publish never "${flags[@]}"
        env:
          # A pull request's build is sealed too.
          CSC_FOR_PULL_REQUEST: "true"
          MAC_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MAC_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MAC_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Check that the macOS app is sealed
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          app="release/mac-universal/Do Computer.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Where there is a certificate, that it was the certificate that signed it, and
          # where Apple was asked, that its answer is in the app.
          if [ "$SIGN_MAC" = true ]; then
            signed=$(codesign --display --verbose=2 "$app" 2>&1)
            echo "$signed"
            echo "$signed" | grep "^Authority=Developer ID Application" > /dev/null
            echo "$signed" | grep "^Runtime Version=" > /dev/null
          fi
          if [ "$NOTARIZE_MAC" = true ]; then
            xcrun stapler validate "$app"
          fi
      - name: Run the packed app
        working-directory: apps/desktop
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} pnpm exec playwright test
        env:
          # A release looks for a newer one of itself. Not while it is being tested.
          DC_DESKTOP_UPDATES: ""
          DC_DESKTOP_APP: ${{ github.workspace }}/apps/desktop/release/${{ runner.os == 'macOS' && 'mac-universal/Do Computer.app/Contents/MacOS/Do Computer' || runner.os == 'Windows' && 'win-unpacked/Do Computer.exe' || 'linux-unpacked/do-computer' }}
      - uses: actions/upload-artifact@v4
        with:
          name: do-computer-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          # Three apps are most of half a gigabyte, kept at a price for every day. A release
          # has its own copies; these are for trying a build, the longest when one was asked for.
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 1 }}
      # What a failed test left: of one that passed when it was run again, too.
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: desktop-test-results-${{ matrix.name }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  # A tag named desktop-v… makes a release with what was packed, once it ran on every system.
  release:
    needs: app
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packed
          pattern: do-computer-*
          merge-multiple: true
      - run: |
          if [ "$SIGNED" = true ]; then
            warning="The macOS app is signed and checked by Apple. Nobody has signed the Windows one, so Windows warns before opening it: choose More info, then Run anyway."
          else
            warning="Nobody has signed these, so macOS and Windows warn before opening them: on macOS allow the app under System Settings, Privacy & Security; on Windows choose More info, then Run anyway."
          fi
          cat > notes.md <<'NOTES'
          Do Computer in a window of its own, which is also the daemon that lets your Doods work on the computer it runs on.

          - **macOS**: the `.dmg`, for Apple's chips and Intel's alike.
          - **Windows**: the `.exe` installer. Install [Git for Windows](https://gitforwindows.org) too, so that Doods' commands run in bash.
          - **Linux**: the `.AppImage`. Make it executable (`chmod +x`) and run it.

          Once installed it keeps itself up to date. The `.zip` and the `.yml` files are what it reads to do so.

          NOTES
          echo "$warning" >> notes.md
          gh release create "$GITHUB_REF_NAME" packed/* --repo "$GITHUB_REPOSITORY" \
            --title "Do Computer for desktop ${GITHUB_REF_NAME#desktop-v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.CSC_LINK != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
